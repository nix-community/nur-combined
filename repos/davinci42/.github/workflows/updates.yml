---
name: Package updates

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-updates
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.repository == 'DaVinci42/nur-packages' &&
      github.ref == format(
        'refs/heads/{0}',
        github.event.repository.default_branch
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
      NIXPKGS_ALLOW_UNFREE: '1'
      GH_PROMPT_DISABLED: '1'
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Update flake.lock, validate packages, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          base=$(git rev-parse HEAD)
          nix flake update
          git diff --quiet flake.lock ||
            git commit -am "chore(flake): update nixpkgs"
          nix develop -c just check-updates --update --commit || pkg_failed=1
          head=$(git rev-parse HEAD)
          if [ "$head" != "$base" ]; then
            nix develop -c just check-all
            target="refs/heads/${{ github.event.repository.default_branch }}"
            git push origin "HEAD:$target"
            nur_url='https://nur-update.nix-community.org/update?repo=davinci42'
            for attempt in 1 2 3 4 5; do
              status=$(
                curl -sS -o /dev/null -w '%{http_code}' -X POST "$nur_url"
              ) || status=000
              case "$status" in
                2*) break ;;
                429|5*|000) sleep $((attempt * 15)) ;;
                *)
                  echo "::error::NUR index refresh failed with HTTP $status"
                  exit 1
                  ;;
              esac
            done
            case "$status" in
              2*) ;;
              *)
                echo "::warning::NUR index refresh still rate-limited ($status)"
                ;;
            esac
          fi
          exit "${pkg_failed:-0}"

name: Package updates

on:
  schedule:
    - cron: '37 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Create a new PR even if one exists'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: package-updates
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'DaVinci42/nur-packages' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
      NIXPKGS_ALLOW_UNFREE: '1'
      GH_PROMPT_DISABLED: '1'
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.UPDATE_TOKEN || github.token }}
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: davinci42
          skipPush: true
      - name: Validate updates and open pull requests
        env:
          GH_TOKEN: ${{ secrets.UPDATE_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.UPDATE_TOKEN || github.token }}
          UPDATE_BASE: ${{ github.event.repository.default_branch }}
          UPDATE_FORCE: ${{ inputs.force || false }}
        run: |
          if [ "$UPDATE_FORCE" = "true" ]; then
            nix-shell --run 'just check-updates --pr --force'
          else
            nix-shell --run 'just check-updates --pr'
          fi

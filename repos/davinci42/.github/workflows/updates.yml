name: Package updates

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: package-updates
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'DaVinci42/nur-packages' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: self-hosted
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_PROMPT_DISABLED: '1'
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.UPDATE_TOKEN || github.token }}
      - name: Validate updates and open pull requests
        env:
          GH_TOKEN: ${{ secrets.UPDATE_TOKEN || github.token }}
          UPDATE_BASE: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${ACT:-false}" = "true" ]; then
            nix-shell --run 'just check-updates --update'
          else
            nix-shell --run 'just check-updates --pr'
          fi

name: Workflow checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workflow-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    if: github.repository == 'DaVinci42/nur-packages' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        run: nix-shell -p actionlint --run actionlint

name: "Auto-Update Packages"

on:
  schedule:
    - cron: '30 3 * * *'  # Daily at 3:30 AM UTC
  workflow_dispatch:
    inputs:
      package:
        description: 'Specific package to update (leave empty for all)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  update-packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Continue updating other packages even if one fails
      max-parallel: 1  # Each job pushes to the default branch, so jobs run one at a time
      matrix:
        package:
          - name: alvr
            attr: alvr
          - name: cco
            attr: cco
          - name: opencode
            attr: opencode
          - name: python-jwt
            attr: python-jwt_313
          - name: spec-kit
            attr: spec-kit
          - name: timew-sync-client
            attr: timew-sync-client
          - name: xgen
            attr: xgen
          # Add more packages here once they have an entry in nvfetcher.toml

    steps:
      - name: Check if should run
        id: should_run
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "run=true" >> $GITHUB_OUTPUT
          elif [[ -z "${{ github.event.inputs.package }}" ]]; then
            echo "run=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.package }}" == "${{ matrix.package.name }}" ]]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "Skipping ${{ matrix.package.name }} - not selected"
          fi
      - name: Checkout repository
        if: steps.should_run.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install nix
        if: steps.should_run.outputs.run == 'true'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Install jq for JSON parsing
        if: steps.should_run.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Update ${{ matrix.package.name }} sources
        if: steps.should_run.outputs.run == 'true'
        id: update_sources
        run: |
          NAME="${{ matrix.package.name }}"
          KEYFILE="$RUNNER_TEMP/nvfetcher-keyfile.toml"
          printf '[keys]\ngithub = "%s"\n' "$GH_TOKEN" > "$KEYFILE"

          nix develop --command nvfetcher --keyfile "$KEYFILE" --filter "^${NAME}(-.+)?$"

          if git diff --quiet -- _sources; then
            echo "No update available for $NAME"
            echo "update_available=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Commit-tracked sources carry a date, release-tracked ones a tag
          DISPLAY_FILTER='.[$name] | if .date then "0-unstable-\(.date)" else (.version | sub("^v"; "")) end'
          CURRENT_VERSION=$(git show HEAD:_sources/generated.json | jq -r --arg name "$NAME" "$DISPLAY_FILTER")
          LATEST_VERSION=$(jq -r --arg name "$NAME" "$DISPLAY_FILTER" _sources/generated.json)
          echo "Update available: $CURRENT_VERSION -> $LATEST_VERSION"

          echo "update_available=true" >> $GITHUB_OUTPUT
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test build
        if: steps.should_run.outputs.run == 'true' && steps.update_sources.outputs.update_available == 'true'
        id: test_build
        run: |
          echo "Testing build of updated package..."

          if nix build .#${{ matrix.package.attr }} --no-link --print-build-logs; then
            echo "Build successful!"
            echo "build_success=true" >> $GITHUB_OUTPUT
          else
            echo "Build failed!"
            echo "build_success=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure git
        if: steps.should_run.outputs.run == 'true' && steps.update_sources.outputs.update_available == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Close existing update PRs
        if: steps.should_run.outputs.run == 'true' && steps.update_sources.outputs.update_available == 'true'
        run: |
          echo "Checking for existing ${{ matrix.package.name }} update PRs to close..."

          EXISTING_PRS=$(gh pr list --state open --json number,title --jq '.[] | select(.title | startswith("chore: update ${{ matrix.package.name }}")) | .number')

          if [ -n "$EXISTING_PRS" ]; then
            echo "Found existing PRs: $EXISTING_PRS"
            for pr_number in $EXISTING_PRS; do
              echo "Closing PR #$pr_number..."
              gh pr close $pr_number --comment "Superseded by newer version update"
            done
          else
            echo "No existing update PRs found"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete existing update branches
        if: steps.should_run.outputs.run == 'true' && steps.update_sources.outputs.update_available == 'true'
        run: |
          echo "Checking for existing ${{ matrix.package.name }} update branches..."

          EXISTING_BRANCHES=$(git branch -r | grep "origin/update-${{ matrix.package.name }}-" | sed 's/origin\///' | xargs)

          if [ -n "$EXISTING_BRANCHES" ]; then
            echo "Found existing branches: $EXISTING_BRANCHES"
            for branch in $EXISTING_BRANCHES; do
              echo "Deleting branch: $branch"
              git push origin --delete "$branch" || true
            done
          else
            echo "No existing update branches found"
          fi

      - name: Commit successful build to the default branch
        if: steps.should_run.outputs.run == 'true' && steps.update_sources.outputs.update_available == 'true' && steps.test_build.outputs.build_success == 'true'
        run: |
          git add _sources
          git commit -m "chore: update ${{ matrix.package.name }} v${{ steps.update_sources.outputs.current_version }} → v${{ steps.update_sources.outputs.latest_version }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Create Pull Request for failed build
        if: steps.should_run.outputs.run == 'true' && steps.update_sources.outputs.update_available == 'true' && steps.test_build.outputs.build_success == 'false'
        id: create_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "update-${{ matrix.package.name }}-${{ steps.update_sources.outputs.latest_version }}"
          title: "chore: update ${{ matrix.package.name }} v${{ steps.update_sources.outputs.current_version }} → v${{ steps.update_sources.outputs.latest_version }}"
          commit-message: |
            chore: update ${{ matrix.package.name }} v${{ steps.update_sources.outputs.current_version }} → v${{ steps.update_sources.outputs.latest_version }}

            - Updated version from ${{ steps.update_sources.outputs.current_version }} to ${{ steps.update_sources.outputs.latest_version }}
            - Regenerated `_sources` with nvfetcher
            - Automated update via GitHub Actions workflow
          body: |
            Automated update of ${{ matrix.package.name }} package from v${{ steps.update_sources.outputs.current_version }} to v${{ steps.update_sources.outputs.latest_version }}.

            ❌ **Build Status**: Failed - Requires manual review
            🔄 **Auto-generated**: This PR was created by the automated update workflow.

            **Changes:**
            - Updated version from ${{ steps.update_sources.outputs.current_version }} to ${{ steps.update_sources.outputs.latest_version }}
            - Regenerated `_sources` with nvfetcher
          draft: true
          delete-branch: true

      - name: Summary
        if: always() && steps.should_run.outputs.run == 'true'
        run: |
          echo "### ${{ matrix.package.name }} Update Summary" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.update_sources.outputs.update_available }}" == "true" ]; then
            echo "✅ Update check completed" >> $GITHUB_STEP_SUMMARY
            echo "📦 Version: ${{ steps.update_sources.outputs.current_version }} → ${{ steps.update_sources.outputs.latest_version }}" >> $GITHUB_STEP_SUMMARY

            if [ "${{ steps.test_build.outputs.build_success }}" == "true" ]; then
              echo "🚀 Build successful - committed to the default branch" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️  Build failed - Draft PR created for manual review" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "ℹ️  No updates available" >> $GITHUB_STEP_SUMMARY
          fi

  trigger-nur-sync:
    needs: update-packages
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger NUR sync
        run: |
          echo "🔄 Triggering NUR sync workflow..."
          sleep 10

          if gh workflow list | grep -q "Build and populate cache"; then
            gh workflow run "build.yml" || gh workflow run "Build and populate cache" || true
            echo "✅ NUR sync workflow triggered"
          else
            echo "ℹ️  NUR sync workflow not found - may trigger automatically on push"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

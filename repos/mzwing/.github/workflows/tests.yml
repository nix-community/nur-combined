name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Test flake and workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: devenv shell bash -- -e {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: mzwing/nix-actions/nix/setup@master
        with:
          cachix-pull: 'false'
          install-devenv: 'true'

      # Read-only reader of the nix-ci- store cache family written by
      # the daily update.yml run (the only writer — readers must never
      # save: cache-nix-action skips the save on an exact primary-key
      # hit, so the first writer's store would otherwise poison the
      # family). Restores the most recent entry via the prefix.
      - name: Restore Nix store
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-ci-${{ hashFiles('devenv.lock', 'flake.lock', 'devenv.nix', 'devenv.yaml', 'nvfetcher.toml') }}
          restore-prefixes-first-match: nix-ci-

      # No --no-build: evaluating the packages requires realising the
      # fetched package sources (gomod2nix applies builtins.path to the
      # fetched src at evaluation time). Those source paths live in the
      # warm nix-ci- store cache saved by the update runs, but on a cold
      # cache --no-build turns their absence into an evaluation error.
      # The flake has no checks output, so nothing else gets built.
      - name: Check flake
        run: nix flake check --all-systems --no-write-lock-file --show-trace

      # Nix formatting and types, actions, shell and Python — see the justfile for what each covers and why the exclusions exist.
      - name: Lint
        run: just lint

name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Test flake and workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: devenv shell bash -- -e {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: mzwing/nix-actions/nix/setup@master
        with:
          cachix-pull: 'false'
          install-devenv: 'true'

      # A reader: update.yml is the sole writer of this cache family.
      - name: Restore Nix store
        uses: mzwing/nix-actions/nix/restore-store@master
        with:
          save: 'false'

      # Allow source realization because gomod2nix evaluates fetched paths.
      - name: Check flake
        run: nix flake check --all-systems --no-write-lock-file --show-trace

      # Run repository linters.
      - name: Lint
        run: just lint

name: Build and populate cache

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'pkgs/**'
      - '_sources/**'
      - 'nvfetcher.toml'
      - 'README.md'
      - '.github/workflows/update.yml'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nur-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Distributed build
    uses: mzwing/nix-actions/.github/workflows/distributed-build.yml@master
    with:
      name-prefix: nur
      # Only `out` reaches Cachix; every other closure stays private, and the retained set outgrew the 10 GiB Actions cache quota.
      store-cache-remote: ${{ vars.STORE_CACHE_REMOTE }}
      # Leaves the rest of the coordinator's 350 minutes to publish and reconcile.
      build-timeout-minutes: 250
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}

  # Needs every job green, not just the build: a red cache job means the generation never persisted, which is worth a look before NUR re-indexes.
  nur-update:
    name: Trigger NUR update
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: curl -XPOST "https://nur-update.nix-community.org/update?repo=mzwing"

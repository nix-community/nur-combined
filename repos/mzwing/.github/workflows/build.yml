name: Build and populate cache

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'pkgs/**'
      - '_sources/**'
      - 'nvfetcher.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nur-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  CACHE_NAME: mzwing
  BUILDER_PREFIX: nur-b-${{ github.run_id }}-${{ github.run_attempt }}
  # Enable sccache/GOCACHE compile caches in ci/default.nix (impure eval only).
  # Set to "0" to fall back to plain builds.
  NUR_COMPILE_CACHE: "1"

jobs:
  config:
    name: Plan package builds
    runs-on: ubuntu-latest
    outputs:
      builders: ${{ steps.plan.outputs.builders }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          accept-flake-config = false
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
          substituters = https://mzwing.cachix.org https://cache.nixos.org https://nix-community.cachix.org
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= mzwing.cachix.org-1:tOO3NqAwrXyPCnecEl/0wXwparCRksM5TeuS/wZK+KA= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

    - name: Restore Nix store
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-config-${{ hashFiles('flake.lock') }}
        restore-prefixes-first-match: nix-config-
        gc-max-store-size-linux: 2G

    - name: Configure Cachix for pulls
      uses: cachix/cachix-action@v17
      with:
        name: ${{ env.CACHE_NAME }}
        skipPush: true

    - name: Check flake evaluation
      run: nix flake check --all-systems --no-build --no-write-lock-file --show-trace

    - name: Evaluate supported packages
      id: evaluate
      shell: bash
      run: |
        set -euo pipefail
        printf 'targets=%s\n' "$(nix eval --json --impure --file ci/targets.nix)" >>"${GITHUB_OUTPUT}"

    - name: Check caches and generate builder matrix
      id: plan
      env:
        ALL_TARGETS: ${{ steps.evaluate.outputs.targets }}
      run: python3 scripts/plan-builds.py

  builder:
    name: Builder ${{ matrix.id }}
    needs: config
    if: needs.config.outputs.has_builds == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.builders) }}
    steps:
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          accept-flake-config = false
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
          substituters = https://mzwing.cachix.org https://cache.nixos.org https://nix-community.cachix.org
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= mzwing.cachix.org-1:tOO3NqAwrXyPCnecEl/0wXwparCRksM5TeuS/wZK+KA= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

    - name: Configure Cachix build daemon
      uses: cachix/cachix-action@v17
      with:
        name: ${{ env.CACHE_NAME }}
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        useDaemon: true

    - name: Enable Cachix uploads for remote builds
      run: sudo sh -c "cat '${CACHIX_DAEMON_DIR}/nix.conf' >> /etc/nix/nix.conf"

    - name: Prepare compile cache directory
      run: |
        sudo mkdir -p /opt/nur-ci-compile-cache/sccache /opt/nur-ci-compile-cache/gocache
        # The cache restore tarball is extracted as the runner user, which
        # must own these directories to chmod/utime them. The post-restore
        # step re-opens permissions for the nixbld build users.
        sudo chown -R "$(id -u):$(id -g)" /opt/nur-ci-compile-cache
        sudo chmod -R 777 /opt/nur-ci-compile-cache
        # Remote builds via ssh-ng read /etc/nix/nix.conf per session, so no
        # daemon restart is needed (and macOS builds are unsandboxed anyway).
        # The leading newline guards against a missing trailing newline in
        # the appended Cachix daemon config.
        printf '\nextra-sandbox-paths = /opt/nur-ci-compile-cache\n' | sudo tee -a /etc/nix/nix.conf

    # The key is unique per builder per run so saves never race and a bad
    # cache can never block a recurring slot; restores pick the most recent
    # cache for the same system (i.e. usually yesterday's, given daily runs).
    - name: Restore compile cache
      uses: actions/cache/restore@v6
      with:
        path: /opt/nur-ci-compile-cache
        key: compile-cache-${{ matrix.system }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
        restore-keys: |
          compile-cache-${{ matrix.system }}-

    - name: Fix compile cache permissions
      run: sudo chmod -R 777 /opt/nur-ci-compile-cache

    - name: Install sccache on the builder host
      run: nix build nixpkgs#sccache --out-link /tmp/sccache-host

    - name: Start shared sccache server
      run: |
        # One host-level server owns the cache directory; sandboxed builds
        # reach it over the bind-mounted Unix socket. sccache's local
        # storage supports only one server per SCCACHE_DIR.
        sudo env \
          SCCACHE_DIR=/opt/nur-ci-compile-cache/sccache \
          SCCACHE_CACHE_SIZE=2G \
          SCCACHE_IDLE_TIMEOUT=0 \
          SCCACHE_SERVER_UDS=/opt/nur-ci-compile-cache/sccache.sock \
          /tmp/sccache-host/bin/sccache --start-server
        sudo chmod 777 /opt/nur-ci-compile-cache/sccache.sock

    - name: Join builder network
      uses: tailscale/github-action@v4
      env:
        TAILSCALE_SSH_DEFAULT_PATH: /nix/var/nix/profiles/default/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:nur-ci-builder
        hostname: ${{ env.BUILDER_PREFIX }}-${{ matrix.id }}
        args: --ssh --accept-dns=false
        version: latest

    - name: Restore macOS runner DNS
      if: endsWith(matrix.system, '-darwin')
      run: sudo networksetup -setdnsservers Ethernet empty

    - name: Wait for distributed builds
      shell: bash
      run: |
        for _ in {1..120}; do
          if [[ -e /tmp/builder_claimed ]]; then
            while true; do
              echo 'Building...'
              for _ in {1..12}; do
                [[ -e /tmp/builder_done ]] && exit 0
                sleep 5
              done
            done
          fi
          sleep 5
        done
        echo 'Coordinator did not claim this builder within 10 minutes.' >&2
        exit 1

    - name: Stop sccache server
      if: always()
      run: |
        sudo env SCCACHE_SERVER_UDS=/opt/nur-ci-compile-cache/sccache.sock \
          /tmp/sccache-host/bin/sccache --stop-server || true

    - name: Fix compile cache permissions before save
      if: always()
      # sccache creates some entries as 0600 owned by nixbld users, which the
      # runner user cannot read; and the archived modes must stay permissive
      # so nixbld users can write to them again after the next restore.
      run: sudo chmod -R 777 /opt/nur-ci-compile-cache

    - name: Save compile cache
      if: always()
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: /opt/nur-ci-compile-cache
        key: compile-cache-${{ matrix.system }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}

  coordinator:
    name: Distributed build coordinator
    needs: config
    if: needs.config.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Maximize Nix disk space
      if: needs.config.outputs.has_builds == 'true'
      uses: wimpysworld/nothing-but-nix@v10
      with:
        hatchet-protocol: cleave

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          accept-flake-config = false
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
          max-jobs = 0
          substituters = https://mzwing.cachix.org https://cache.nixos.org https://nix-community.cachix.org
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= mzwing.cachix.org-1:tOO3NqAwrXyPCnecEl/0wXwparCRksM5TeuS/wZK+KA= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

    - name: Configure Cachix for pulls
      uses: cachix/cachix-action@v17
      with:
        name: ${{ env.CACHE_NAME }}
        skipPush: true

    - name: Join coordinator network
      if: needs.config.outputs.has_builds == 'true'
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:nur-ci-coordinator
        hostname: nur-c-${{ github.run_id }}-${{ github.run_attempt }}
        version: latest

    - name: Configure remote builders
      if: needs.config.outputs.has_builds == 'true'
      env:
        BUILDERS: ${{ needs.config.outputs.builders }}
      shell: bash
      run: |
        set -euo pipefail

        sudo mkdir -p /etc/ssh/ssh_config.d
        sudo tee /etc/ssh/ssh_config.d/nur-ci-builders.conf >/dev/null <<'EOF'
        Host nur-b-*
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
          BatchMode yes
          LogLevel ERROR
        EOF
        sudo tee /etc/nix/machines </dev/null

        while IFS=$'\t' read -r id system max_jobs; do
          builder="${BUILDER_PREFIX}-${id}"
          connected=false
          for _ in {1..120}; do
            if ssh -n -o ConnectTimeout=5 "root@${builder}" true 2>/dev/null; then
              connected=true
              break
            fi
            sleep 5
          done
          if [[ "${connected}" != true ]]; then
            printf 'Builder %s did not become reachable within 10 minutes.\n' "${builder}" >&2
            exit 1
          fi

          ssh -n "root@${builder}" 'touch /tmp/builder_claimed'
          printf 'ssh-ng://root@%s %s - %s 1 big-parallel,benchmark\n' \
            "${builder}" "${system}" "${max_jobs}" |
            sudo tee -a /etc/nix/machines >/dev/null
        done < <(jq -r '.include[] | [.id, .system, .maxJobs] | @tsv' <<<"${BUILDERS}")

        sudo tee -a /etc/nix/nix.conf >/dev/null <<'EOF'
        builders = @/etc/nix/machines
        builders-use-substitutes = true
        max-jobs = 0
        EOF
        sudo systemctl restart nix-daemon.service

    - name: Build package outputs
      if: needs.config.outputs.targets != '[]'
      env:
        TARGETS: ${{ needs.config.outputs.targets }}
      shell: bash
      run: |
        set -euo pipefail
        build_systems="$(jq -c '[.[].system] | unique' <<<"${TARGETS}")"
        {
          printf '### Built package outputs\n\n'
          BUILD_SYSTEMS="${build_systems}" nix build \
            --impure \
            --file ci/outputs.nix \
            --no-link \
            --no-write-lock-file \
            --print-build-logs \
            --print-out-paths \
            --max-jobs 0 |
            while IFS= read -r path; do
              printf -- '- `%s`\n' "${path}"
            done
        } >>"${GITHUB_STEP_SUMMARY}"

    - name: Release remote builders
      if: always() && needs.config.outputs.has_builds == 'true'
      env:
        BUILDERS: ${{ needs.config.outputs.builders }}
      shell: bash
      run: |
        while IFS= read -r id; do
          ssh -n -o ConnectTimeout=5 "root@${BUILDER_PREFIX}-${id}" \
            'touch /tmp/builder_done' || true
        done < <(jq -r '.include[].id' <<<"${BUILDERS}")

    - name: Trigger NUR update
      if: success()
      run: curl -XPOST "https://nur-update.nix-community.org/update?repo=mzwing"

name: Build and populate cache

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'pkgs/**'
      - 'README.md'
      - '.github/workflows/update.yml'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nur-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Distributed build
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: mzwing/nix-actions/.github/workflows/distributed-build.yml@master
    with:
      name-prefix: nur
      # Leaves the rest of the coordinator's 350 minutes to publish
      build-timeout-minutes: 250
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}

  nur-update:
    name: Trigger NUR update
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: curl -XPOST "https://nur-update.nix-community.org/update?repo=mzwing"

  # Replaces nix-config's own schedule, which raced this build and pinned nur revisions firn did not have yet
  nix-config-update:
    name: Trigger nix-config update
    needs: build
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.NIX_CONFIG_DISPATCH_TOKEN }}
        run: gh workflow run update.yml --repo mzwing/nix-config

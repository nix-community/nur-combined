name: Build and populate cache

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'pkgs/**'
      - '_sources/**'
      - 'nvfetcher.toml'
      - 'README.md'
      - '.github/workflows/update.yml'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nur-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  CACHE_NAME: mzwing
  BUILDER_PREFIX: nur-b-${{ github.run_id }}-${{ github.run_attempt }}
  CACHE_HOST: nur-cache-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  config:
    name: Plan package builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      builders: ${{ steps.plan.outputs.builders }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Nix
      uses: mzwing/nix-actions/nix/setup@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        cachix-name: ${{ env.CACHE_NAME }}

    # Read-only reader of the nix-ci- store cache family written by
    # the daily update.yml run (the only writer — readers must never
    # save: cache-nix-action skips the save on an exact primary-key
    # hit, so the first writer's store would otherwise poison the
    # family). Restores the most recent entry via the prefix: the warm
    # store holds the fetched package sources this job's evaluation
    # needs.
    - name: Restore Nix store
      uses: nix-community/cache-nix-action/restore@v7
      with:
        primary-key: nix-ci-${{ hashFiles('devenv.lock', 'flake.lock', 'devenv.nix', 'devenv.yaml', 'nvfetcher.toml') }}
        restore-prefixes-first-match: nix-ci-

    - name: Evaluate supported packages
      id: evaluate
      shell: bash
      run: |
        set -euo pipefail
        printf 'targets=%s\n' "$(nix eval --json --impure --file ci/targets.nix)" >>"${GITHUB_OUTPUT}"

    - name: Check caches and generate builder matrix
      id: plan
      uses: mzwing/nix-actions/nix/plan-builds@master
      with:
        targets: ${{ steps.evaluate.outputs.targets }}

  builder:
    name: Builder ${{ matrix.id }}
    needs: config
    if: needs.config.outputs.has_builds == 'true'
    runs-on: ${{ matrix.runner }}
    # Builders are passive and must outlive the coordinator, but they must
    # still stop short of the runner's hard 6-hour limit so their post
    # steps (tailnet logout) run instead of being cancelled.
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.builders) }}
    steps:
    # Cachix is pull-only on builders: only final package outputs are
    # pushed there, by the coordinator. Locally built paths (crate2nix
    # crates, goModules FODs, ...) go to the central builder store cache
    # instead (see the "cache" job), which also keeps the Cachix write
    # token off the unsandboxed macOS builders.
    - name: Set up Nix
      uses: mzwing/nix-actions/nix/setup@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        cachix-name: ${{ env.CACHE_NAME }}
        # Builders miss thousands of times on a cold Rust graph, and every miss pays a narinfo round trip per substituter. The caches dropped here (CUDA, nix-community, a third-party Attic) do not serve these builds; the coordinator still queries all of them when assembling the push closure.
        substituter-set: essential

    # The action restores the macOS runner's DNS after joining (with
    # DNS accepted, the tailscale action replaces the system DNS with
    # quad100 and the runner loses public internet access, so it is
    # reset back to DHCP). This also drops MagicDNS, hence the
    # /etc/hosts pin below.
    - name: Join builder network
      uses: mzwing/nix-actions/tailnet/join@master
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:nur-ci-builder
        hostname: ${{ env.BUILDER_PREFIX }}-${{ matrix.id }}
        args: --ssh

    # macOS only: with MagicDNS gone (see above), the Attic cache hostname
    # would not resolve. Linux builders resolve it via split DNS.
    - name: Resolve builder store cache address
      if: endsWith(matrix.system, '-darwin')
      uses: mzwing/nix-actions/tailnet/pin-peer@master
      with:
        hostname: ${{ env.CACHE_HOST }}

    # Fetch the run-local Attic token and signing public key only after
    # joining the tailnet. The post-build hook uploads sparse locally built
    # outputs; Attic drops anything signed by a configured public upstream.
    - name: Configure builder store cache
      uses: mzwing/nix-actions/store-cache/connect@master
      with:
        cache-host: ${{ env.CACHE_HOST }}

    - name: Wait for distributed builds
      uses: mzwing/nix-actions/builders/serve@master

  # Central sparse Attic cache for the builders. Its binary-cache database may
  # reference public-cache paths without storing them, so the persisted
  # generation holds only private/local NARs rather than a complete /nix/store.
  #
  # The generation lives on an rclone remote rather than in Actions Cache: that
  # quota is 10 GiB for the whole repository and evicts by least recent use, and
  # a single generation had already reached 9.61 GiB — leaving no room to grow
  # and starving the nix-ci- store cache. The NAR storage is content-addressed
  # and written once, so a push uploads only what the run added.
  cache:
    name: Builder store cache
    needs: config
    if: needs.config.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
    env:
      RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG }}
      STORE_CACHE_REMOTE: ${{ vars.STORE_CACHE_REMOTE }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Maximize Nix disk space
      uses: wimpysworld/nothing-but-nix@v10
      with:
        hatchet-protocol: cleave

    - name: Set up Nix
      uses: mzwing/nix-actions/nix/setup@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        cachix-name: ${{ env.CACHE_NAME }}
        # The cache job only substitutes prebuilt Attic and rclone; never compile
        # packages locally on this orchestration runner.
        max-jobs: '0'

    # Ahead of the pull, which is minutes of Google Drive traffic: until this node is on the tailnet the macOS builders cannot even resolve it, so leaving the join until afterwards made a slow restore look like a missing host.
    # Joining costs three seconds and does not disturb public DNS on Linux (only the macOS path in the action touches it).
    - name: Join cache network
      uses: mzwing/nix-actions/tailnet/join@master
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:nur-ci-cache
        hostname: ${{ env.CACHE_HOST }}
        args: --ssh

    - name: Prepare Attic data directory
      uses: mzwing/nix-actions/store-cache/prepare-dirs@master

    - name: Pull builder store cache
      uses: mzwing/nix-actions/store-cache/pull@master
      with:
        remote: ${{ env.STORE_CACHE_REMOTE }}

    - name: Start Attic
      uses: mzwing/nix-actions/store-cache/start@master
      with:
        cache-host: ${{ env.CACHE_HOST }}

    # One mid-run push, on the coordinator's signal or a timeout. It is additive,
    # so it cannot damage the remote, and it only moves the NARs built so far —
    # cheap insurance that a lost run does not discard its work.
    - name: Wait for checkpoint
      id: checkpoint
      uses: mzwing/nix-actions/store-cache/checkpoint@master
      with:
        timeout-minutes: '90'
        stage: 'false'

    - name: Push builder store cache (mid-run)
      if: ${{ !cancelled() && steps.checkpoint.outputs.checkpoint-ready == 'true' }}
      uses: mzwing/nix-actions/store-cache/push@master
      with:
        remote: ${{ env.STORE_CACHE_REMOTE }}
        prune: 'false'

    - name: Finalize Attic
      id: attic
      uses: mzwing/nix-actions/store-cache/finalize@master
      with:
        deadline-minutes: '90'

    # Prunes here: the local tree is authoritative only once shutdown has dropped
    # stale and now-public objects.
    - name: Push builder store cache
      if: ${{ !cancelled() && steps.attic.outputs.save-ready == 'true' }}
      uses: mzwing/nix-actions/store-cache/push@master
      with:
        remote: ${{ env.STORE_CACHE_REMOTE }}
        prune: 'true'

  coordinator:
    name: Distributed build coordinator
    needs: config
    if: needs.config.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    # Below the runner maximum: the build step budgets itself (see there),
    # leaving room for the Cachix push and reconciliation to complete
    # rather than being cancelled along with the job.
    timeout-minutes: 350
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Maximize Nix disk space
      if: needs.config.outputs.has_builds == 'true'
      uses: wimpysworld/nothing-but-nix@v10
      with:
        hatchet-protocol: cleave

    - name: Set up Nix
      uses: mzwing/nix-actions/nix/setup@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        cachix-name: ${{ env.CACHE_NAME }}
        max-jobs: '0'

    - name: Join coordinator network
      if: needs.config.outputs.has_builds == 'true'
      uses: mzwing/nix-actions/tailnet/join@master
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:nur-ci-coordinator
        hostname: nur-c-${{ github.run_id }}-${{ github.run_attempt }}

    # The coordinator substitutes locally built runtime dependencies
    # from the builder store cache when assembling the Cachix push
    # closure (they are not uploaded to Cachix by the builders). Runs
    # before the nix-daemon restart in "Configure remote builders" so
    # the daemon picks up the new substituter.
    - name: Configure builder store cache substituter
      uses: mzwing/nix-actions/store-cache/connect@master
      with:
        cache-host: ${{ env.CACHE_HOST }}
        post-build-hook: 'false'

    - name: Configure remote builders
      if: needs.config.outputs.has_builds == 'true'
      uses: mzwing/nix-actions/builders/attach@master
      with:
        builders-json: ${{ needs.config.outputs.builders }}
        builder-prefix: ${{ env.BUILDER_PREFIX }}
        ssh-host-pattern: "nur-b-* nur-cache-*"

    # The Attic job joins the tailnet in parallel; make sure its HTTP
    # binary-cache endpoint works both directly and through a builder
    # before Nix gets a chance to memoize a transient failure.
    - name: Check builder store cache reachability
      uses: mzwing/nix-actions/store-cache/verify@master
      with:
        cache-host: ${{ env.CACHE_HOST }}
        builders-json: ${{ needs.config.outputs.builders }}
        builder-prefix: ${{ env.BUILDER_PREFIX }}

    # Measured on run 31921034156: the push took 10s and reconciliation 1m04s, not the ~90 minutes the original 200 reserved for them. That run spent its whole budget still making progress and lost only bakamusic, so give the build the headroom back — 300 plus ~6 minutes of setup and publishing still clears this job's 350.
    - name: Build package outputs
      if: needs.config.outputs.targets != '[]'
      uses: mzwing/nix-actions/nix/build-targets@master
      with:
        targets: ${{ needs.config.outputs.targets }}
        timeout-minutes: '300'

    # The job log is size-capped and silently truncates a long build; the artifact is not, so a post-mortem has the whole thing.
    - name: Upload build log
      if: '!cancelled()'
      uses: actions/upload-artifact@v4
      with:
        name: coordinator-build-log
        path: /tmp/nix-build.log
        if-no-files-found: ignore
        retention-days: 14

    # Runs on red builds too: --keep-going means the build step still realises the packages that succeeded.
    - name: Assemble Cachix push set
      if: '!cancelled()'
      env:
        TARGETS: ${{ needs.config.outputs.targets }}
      run: bash scripts/ci/assemble-push-set.sh

    - name: Push final outputs to Cachix
      if: '!cancelled()'
      uses: mzwing/nix-actions/cachix/push@master
      env:
        CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      with:
        cachix-name: ${{ env.CACHE_NAME }}
        paths-file: /tmp/push-outputs.txt
        closure-paths-file: /tmp/cachix-published-closure.txt

    # Lets the cache job snapshot a consistent mid-run Attic generation
    # before reconciliation, so even a cancelled run leaves a warm cache.
    - name: Signal builder store cache checkpoint
      if: '!cancelled()'
      uses: mzwing/nix-actions/store-cache/signal-checkpoint@master
      with:
        cache-host: ${{ env.CACHE_HOST }}

    # Post-build uploads are best-effort. Re-offer every output in the exact
    # scheduled derivation closures while builders are alive; Attic performs a bulk
    # missing check, skips public-upstream signatures, and receives the
    # same expected set as its deterministic shutdown keep-list.
    - name: Reconcile builder store cache
      if: '!cancelled()'
      uses: mzwing/nix-actions/store-cache/reconcile@master
      with:
        builders-json: ${{ needs.config.outputs.builders }}
        builder-prefix: ${{ env.BUILDER_PREFIX }}
        cache-host: ${{ env.CACHE_HOST }}
        active-drvs-file: /tmp/active-drvs.txt
        # Written atomically only after Cachix accepted the full closure.
        public-paths-file: /tmp/cachix-published-closure.txt

    # Also signals the builder store cache machine that the run is over
    # (/tmp/cache_done, via the cache-host input).
    - name: Release remote builders
      if: always() && needs.config.outputs.has_builds == 'true'
      uses: mzwing/nix-actions/builders/release@master
      with:
        builders-json: ${{ needs.config.outputs.builders }}
        builder-prefix: ${{ env.BUILDER_PREFIX }}
        cache-host: ${{ env.CACHE_HOST }}

    - name: Trigger NUR update
      if: success()
      run: curl -XPOST "https://nur-update.nix-community.org/update?repo=mzwing"

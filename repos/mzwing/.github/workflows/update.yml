name: Update packages

on:
  push:
    branches:
      - main
    paths:
      - 'pkgs/**'
      - 'nvfetcher.toml'
      - 'default.nix'
      - 'flake.nix'
      - 'flake.lock'
      - 'internal/npm-lockfile-fix.nix'
      - '.github/workflows/update.yml'
      - 'scripts/**'
  schedule:
    - cron: "23 12 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update:
    name: Update package sources and hashes
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        # update-hashes compares package definitions with the pre-push revision.
        fetch-depth: 0

    - name: Maximize Nix disk space
      uses: wimpysworld/nothing-but-nix@v10
      with:
        hatchet-protocol: cleave

    - name: Set up Nix
      uses: mzwing/nix-actions/nix/setup@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        install-devenv: 'true'

    # Sole writer for the lock-keyed update store cache; prune older entries and stale root locks.
    - name: Restore Nix store
      uses: mzwing/nix-actions/nix/restore-store@master
      with:
        primary-key: nix-ci-${{ hashFiles('devenv.lock', 'flake.lock', 'devenv.nix', 'devenv.yaml', 'nvfetcher.toml') }}
        restore-prefix: nix-ci-
        gc-max-store-size-linux: 4G
        purge-last-accessed: 0

    - name: Restore nvfetcher database
      uses: actions/cache@v6
      with:
        path: ~/.local/share/nvfetcher
        key: nvfetcher-${{ github.sha }}
        restore-keys: |
          nvfetcher-

    - name: Update devenv inputs
      run: devenv update

    # Update flake inputs weekly or manually to avoid daily full rebuilds.
    - name: Update flake inputs (weekly)
      run: |
        if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]] || \
          [[ "$(date -u +%u)" == '1' ]]; then
          nix flake update
        fi

    - name: Update sources, lockfiles, pins and dependency hashes
      shell: bash
      env:
        # Avoid anonymous GitHub API limits on shared runners.
        GITHUB_TOKEN: ${{ github.token }}
        # Empty for schedule/dispatch; working-tree changes are still detected.
        UPDATE_BASE_REV: ${{ github.event.before }}
      run: bash scripts/ci/update-packages.sh

    # Root update tools before store garbage collection.
    - name: Root the update toolchain for the store cache
      if: always()
      shell: bash
      run: bash scripts/ci/root-update-toolchain.sh

    # Cache the rooted devenv toolchain for tests.
    - name: Warm the devenv shell into the store cache
      if: always()
      run: devenv shell -- true

    - name: Commit and push changes
      uses: mzwing/nix-actions/git/commit-and-push@master
      with:
        paths: devenv.lock flake.lock _sources pkgs
        message: 'chore: update packages'
        trigger-workflow: build.yml
        github-token: ${{ github.token }}

    # Keep the current build closure and rooted tools before saving the store cache.
    - name: Garbage-collect stale store paths
      if: always()
      uses: mzwing/nix-actions/nix/gc-store@master
      with:
        gcroots-name: nur-ci-update-closure

    # Keep the newest existing nvfetcher cache before the post-job save.
    - name: Purge old nvfetcher caches
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh cache list --limit 100 --json id,key,createdAt |
          jq -r '[.[] | select(.key | startswith("nvfetcher-"))] | sort_by(.createdAt) | .[:-1][] | .id' |
          xargs -r -n 1 gh cache delete

name: Update Packages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      update: nix-update --commit --print-commit-message --flake
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: experimental-features = nix-command flakes

      - name: Setup
        run: |-
          nix profile add .#nix-update-fixed
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - if: success() || failure() # always() runs even when job is cancelled
        run: $update --version=branch=main catppuccin-discord_git

      - if: success() || failure()
        run: $update --version=branch=main catppuccin-wallpapers

      - if: success() || failure()
        run: $update --version=branch=main colloid-gtk-theme_git

      - if: success() || failure()
        run: $update comfyui-anima-booster

      - if: success() || failure()
        run: $update comfyui-autocomplete-plus

      - if: success() || failure()
        run: $update comfyui-lora-manager

      - if: success() || failure()
        run: $update comfyui-manager

      - if: success() || failure()
        run: $update --version=branch comfyui-prompt-manager

      - if: success() || failure()
        run: $update --version=branch framework_rgbafan

      - if: success() || failure()
        run: $update --version=branch lsp-ai-chendesheng

      - if: success() || failure()
        run: $update --version=branch noita_save_manager

      - if: success() || failure()
        run: $update --version=branch nu_scripts_git

      - if: success() || failure()
        run: $update --version=branch palgen

      - if: success() || failure()
        run: $update --version=branch=sageattention-1 sageattention_1

      - if: success() || failure()
        run: $update --version-regex='^v([0-9]+\.[0-9]+\.[0-9]+)$' strix-llama-cpp

      - if: success() || failure()
        run: $update --version=branch win2xcur

      # nix-update can't run the update scripts because of unique derivation structure
      - name: Update v2ray-rules-dat
        if: success() || failure()
        run: |-
          pkgs/v2/v2ray-rules-dat/update.sh
          git add . && git commit -m "v2ray-rules-dat: update"

      - name: Update vscode-insiders
        if: success() || failure()
        run: |-
          pkgs/vs/vscode-insiders/update.sh
          git add . && git commit -m "vscode-insiders: update"

      - name: Update vscodium-insiders
        if: success() || failure()
        run: |-
          pkgs/vs/vscodium-insiders/update.sh
          git add . && git commit -m "vscodium-insiders: update"

      - if: success() || failure()
        run: git push

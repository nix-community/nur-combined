name: Update dependencies

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-dependencies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          submodules: recursive
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: af-nur
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Test update rollback
        run: python3 -m unittest discover -s scripts -p 'test_update.py' -v
      - name: Update sources and dependency locks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix-shell scripts/update-shell.nix --run 'python3 scripts/update.py'
      - name: Stage dependency updates
        id: changes
        run: |
          git add -- _sources pkgs flake.lock vendor/bun2nix
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate updated package set
        if: steps.changes.outputs.changed == 'true'
        run: |
          nix-instantiate ci.nix -A cacheOutputs --show-trace
          nix-build ci.nix -A cacheOutputs --no-out-link --keep-going
      - name: Commit and push dependency updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m ':package: Update dependencies with nvfetcher'
          # Do not rebase or force-push: concurrent changes need a fresh update/build.
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
      - name: Build updated default branch
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Pushes made with GITHUB_TOKEN do not trigger the push workflow.
        run: gh workflow run build.yml --ref "$DEFAULT_BRANCH"

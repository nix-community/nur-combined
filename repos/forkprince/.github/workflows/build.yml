name: "Build/Populate Cache"
on:
  push:
  schedule:
    - cron: '05 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    if: github.event_name != 'push' && github.event_name != 'pull_request'

    permissions:
      contents: write

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c  # v35
        with:
          nix_conf: experimental-features = nix-command flakes

      - name: Update Packages (nix-update)
        id: nix_update
        run: |
          export NIX_PATH=nixpkgs=flake:nixpkgs
          failed_pkgs=""
          while IFS= read -r update_file; do
            pkg=$(basename "$(dirname "$update_file")")
            extra_args=$(cat "$update_file")
            if ! nix shell nixpkgs#nix-update -c nix-update $extra_args "$pkg"; then
              echo "::warning::Failed to update $pkg with nix-update"
              failed_pkgs="${failed_pkgs}${pkg}\n"
            fi
          done < <(find ./pkgs -name ".update" -type f)
          echo "failed_pkgs=${failed_pkgs}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Packages (bun)
        id: update
        run: |
          failed_apps=""
          while IFS= read -r version_file; do
            app_name=$(basename "$(dirname "$version_file")")
            if ! bun ./scripts/index.js "$version_file"; then
              echo "::warning::Failed to update $app_name ($version_file)"
              failed_apps="${failed_apps}${app_name}\n"
            fi
          done < <(find ./pkgs -name "version.json" -type f)
          echo "failed_apps=${failed_apps}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}

      - name: Wait (5 minutes)
        if: steps.update.outputs.failed_apps != ''
        run: sleep 300

      - name: Retry Updates
        if: steps.update.outputs.failed_apps != ''
        id: retry
        run: |
          still_failed_apps=""
          while IFS= read -r version_file; do
            app_name=$(basename "$(dirname "$version_file")")
            # Only retry apps that failed in the first pass
            if printf '%b' "${{ steps.update.outputs.failed_apps }}" | grep -qx "$app_name"; then
              if ! bun ./scripts/index.js "$version_file"; then
                echo "::warning::Retry also failed for $app_name ($version_file)"
                still_failed_apps="${still_failed_apps}${app_name}\n"
              fi
            fi
          done < <(find ./pkgs -name "version.json" -type f)
          echo "still_failed_apps=${still_failed_apps}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}

      - name: Notify Failures
        if: steps.nix_update.outputs.failed_pkgs != '' || steps.update.outputs.failed_apps != ''
        env:
          NIX_FAILED: ${{ steps.nix_update.outputs.failed_pkgs }}
          FAILED: ${{ steps.update.outputs.failed_apps }}
          STILL_FAILED: ${{ steps.retry.outputs.still_failed_apps }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DISCORD: ${{ secrets.DISCORD }}
        run: |
          fmt() { printf '%b' "$1" | sed '/^$/d' | sed 's/^/• /'; }

          desc=""
          if [ -n "$NIX_FAILED" ]; then
            desc+=$'**nix-update failed:**\n```\n'"$(fmt "$NIX_FAILED")"$'\n```\n'
          fi
          if [ -n "$FAILED" ]; then
            desc+=$'**Update failed (first pass):**\n```\n'"$(fmt "$FAILED")"$'\n```\n'
            if [ -n "$STILL_FAILED" ]; then
              desc+=$'**Still failing after retry:**\n```\n'"$(fmt "$STILL_FAILED")"$'\n```\n'
            else
              desc+=$'All first-pass failures recovered on retry.\n'
            fi
          fi

          if [ -n "$STILL_FAILED" ]; then
            title="🚨 NUR update failures"
            color=15548997
          else
            title="⚠️ NUR update failures"
            color=16744272
          fi

          payload=$(jq -n \
            --arg title "$title" \
            --arg desc "$desc" \
            --arg url "$RUN_URL" \
            --argjson color "$color" \
            '{
              username: "NUR",
              avatar_url: "https://api.serversmp.xyz/upload/69a58cf144d40b74d08297dc.webp",
              content: "@everyone",
              embeds: [{
                title: $title,
                description: $desc,
                color: $color,
                url: $url
              }]
            }')
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD"

      - name: Update flake
        run: nix flake update

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: update packages"
            git push
          else
            echo "No changes to commit."
          fi

  tests:
    needs: update
    if: always() && needs.update.result != 'failure'

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            channel: unstable
            nixPath: nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-unstable.tar.gz
          - os: ubuntu-latest
            platform: linux
            channel: "26.05"
            nixPath: nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-26.05.tar.gz
          - os: macos-latest
            platform: darwin
            channel: unstable
            nixPath: nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-unstable.tar.gz
          # - os: macos-latest
          #   platform: darwin
          #   channel: "25.11"
          #   nixPath: nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-25.11.tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Maximize Space
        if: runner.os == 'Linux'
        uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7  # v10

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # v31.11.3
        with:
          nix_path: "${{ matrix.nixPath }}"
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Show Version
        run: nix-instantiate --eval -E '(import <nixpkgs> {}).lib.version'

      - name: Setup Cachix
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866  # v17
        with:
          name: forkprince
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Compute skipped packages
        id: skips
        env:
          PLATFORM: ${{ matrix.platform }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          skip_attrs="[]"
          skip_files=$(find ./pkgs -name ".skip" -type f)
          if [ -n "$skip_files" ]; then
            skip_attrs=$(printf '%s\n' "$skip_files" | while IFS= read -r f; do
              pkg=$(basename "$(dirname "$f")")
              tokens=$(sed -e 's/#.*//' "$f" | tr '[:space:]' '\n' | sed '/^$/d')
              if [ -z "$tokens" ] || printf '%s\n' "$tokens" | grep -qxF -e all -e "$PLATFORM" -e "$CHANNEL" -e "$PLATFORM/$CHANNEL"; then
                grep -E "^[[:space:]]*[a-zA-Z0-9_-]+[[:space:]]*=[[:space:]]*lib\.callPackage[[:space:]]+\./pkgs/$pkg([[:space:]]|\$)" default.nix 2>/dev/null | sed -E 's/^[[:space:]]*([a-zA-Z0-9_-]+).*/\1/' || true
              fi
            done | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))' 2>/dev/null || echo '[]')
          fi
          echo "attrs=$skip_attrs" >> "$GITHUB_OUTPUT"

      - name: Check evaluation
        id: eval
        continue-on-error: true
        run: |
          nix-env -f . -qa \* --meta --xml \
            --argstr skipPkgs '${{ steps.skips.outputs.attrs }}' \
            --allowed-uris https://static.rust-lang.org \
            --option restrict-eval true \
            --option allow-import-from-derivation true \
            --drv-path --show-trace \
            -I nixpkgs=$(nix-instantiate --find-file nixpkgs) \
            -I $PWD

      - name: Build Packages
        id: build
        if: steps.eval.outcome == 'success'
        continue-on-error: true
        run: |
          nix shell -f '<nixpkgs>' nix-build-uncached -c nix-build-uncached ci.nix \
            -A cacheOutputs \
            --arg pkgs "import <nixpkgs> {}" \
            --argstr skipPkgs '${{ steps.skips.outputs.attrs }}' \
            -I nixpkgs=$(nix-instantiate --find-file nixpkgs) \
            2>&1 | tee build.log
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ] || grep -q "nix build failed" build.log; then
            exit 1
          fi

      - name: Notify Failures
        if: (steps.eval.outcome == 'failure' || steps.build.outcome == 'failure') && github.ref == 'refs/heads/main'
        env:
          EVAL_OUTCOME: ${{ steps.eval.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OS: ${{ matrix.os }}
          CHANNEL: ${{ matrix.channel }}
          DISCORD: ${{ secrets.DISCORD }}
        run: |
          if [ "$EVAL_OUTCOME" = "failure" ]; then
            title="❌ NUR evaluation failed on $OS ($CHANNEL)"
            desc="Evaluation check failed, check the logs for details."
          else
            title="❌ NUR build failures on $OS ($CHANNEL)"
            desc="Build failed, check the logs for details."
          fi
          payload=$(jq -n \
            --arg title "$title" \
            --arg desc "$desc" \
            --arg url "$RUN_URL" \
            '{
              username: "NUR",
              avatar_url: "https://api.serversmp.xyz/upload/69a58cf144d40b74d08297dc.webp",
              content: "@everyone",
              embeds: [{
                title: $title,
                description: $desc,
                color: 15158332,
                url: $url
              }]
            }')
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD"

      - name: Fail Job
        if: steps.eval.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1

  nur:
    needs: tests
    if: ${{ always() && needs.tests.result == 'success' && github.ref == 'refs/heads/main' }}

    runs-on: ubuntu-latest
    steps:
      - name: Trigger NUR update
        run: curl -XPOST "https://nur-update.nix-community.org/update?repo=forkprince"

# this exists purely to wrangle the language servers into doing useful things for all the miscellaneous python scripts in this repo. This repo is not a python project

[tool.pyright]
verboseOutput = true
pythonPlatform = "Linux"
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportWildcardImportFromLibrary = false

[[tool.pyright.executionEnvironments]]
root = "tests/liam/testScript"
extraPaths = [
  ".generated/nixpkgs/nixos/lib",
  ".generated/liam-test"
]

[[tool.pyright.executionEnvironments]]
root = "tests/caddy-kanidm/testScript"
extraPaths = [
  ".generated/nixpkgs/nixos/lib",
  ".generated/caddy-kanidm-test"
]

[[tool.pyright.executionEnvironments]]
root = "scripts/dns-update"
extraPaths = [ ".generated/dns-update/python-env/lib/python3.13/site-packages" ]

[[tool.pyright.executionEnvironments]]
root = "tests/liam/mailtest"
extraPaths = [ ".generated/mailtest/python-env/lib/python3.13/site-packages" ]

[[tool.pyright.executionEnvironments]]
root = "packages/zfs-supersend"
extraPaths = [ ".generated/general-env/lib/python3.13/site-packages" ]

[[tool.pyright.executionEnvironments]]
root = "pythonPackages/types-dnspython"
extraPaths = [ ".generated/dnspython/lib/python3.13/site-packages" ]

[[tool.pyright.executionEnvironments]]
root = "scripts"
extraPaths = [ ".generated/general-env/lib/python3.13/site-packages" ]

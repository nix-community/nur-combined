name: "Update Packages"
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 10 * * *" # 10 am every day
permissions:
  contents: write
  pull-requests: write
jobs:
  updateFlakePackages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31.10.7
        with:
          nix_path: "nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-unstable.tar.gz"
      - name: Update flake packages
        uses: gepbird/nix-update-action@v3.1.0
        with:
          packages: "utmt-cli"

[workspace]
members = [
    ".",
    "mods/testbed", "mods/urban_chaos",
]

[package]
name = "hanga"
version = "0.1.0"
edition = "2024"

[lib]
name = "hanga"
path = "src/lib.rs"

[[bin]]
name = "hanga"
path = "src/main.rs"

[dependencies]
avian3d = "0.7.0"
bevy = "0.19.0"
bevy_voxel_world = "0.17.0"
wasmtime = { version = "47.0.3", features = ["component-model"] }
matchbox_socket = "0.14.0"
futures = "0.3"
bincode = "1.3.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5.11"
notify = "6.1.1"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
wasmparser = "0.256.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dev-dependencies]
kani = "0.0.1"
proptest = "1.5.0"


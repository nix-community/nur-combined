name: openscore
description: Open-source MuseScore sheet music downloader (MIDI, MP3, PDF).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  http: ^1.2.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  file_picker: ^8.1.7
  open_filex: ^4.6.0
  pdf: ^3.11.1
  image: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

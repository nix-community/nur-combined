name: Package Non-Nix Common Platform Releases

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-release
  cancel-in-progress: false

jobs:
  build-linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Maximize build space
        if: matrix.runner == 'ubuntu-24.04'
        uses: mio-19/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        with:
          root-reserve-mb: 512
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev pkg-config \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libwayland-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig1-dev \
            libfreetype6-dev libgl1-mesa-dev clang cmake ninja-build libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-tools
        run: cargo install wasm-tools --locked

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            by-name/om/omnimux/src
            by-name/ha/hanga
            by-name/up/uplink
            by-name/nr/nrs-client/src/native/hub

      - name: Prepare staging directory
        run: mkdir -p "$GITHUB_WORKSPACE/staging"

      # ─── Omnimux ─────────────────────────────────────────────────────────────
      - name: Build & Package Omnimux
        continue-on-error: true
        run: |
          python3 scripts/prepare-omnimux-vendor.py
          cd by-name/om/omnimux/src
          cargo build --release

          mkdir -p dist-omnimux
          cp target/release/omnimux dist-omnimux/
          cp ../omnimux.desktop dist-omnimux/
          cp ../omnimux.svg dist-omnimux/
          tar -czvf "$GITHUB_WORKSPACE/staging/omnimux-linux-${{ matrix.arch }}.tar.gz" -C dist-omnimux .

      # ─── Hanga ───────────────────────────────────────────────────────────────
      - name: Build & Package Hanga
        continue-on-error: true
        run: |
          python3 scripts/build-hanga-mods.py by-name/ha/hanga/dist
          cd by-name/ha/hanga
          cargo build --release -p hanga
          cargo install --locked --git https://github.com/johanhelsing/matchbox.git --tag v0.14.0 matchbox_server --root dist-signal
          cp target/release/hanga dist/
          cp dist-signal/bin/matchbox_server dist/hanga-signal
          tar -czvf "$GITHUB_WORKSPACE/staging/hanga-linux-${{ matrix.arch }}.tar.gz" -C dist .

      # ─── Uplink ──────────────────────────────────────────────────────────────
      - name: Build & Package Uplink
        continue-on-error: true
        run: |
          cd by-name/up/uplink
          cargo build --release -p uplink_cli
          flutter pub get
          flutter build linux --release

          mkdir -p dist-uplink
          cp -r build/linux/*/release/bundle/* dist-uplink/
          cp target/release/uplink_cli dist-uplink/
          tar -czvf "$GITHUB_WORKSPACE/staging/uplink-linux-${{ matrix.arch }}.tar.gz" -C dist-uplink .

      # ─── NRS Client ──────────────────────────────────────────────────────────
      - name: Build & Package NRS Client
        continue-on-error: true
        run: |
          cd by-name/nr/nrs-client/src
          flutter pub get
          flutter build linux --release

          mkdir -p dist-nrs
          cp -r build/linux/*/release/bundle/* dist-nrs/
          tar -czvf "$GITHUB_WORKSPACE/staging/nrs-client-linux-${{ matrix.arch }}.tar.gz" -C dist-nrs .

      - name: Upload Linux Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-artifacts
          path: staging/*
          if-no-files-found: ignore
          retention-days: 1

  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: aarch64
          - runner: macos-13
            arch: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-tools
        run: cargo install wasm-tools --locked

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            by-name/om/omnimux/src
            by-name/ha/hanga
            by-name/up/uplink
            by-name/nr/nrs-client/src/native/hub

      - name: Prepare staging directory
        run: mkdir -p "$GITHUB_WORKSPACE/staging"

      # ─── Omnimux ─────────────────────────────────────────────────────────────
      - name: Build & Package Omnimux
        continue-on-error: true
        run: |
          python3 scripts/prepare-omnimux-vendor.py
          cd by-name/om/omnimux/src
          cargo build --release --features gpui-platform/runtime_shaders

          APP="Omnimux.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/omnimux "$APP/Contents/MacOS/"
          cp "$GITHUB_WORKSPACE/by-name/om/omnimux/Info.plist" "$APP/Contents/Info.plist"
          zip -r "$GITHUB_WORKSPACE/staging/omnimux-macos-${{ matrix.arch }}.zip" "$APP"

      # ─── Hanga ───────────────────────────────────────────────────────────────
      - name: Build & Package Hanga
        continue-on-error: true
        run: |
          python3 scripts/build-hanga-mods.py by-name/ha/hanga/dist
          cd by-name/ha/hanga
          cargo build --release -p hanga
          cargo install --locked --git https://github.com/johanhelsing/matchbox.git --tag v0.14.0 matchbox_server --root dist-signal
          cp target/release/hanga dist/
          cp dist-signal/bin/matchbox_server dist/hanga-signal
          tar -czvf "$GITHUB_WORKSPACE/staging/hanga-macos-${{ matrix.arch }}.tar.gz" -C dist .

      # ─── Uplink ──────────────────────────────────────────────────────────────
      - name: Build & Package Uplink
        continue-on-error: true
        run: |
          cd by-name/up/uplink
          cargo build --release -p uplink_cli
          flutter pub get
          flutter build macos --release

          mkdir -p dist-uplink
          cp -r build/macos/Build/Products/Release/uplink.app dist-uplink/
          cp target/release/uplink_cli dist-uplink/
          cd dist-uplink
          zip -r "$GITHUB_WORKSPACE/staging/uplink-macos-${{ matrix.arch }}.zip" .

      # ─── NRS Client ──────────────────────────────────────────────────────────
      - name: Build & Package NRS Client
        continue-on-error: true
        run: |
          cd by-name/nr/nrs-client/src
          flutter pub get
          flutter build macos --release

          mkdir -p dist-nrs
          cp -r build/macos/Build/Products/Release/nrs_client.app dist-nrs/
          cd dist-nrs
          zip -r "$GITHUB_WORKSPACE/staging/nrs-client-macos-${{ matrix.arch }}.zip" .

      - name: Upload macOS Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-artifacts
          path: staging/*
          if-no-files-found: ignore
          retention-days: 1

  build-windows:
    name: Windows (x86_64 & aarch64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc, wasm32-unknown-unknown

      - name: Install wasm-tools
        run: cargo install wasm-tools --locked

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            by-name/om/omnimux/src
            by-name/ha/hanga
            by-name/up/uplink
            by-name/nr/nrs-client/src/native/hub

      - name: Prepare staging directory
        run: New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\staging"

      # ─── Omnimux ─────────────────────────────────────────────────────────────
      - name: Build & Package Omnimux
        continue-on-error: true
        run: |
          python scripts/prepare-omnimux-vendor.py
          cd by-name/om/omnimux/src

          # Build x86_64
          cargo build --release --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force -Path dist-omnimux
          Copy-Item target/x86_64-pc-windows-msvc/release/omnimux.exe dist-omnimux/
          Compress-Archive -Path dist-omnimux/* -DestinationPath "$env:GITHUB_WORKSPACE\staging\omnimux-windows-x86_64.zip"

          # Attempt aarch64 cross-compile
          try {
            cargo build --release --target aarch64-pc-windows-msvc
            New-Item -ItemType Directory -Force -Path dist-omnimux-arm64
            Copy-Item target/aarch64-pc-windows-msvc/release/omnimux.exe dist-omnimux-arm64/
            Compress-Archive -Path dist-omnimux-arm64/* -DestinationPath "$env:GITHUB_WORKSPACE\staging\omnimux-windows-aarch64.zip"
          } catch {
            Write-Warning "Omnimux Windows aarch64 build skipped or failed: $_"
          }

      # ─── Hanga ───────────────────────────────────────────────────────────────
      - name: Build & Package Hanga
        continue-on-error: true
        run: |
          python scripts/build-hanga-mods.py by-name/ha/hanga/dist
          cd by-name/ha/hanga

          # Build host x86_64
          cargo build --release --target x86_64-pc-windows-msvc -p hanga
          # Cross-compile host aarch64
          cargo build --release --target aarch64-pc-windows-msvc -p hanga

          # Build matchbox_server
          cargo install --locked --git https://github.com/johanhelsing/matchbox.git --tag v0.14.0 matchbox_server --root dist-signal-x64
          try {
            cargo install --target aarch64-pc-windows-msvc --locked --git https://github.com/johanhelsing/matchbox.git --tag v0.14.0 matchbox_server --root dist-signal-arm64
          } catch {
            Write-Warning "matchbox_server aarch64 build skipped: $_"
          }

          # Package x86_64
          New-Item -ItemType Directory -Force -Path dist-x64
          Copy-Item -Recurse dist/* dist-x64/
          Copy-Item target/x86_64-pc-windows-msvc/release/hanga.exe dist-x64/
          if (Test-Path "dist-signal-x64/bin/matchbox_server.exe") {
            Copy-Item dist-signal-x64/bin/matchbox_server.exe dist-x64/hanga-signal.exe
          }
          Compress-Archive -Path dist-x64/* -DestinationPath "$env:GITHUB_WORKSPACE\staging\hanga-windows-x86_64.zip"

          # Package aarch64
          New-Item -ItemType Directory -Force -Path dist-arm64
          Copy-Item -Recurse dist/* dist-arm64/
          Copy-Item target/aarch64-pc-windows-msvc/release/hanga.exe dist-arm64/
          if (Test-Path "dist-signal-arm64/bin/matchbox_server.exe") {
            Copy-Item dist-signal-arm64/bin/matchbox_server.exe dist-arm64/hanga-signal.exe
          }
          Compress-Archive -Path dist-arm64/* -DestinationPath "$env:GITHUB_WORKSPACE\staging\hanga-windows-aarch64.zip"

      # ─── Uplink ──────────────────────────────────────────────────────────────
      - name: Build & Package Uplink
        continue-on-error: true
        run: |
          cd by-name/up/uplink
          # Build CLI for x86_64 and aarch64
          cargo build --release --target x86_64-pc-windows-msvc -p uplink_cli
          cargo build --release --target aarch64-pc-windows-msvc -p uplink_cli

          # Build Flutter app for x86_64
          flutter pub get
          flutter build windows --release

          # Package x86_64 bundle
          New-Item -ItemType Directory -Force -Path dist-uplink-x64
          Copy-Item -Recurse build/windows/x64/runner/Release/* dist-uplink-x64/
          Copy-Item target/x86_64-pc-windows-msvc/release/uplink_cli.exe dist-uplink-x64/
          Compress-Archive -Path dist-uplink-x64/* -DestinationPath "$env:GITHUB_WORKSPACE\staging\uplink-windows-x86_64.zip"

          # Package aarch64 CLI
          New-Item -ItemType Directory -Force -Path dist-uplink-arm64
          Copy-Item target/aarch64-pc-windows-msvc/release/uplink_cli.exe dist-uplink-arm64/
          Compress-Archive -Path dist-uplink-arm64/* -DestinationPath "$env:GITHUB_WORKSPACE\staging\uplink-windows-aarch64.zip"

      # ─── NRS Client ──────────────────────────────────────────────────────────
      - name: Build & Package NRS Client
        continue-on-error: true
        run: |
          cd by-name/nr/nrs-client/src
          if (!(Test-Path "windows")) {
            flutter create --platforms=windows .
          }
          flutter pub get
          flutter build windows --release

          New-Item -ItemType Directory -Force -Path dist-nrs
          Copy-Item -Recurse build/windows/x64/runner/Release/* dist-nrs/
          Compress-Archive -Path dist-nrs/* -DestinationPath "$env:GITHUB_WORKSPACE\staging\nrs-client-windows-x86_64.zip"

      - name: Upload Windows Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: staging/*
          if-no-files-found: ignore
          retention-days: 1

  publish-release:
    name: Publish Release to GitHub
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]
    if: always() && !cancelled()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: release-artifacts/
          merge-multiple: true

      - name: Generate Checksums & Verify Artifacts
        id: check_artifacts
        run: |
          if [ -d release-artifacts ] && [ -n "$(ls -A release-artifacts 2>/dev/null)" ]; then
            cd release-artifacts
            sha256sum * > SHA256SUMS.txt
            echo "### Release Checksums" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat SHA256SUMS.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
          else
            echo "No artifacts found to publish."
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
          fi

      - name: Set Release Date
        if: steps.check_artifacts.outputs.has_artifacts == 'true'
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Publish Nightly Release
        if: steps.check_artifacts.outputs.has_artifacts == 'true'
        uses: softprops/action-gh-release@c95fe1489396fe8a9ec87453c663f53724e23043 # v2.2.1
        with:
          tag_name: nightly
          name: "Daily Release (${{ steps.date.outputs.date }})"
          prerelease: true
          files: release-artifacts/*

builds:
 exclude: []
 include:
 - 'packages.x86_64-linux.*'
 - 'packages.aarch64-darwin.*'
 - 'packages.aarch64-linux.*'
 # miodroid's NixOS VM tests: they boot Android in a container (rootful and
 # rootless) and wait for sys.boot_completed, so they take tens of minutes and
 # download ~1.5 GiB of OTA images per run. Drop this line to keep CI cheap;
 # run them by hand with `nix build .#checks.x86_64-linux.miodroid-nixos`.
 - 'checks.x86_64-linux.*'
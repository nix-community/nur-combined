<!-- TEMPLATE_HEADER - Used by Every UI Page -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<title>Helios</title>
<link rel="icon" type="image/x-icon" href="./images/helios.ico">
<script>
  // Apply the stored colour scheme before first paint so the page never flashes
  // the wrong theme. "auto" leaves the attribute off and lets the tokens fall
  // through to prefers-color-scheme.
  try {
    var storedTheme = localStorage.getItem('theme');
    if (storedTheme === 'light' || storedTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', storedTheme);
    }
  } catch (e) { /* private mode; the OS preference still applies */ }
</script>
<link href="./styles/index.css" rel="stylesheet" />

<!DOCTYPE html>
<html lang="en">

<head>
  <%- header %>
</head>

<body id="app" v-cloak>
  <main class="helios-welcome-page">
    <div class="helios-welcome-grid">
      <div>
        <div class="flex items-center justify-between mb-4">
          <span class="helios-auth-brand">
            <span class="helios-mark helios-mark--lg"><img src="./images/logo-helios-45.png" alt="" /></span>
            <span class="md-title-large md-emphasized">Helios</span>
          </span>
          <theme-toggle ></theme-toggle>
        </div>

        <section class="md-card md-card--elevated">
          <div class="md-card__body">
            <h1 class="md-headline-small md-emphasized">{{ $t('welcome.greeting') }}</h1>
            <p class="md-body-large text-muted mt-2">{{ $t('welcome.create_creds') }}</p>

            <banner variant="warning" class="mt-4">{{ $t('welcome.create_creds_alert') }}</banner>

            <form @submit.prevent="save" class="stack mt-5">
              <text-field
                id="usernameInput"
                :label="$t('_common.username')"
                autocomplete="username"
                v-model="passwordData.newUsername"
              ></text-field>
              <text-field
                id="passwordInput"
                type="password"
                :label="$t('_common.password')"
                autocomplete="new-password"
                required
                v-model="passwordData.newPassword"
              ></text-field>
              <text-field
                id="confirmPasswordInput"
                type="password"
                :label="$t('welcome.confirm_password')"
                autocomplete="new-password"
                required
                v-model="passwordData.confirmNewPassword"
              ></text-field>

              <button type="submit" class="md-button md-button--filled md-button--md md-button--block" :disabled="loading">
                <span v-if="loading" class="md-spinner"></span>
                {{ $t('welcome.login') }}
              </button>

              <banner variant="error" v-if="error"><b>{{ $t('_common.error') }}</b> {{error}}</banner>
              <banner variant="success" v-if="success">
                <b>{{ $t('_common.success') }}</b> {{ $t('welcome.welcome_success') }}
              </banner>
            </form>
          </div>
        </section>
      </div>

      <resource-card ></resource-card>
    </div>
  </main>
</body>

<script type="module">
  import { createApp } from "vue"
  import { initApp } from './init'
  import Banner from './Banner.vue'
  import ResourceCard from './ResourceCard.vue'
  import TextField from './TextField.vue'
  import ThemeToggle from './ThemeToggle.vue'

  let app = createApp({
    components: { Banner, ResourceCard, TextField, ThemeToggle },
    data() {
      return {
        error: null,
        success: false,
        loading: false,
        passwordData: {
          newUsername: "apollo",
          newPassword: "",
          confirmNewPassword: "",
        },
      };
    },
    methods: {
      save() {
        if (this.passwordData.newPassword !== this.passwordData.confirmNewPassword) {
          this.error = "Password mismatch";
          return;
        };
        this.error = null;
        this.loading = true;
        fetch("./api/password", {
          headers: {
            'Content-Type': 'application/json'
          },
          method: 'POST',
          body: JSON.stringify(this.passwordData),
        }).then((r) => {
          this.loading = false;
          if (r.status === 200) {
            r.json().then((rj) => {
              this.success = rj.status;
              if (this.success === true) {
                setTimeout(() => {
                  document.location.reload();
                }, 5000);
              } else {
                this.error = rj.error;
              }
            });
          } else {
            this.error = "Internal Server Error";
          }
        });
      },
    },
  });

  initApp(app);
</script>

<!DOCTYPE html>
<html lang="en">

<head>
  <%- header %>
</head>

<body id="app" v-cloak>
  <main class="helios-auth-page">
    <div class="helios-auth-card">
      <div class="flex items-center justify-between mb-4">
        <span class="helios-auth-brand">
          <span class="helios-mark helios-mark--lg"><img src="/images/logo-helios-45.png" alt="" /></span>
          <span class="md-title-large md-emphasized">Helios</span>
        </span>
        <theme-toggle ></theme-toggle>
      </div>

      <section class="md-card md-card--elevated">
        <div class="md-card__body">
          <h1 class="md-headline-small md-emphasized">{{ $t('welcome.greeting') }}</h1>

          <form @submit.prevent="login" class="stack mt-5">
            <text-field
              id="usernameInput"
              :label="$t('_common.username')"
              autocomplete="username"
              required
              autofocus
              v-model="passwordData.username"
            ></text-field>
            <text-field
              id="passwordInput"
              type="password"
              :label="$t('_common.password')"
              autocomplete="current-password"
              required
              v-model="passwordData.password"
            ></text-field>

            <label class="md-switch-row" for="savePassword">
              <span class="md-switch-row__text">
                <span class="md-switch-row__label">{{ $t('login.save_password') }}</span>
              </span>
              <md-switch id="savePassword" v-model="savePassword"></md-switch>
            </label>

            <button type="submit" class="md-button md-button--filled md-button--md md-button--block" :disabled="loading">
              <span v-if="loading" class="md-spinner"></span>
              {{ $t('welcome.login') }}
            </button>

            <banner variant="error" v-if="error"><b>{{ $t('_common.error') }}</b> {{error}}</banner>
            <banner variant="success" v-if="success">
              <b>{{ $t('_common.success') }}</b> {{ $t('welcome.login_success') }}
            </banner>
          </form>
        </div>
      </section>
    </div>
  </main>
</body>

<script type="module">
  import { createApp, ref } from "vue"
  import { initApp } from './init'
  import Banner from './Banner.vue'
  import MdSwitch from './MdSwitch.vue'
  import TextField from './TextField.vue'
  import ThemeToggle from './ThemeToggle.vue'

  let app = createApp({
    components: { Banner, MdSwitch, TextField, ThemeToggle },
    setup() {
      const error = ref('');
      const success = ref(false);
      const loading = ref(false);
      const savePassword = ref(false);

      const data = {
        error,
        success,
        loading,
        savePassword,
        passwordData: {
          username: '',
          password: ''
        }
      }

      const savedPasswordStr = localStorage.getItem('login')
      if (savedPasswordStr) {
        try {
          const { username, password } = JSON.parse(savedPasswordStr);
          savePassword.value = true;
          data.passwordData = {
            username,
            password
          }
        } catch (e) {
          console.error('Reading saved password failed!', e);
        }
      }

      return data
    },
    methods: {
      login() {
        this.error = null;
        this.loading = true;
        if (!this.savePassword) {
          localStorage.removeItem('login')
        }
        fetch("./api/login", {
          headers: {
            'Content-Type': 'application/json'
          },
          method: 'POST',
          body: JSON.stringify(this.passwordData),
        }).then((res) => {
          this.loading = false;
          if (res.status === 200) {
            this.success = true;
            if (this.savePassword) {
              localStorage.setItem('login', JSON.stringify(this.passwordData));
            }
            const url = new URL(window.location);
            const redirectUrl = url.searchParams.get('redir');
            const hash = url.hash;
            if (redirectUrl && redirectUrl.startsWith('.')) {
              location.href = redirectUrl + hash;
            } else {
              location.href = './' + hash;
            }
          } else {
            if (res.status === 401) {
              throw new Error('Please check your username and password')
            } else {
              throw new Error(`Server returned ${res.status}`);
            }
          }
        }).catch((e) => {
          this.error = `Login failed: ${e.message}`;
        });
      },
    },
  });

  initApp(app);
</script>

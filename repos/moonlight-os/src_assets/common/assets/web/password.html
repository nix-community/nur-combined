<!DOCTYPE html>
<html lang="en">

<head>
  <%- header %>
</head>

<body id="app" v-cloak>
  <app-frame page="password" :title="$t('password.password_change')">
    <form @submit.prevent="save" class="stack-lg">
      <section class="md-card md-card--elevated">
        <div class="md-card__body">
          <div class="helios-password-grid">
            <div class="stack">
              <div class="flex items-center gap-3">
                <span class="md-card__badge"><icon name="lock" filled ></icon></span>
                <h2 class="md-card__title">{{ $t('password.current_creds') }}</h2>
              </div>
              <text-field
                id="currentUsername"
                :label="$t('_common.username')"
                autocomplete="username"
                required
                v-model="passwordData.currentUsername"
              ></text-field>
              <text-field
                id="currentPassword"
                type="password"
                :label="$t('_common.password')"
                autocomplete="current-password"
                v-model="passwordData.currentPassword"
              ></text-field>
            </div>

            <div class="stack">
              <div class="flex items-center gap-3">
                <span class="md-card__badge"><icon name="key" filled ></icon></span>
                <h2 class="md-card__title">{{ $t('password.new_creds') }}</h2>
              </div>
              <text-field
                id="newUsername"
                :label="$t('_common.username')"
                :supporting="$t('password.new_username_desc')"
                v-model="passwordData.newUsername"
              ></text-field>
              <text-field
                id="newPassword"
                type="password"
                :label="$t('_common.password')"
                autocomplete="new-password"
                required
                v-model="passwordData.newPassword"
              ></text-field>
              <text-field
                id="confirmNewPassword"
                type="password"
                :label="$t('password.confirm_password')"
                autocomplete="new-password"
                required
                v-model="passwordData.confirmNewPassword"
              ></text-field>
            </div>
          </div>
        </div>
      </section>

      <banner variant="error" v-if="error"><b>{{ $t('_common.error') }}</b> {{error}}</banner>
      <banner variant="success" v-if="success">
        <b>{{ $t('_common.success') }}</b> {{ $t('password.success_msg') }}
      </banner>

      <div>
        <button class="md-button md-button--filled md-button--md">
          <icon name="save"></icon>{{ $t('_common.save') }}
        </button>
      </div>
    </form>
  </app-frame>
</body>

<script type="module">
  import { createApp } from 'vue'
  import { initApp } from './init'
  import AppFrame from './AppFrame.vue'
  import Banner from './Banner.vue'
  import TextField from './TextField.vue'

  const app = createApp({
    components: { AppFrame, Banner, TextField },
    data() {
      return {
        error: null,
        success: false,
        passwordData: {
          currentUsername: "",
          currentPassword: "",
          newUsername: "",
          newPassword: "",
          confirmNewPassword: "",
        },
      };
    },
    methods: {
      save() {
        if (this.passwordData.newPassword !== this.passwordData.confirmNewPassword) {
          this.error = "Password mismatch";
          return;
        };
        this.error = null;
        fetch("./api/password", {
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json'
          },
          method: 'POST',
          body: JSON.stringify(this.passwordData),
        }).then((r) => {
          if (r.status === 200) {
            r.json().then((rj) => {
              this.success = rj.status;
              if (this.success === true) {
                setTimeout(() => {
                  document.location.reload();
                }, 5000);
              } else {
                this.error = rj.error;
              }
            });
          } else {
            this.error = "Internal Server Error";
          }
        });
      },
    },
  });

  initApp(app);
</script>

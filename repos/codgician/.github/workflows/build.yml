name: build
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [build]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  harness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      attr: ${{ steps.classify.outputs.attr }}
    steps:
      - name: Classify pull request scope
        id: classify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.setOutput("attr", "");
              core.setOutput("package-only", "false");
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const packages = new Set();
            let packageOnly = files.length > 0 && files.length < 3000;
            for (const file of files) {
              if (file.status === "removed") {
                packageOnly = false;
                break;
              }
              for (const path of [file.filename, file.previous_filename].filter(Boolean)) {
                const match = /^pkgs\/([a-z][a-z0-9_-]{0,63})\/.+/.exec(path);
                if (!match) {
                  packageOnly = false;
                  break;
                }
                packages.add(match[1]);
              }
              if (!packageOnly) break;
            }
            packageOnly &&= packages.size === 1;

            const packageName = packageOnly ? [...packages][0] : "";
            core.setOutput("attr", packageOnly ? `*.*.${packageName}` : "");
            core.setOutput("package-only", packageOnly ? "true" : "false");
            core.notice(
              packageOnly
                ? `Building only package and check attributes for ${packageName}`
                : "Building the full CI attribute set",
            );
      - name: Reuse package-scoped validation
        if: steps.classify.outputs.package-only == 'true'
        run: echo "Automation sources are unchanged; package builds provide the required validation"
      - name: Checkout
        if: steps.classify.outputs.package-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Nix
        if: steps.classify.outputs.package-only != 'true'
        uses: NixOS/nix-installer-action@main # zizmor: ignore[unpinned-uses] track upstream main
        with:
          extra-conf: |
            accept-flake-config = true
            experimental-features = nix-command flakes
      - name: Validate automation
        if: steps.classify.outputs.package-only != 'true'
        run: |
          nix fmt -- --ci .github flake.nix
          nix develop .# -c actionlint
          nix develop .# -c zizmor .github/workflows
          nix develop .# -c shellcheck .github/scripts/*.sh
          nix develop .# -c .github/scripts/automation_guards.test.sh
          nix develop .# -c check-jsonschema \
            --schemafile https://json.schemastore.org/github-issue-forms.json \
            .github/ISSUE_TEMPLATE/new-package.yml
  atelier:
    needs: harness
    permissions:
      contents: read
      checks: write
      # Atelier's nested workflow declares OIDC for optional cache pushes.
      id-token: write
    uses: stepbrobd/atelier/.github/workflows/discover.yaml@0dc970e40d5be02aaea0d7e88cbf5e0b96a9a8b6 # 2026.722.0
    with:
      attr: ${{ needs.harness.outputs.attr }}
      push: ${{ github.ref == 'refs/heads/main' }}
    secrets:
      ATTIC_TOKEN: ${{ secrets.CACHE_PUSH_TOKEN }}
  nur:
    needs: atelier
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger NUR update
        continue-on-error: true
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 120 \
            --request POST "https://nur-update.nix-community.org/update?repo=codgician"

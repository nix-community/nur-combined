name: merge queue
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: deterministic-merge-queue
  cancel-in-progress: false
jobs:
  advance:
    if: ${{ github.repository_id == '852828187' }}
    runs-on: ubuntu-latest
    steps:
      - name: Select stale bot pull request
        id: candidate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              base: "main",
              sort: "created",
              direction: "asc",
              per_page: 100,
            });
            const { data: baseBranch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "main",
            });
            const baseSha = baseBranch.commit.sha;

            for (const pull of pulls) {
              const labels = new Set(pull.labels.map((label) => label.name));
              if (
                pull.user?.id !== 304539431 ||
                pull.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                !/^bot\/[a-z][a-z0-9_-]{0,63}$/.test(pull.head.ref) ||
                !labels.has("bot") ||
                (!labels.has("bot-deterministic") && !labels.has("bot-ai-repair"))
              ) {
                continue;
              }

              const { data: details } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
              });
              if (details.mergeable_state === "dirty") continue;

              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                owner: context.repo.owner,
                repo: context.repo.repo,
                basehead: `${details.head.sha}...${baseSha}`,
              });
              if (comparison.ahead_by === 0) continue;

              core.setOutput("number", String(pull.number));
              core.setOutput("head-sha", details.head.sha);
              return;
            }
            core.notice("No bot pull request needs a branch update");
      - name: Generate bot token
        if: steps.candidate.outputs.number != ''
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Update bot pull request
        if: steps.candidate.outputs.number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          HEAD_SHA: ${{ steps.candidate.outputs.head-sha }}
          PR_NUMBER: ${{ steps.candidate.outputs.number }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            try {
              await github.rest.pulls.updateBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(process.env.PR_NUMBER),
                expected_head_sha: process.env.HEAD_SHA,
              });
              core.notice(`Updated PR #${process.env.PR_NUMBER}; required checks will run again`);
            } catch (error) {
              const message = error.response?.data?.message || "";
              if (error.status === 422 && /not behind|head branch was modified/i.test(message)) {
                core.notice(`PR #${process.env.PR_NUMBER} no longer needs this update`);
                return;
              }
              throw error;
            }

name: "Build CachyOS kernel (self-hosted)"

# Only pushes to main and manual runs of main. No pull_request, pull_request_target
# or issue_comment: the repository is public and this runner holds the write token
# for uriotv (CACHIX_AUTH_TOKEN), which must never be reachable from untrusted code.
#
# Every push to main is checked, not only kernel paths: the kernels are built with
# the repository nixpkgs (flake.lock), so any lock change can change them. Outputs
# already in uriotv are realised without compilation. Each run posts a publication
# status per kernel; the cache branch is promoted only when all of them succeeded.
on:
  push:
    branches: [main]
  # Daily path: after a successful scheduled or manual update run on main, check the
  # kernel again (realise or build) and push to both caches, even without a new pin.
  workflow_run:
    workflows: ['Update packages']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even if every output of the current pin is already in uriotv'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: kernel-cachyos-v3
  # Never cancel a half-finished build or push.
  cancel-in-progress: false

env:
  # Build from source on this runner. Upstream and third-party kernel caches are
  # not substituters: cache.nixos.org (nixpkgs) and uriotv (our own) only.
  BUILD_SUBSTITUTERS: https://cache.nixos.org https://uriotv.cachix.org

jobs:
  build-kernel:
    name: Build ${{ matrix.kernel }}
    strategy:
      fail-fast: false
      # One 8-thread compilation at a time on the shared builder.
      max-parallel: 1
      matrix:
        kernel:
          - linux-cachyos-latest-x86_64-v3
          - linux-cachyos-bore-x86_64-v3
    env:
      KERNEL_ATTR: ${{ matrix.kernel }}
    # Stays disabled until the cachix-builder runner exists. Set the repository
    # variable KERNEL_BUILDER_ENABLED to 'true' only then; otherwise the job would
    # wait in the queue forever.
    # workflow_run is trusted only for successful scheduled/manual runs of this repository.
    if: >-
      github.ref == 'refs/heads/main' && vars.KERNEL_BUILDER_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')))
    permissions:
      contents: read
      statuses: write
    runs-on: [self-hosted, nixos, cachix-builder]
    # First build is from scratch on 8 threads (estimate: ~1 h, 6-10 GB peak RAM).
    # 12 h leaves room for a slow first run without cutting the build off.
    timeout-minutes: 720
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Provide tools from the locked nixpkgs
        # The NixOS runner service has a minimal PATH (no awk, for example).
        # Plain bash only here; later steps use these pinned tools.
        run: |
          set -euo pipefail
          nix build --no-link --print-out-paths --no-write-lock-file --inputs-from . \
            nixpkgs#coreutils nixpkgs#gawk nixpkgs#gnugrep nixpkgs#findutils \
            nixpkgs#curl nixpkgs#jq nixpkgs#python3 nixpkgs#cachix nixpkgs#attic-client nixpkgs#gh \
            > "$RUNNER_TEMP/tool-paths"
          while IFS= read -r path; do
            [[ -d "$path/bin" ]] && echo "$path/bin" >> "$GITHUB_PATH"
          done < "$RUNNER_TEMP/tool-paths"

      - name: Skip if the current pin is already published
        id: published
        env:
          FORCE_BUILD: ${{ inputs.force }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # ${o} is Nix interpolation, not shell
          nix eval --json --no-write-lock-file ".#packages.x86_64-linux.\"${KERNEL_ATTR}\"" \
            --apply 'p: map (o: p.${o}.outPath) p.outputs' > "$RUNNER_TEMP/expected-outputs.json"
          missing=0
          for path in $(jq -r '.[]' "$RUNNER_TEMP/expected-outputs.json"); do
            hash=${path#/nix/store/}
            hash=${hash%%-*}
            if curl --fail --silent --retry 3 --retry-all-errors \
                 "https://uriotv.cachix.org/${hash}.narinfo" | grep -Fxq "StorePath: $path"; then
              echo "In uriotv: $path"
            else
              echo "Missing in uriotv: $path"
              missing=1
            fi
          done
          if (( missing == 0 )) && [[ "${FORCE_BUILD:-false}" != true ]]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo '## Kernel pin already published to uriotv; build skipped' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Check builder resources
        if: steps.published.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mem_gib=$(awk '/MemTotal/ { printf "%d", $2 / 1048576 }' /proc/meminfo)
          disk_gib=$(df -Pk /nix/store | awk 'NR == 2 { printf "%d", $4 / 1048576 }')
          echo "RAM: ${mem_gib} GiB, free disk for /nix/store: ${disk_gib} GiB"
          (( mem_gib >= 12 )) || { echo '::error::Less than 12 GiB RAM on the builder'; exit 1; }
          (( disk_gib >= 40 )) || { echo '::error::Less than 40 GiB free in /nix/store'; exit 1; }

      - name: Record derivation for consumer comparison
        if: steps.published.outputs.skip != 'true'
        run: |
          set -euo pipefail
          drv=$(nix eval --raw --no-write-lock-file \
            ".#packages.x86_64-linux.\"${KERNEL_ATTR}\".drvPath")
          {
            echo '## Kernel derivation'
            echo "\`${drv}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Refuse to build if the kernel would be substituted
        if: steps.published.outputs.skip != 'true'
        run: |
          set -euo pipefail
          attr=".#packages.x86_64-linux.\"${KERNEL_ATTR}\"^*"
          nix build --dry-run --no-write-lock-file \
            --option substituters "$BUILD_SUBSTITUTERS" "$attr" > "$RUNNER_TEMP/dry-run.txt" 2>&1
          if grep -q "will be built:" "$RUNNER_TEMP/dry-run.txt" \
             && grep -q "/[a-z0-9]\{32\}-${KERNEL_ATTR}-.*\.drv$" "$RUNNER_TEMP/dry-run.txt"; then
            echo 'Kernel derivation must be built here; it is listed for building.'
          elif out=$(nix eval --raw --no-write-lock-file ".#packages.x86_64-linux.\"${KERNEL_ATTR}\".outPath") \
               && nix path-info "$out" > /dev/null 2>&1; then
            echo "Kernel output already present in the local store: $out"
          else
            echo '::error::The kernel would be fetched from a substituter, not built. Check the builder nix.conf (substituters, trusted-users) and retry.'
            cat "$RUNNER_TEMP/dry-run.txt"
            exit 1
          fi

      - name: Realise already-published kernel outputs (no compilation)
        # When the pin is already in uriotv, fetch the outputs so both pushes can still
        # run. --max-jobs 0 makes Nix fail instead of compiling if they cannot be fetched.
        id: realise
        if: steps.published.outputs.skip == 'true'
        run: |
          set -euo pipefail
          nix build --no-link --no-write-lock-file --max-jobs 0 --print-out-paths \
            ".#packages.x86_64-linux.\"${KERNEL_ATTR}\"^*" > "$RUNNER_TEMP/kernel-outputs"
          cat "$RUNNER_TEMP/kernel-outputs"

      - name: Prove realised outputs came from uriotv
        # Nix copies signatures from the source it substituted from, so a fetched path
        # carries the uriotv signature. A path already in this runner's store from an
        # earlier build has the same hash but no uriotv signature: it is accepted and
        # reported as local. --max-jobs 0 still guarantees nothing is compiled now.
        if: steps.realise.outcome == 'success'
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            if nix path-info --sigs "$path" | grep -q 'uriotv.cachix.org-1:'; then
              echo "fetched from uriotv: $path"
            elif [[ -e "$path" ]]; then
              echo "already in local store (not compiled in this run): $path"
            else
              echo "::error::output missing after realise: $path"
              exit 1
            fi
          done < "$RUNNER_TEMP/kernel-outputs"

      - name: Build kernel outputs from source
        id: build
        if: steps.published.outputs.skip != 'true'
        run: |
          set -euo pipefail
          nix build --no-link --no-write-lock-file --print-build-logs --print-out-paths \
            --option substituters "$BUILD_SUBSTITUTERS" \
            --cores 8 --max-jobs 1 \
            ".#packages.x86_64-linux.\"${KERNEL_ATTR}\"^*" > "$RUNNER_TEMP/kernel-outputs"
          cat "$RUNNER_TEMP/kernel-outputs"

      - name: Verify redistribution rights for the complete built closure
        id: closure
        # Runs whenever the outputs exist locally: freshly built or realised.
        if: >-
          always() &&
          (steps.build.outcome == 'success' || steps.realise.outcome == 'success')
        run: |
          set -euo pipefail
          nix eval --json --no-write-lock-file \
            ".#ci.x86_64-linux.kernelLicenseManifests.\"${KERNEL_ATTR}\"" \
            > "$RUNNER_TEMP/kernel-license-manifest.json"
          xargs nix path-info -r < "$RUNNER_TEMP/kernel-outputs" > "$RUNNER_TEMP/kernel-closure"
          {
            echo '## Automatic closure redistribution check'
            python3 -B scripts/check-kernel-closure.py \
              "$RUNNER_TEMP/kernel-license-manifest.json" "$RUNNER_TEMP/kernel-closure" \
              "$RUNNER_TEMP/kernel-outputs" "$RUNNER_TEMP/expected-outputs.json"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish to uriotv and verify StorePath
        id: cachix
        # Automatic only after successful build AND fail-closed closure check.
        # Only this main-only step receives the write token; never a PR job.
        # Independent of attic and of whether the pin was already published: pushes
        # every time the closure passed the licence gate.
        if: >-
          always() && steps.closure.outcome == 'success' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run')
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          cachix push uriotv < "$RUNNER_TEMP/kernel-outputs"
          while IFS= read -r path; do
            hash=${path#/nix/store/}
            hash=${hash%%-*}
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              "https://uriotv.cachix.org/${hash}.narinfo" > "$RUNNER_TEMP/output.narinfo"
            grep -Fx "StorePath: $path" "$RUNNER_TEMP/output.narinfo"
          done < "$RUNNER_TEMP/kernel-outputs"
          echo 'Kernel outputs published and their StorePath verified.'

      - name: Push kernel outputs to the private attic cache
        # Independent of cachix: runs once the build and licence check passed, even if
        # the cachix step failed. Never fails the job. Skipped with a warning when
        # ATTIC_TOKEN is empty.
        id: attic
        continue-on-error: true
        if: >-
          always() && steps.closure.outcome == 'success' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run')
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: bash scripts/attic-push.sh "$RUNNER_TEMP/kernel-outputs"

      - name: Record publication status for the cache branch
        # Success only when the closure passed the licence gate, uriotv was pushed and
        # verified, and the private attic push succeeded with ATTIC_TOKEN configured.
        # Runs for trusted main events only; a failed status keeps cache unchanged.
        if: >-
          always() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run')
        env:
          GH_TOKEN: ${{ github.token }}
          CLOSURE_OUTCOME: ${{ steps.closure.outcome }}
          CACHIX_OUTCOME: ${{ steps.cachix.outcome }}
          ATTIC_OUTCOME: ${{ secrets.ATTIC_TOKEN != '' && steps.attic.outcome || 'failure' }}
        run: bash scripts/publication-status.sh "cache/kernel/${KERNEL_ATTR}" "$CLOSURE_OUTCOME" "$CACHIX_OUTCOME" "$ATTIC_OUTCOME"

name: CachyOS BORE v3 kernel

on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
      NIXBUILD_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # Compilation happens on nixbuild.net; this bounds a stuck remote build.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: Free space for the copied-back kernel outputs
        run: |
          # Outputs are copied back for Cachix; use only this disposable VM.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /
      - uses: ./.github/actions/setup-nix-nixbuild
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
          # Without history nixbuild.net would start this build with 2 CPUs.
          nixbuild_settings: |
            min-cpu = 16
      - name: Evaluate module and selected kernel
        run: |
          nix eval --impure --json --expr 'import ./tests/cachyos-module.nix { pkgs = (import ./pkgs/linux-cachyos-bore-x86_64-v3/pinned.nix {}).pkgs; }'
          nix eval --impure --json --file tests/cachyos-integration.nix
          nix eval --impure --json --file tests/publisher-secrets.nix
          nix eval --no-write-lock-file --json .#packages.x86_64-linux.linux-cachyos-bore-x86_64-v3.version
      - name: Build kernel and development output
        run: |
          set -euo pipefail
          # ^* includes all outputs (not just the boot image): external modules need dev.
          /usr/bin/time -v nix build --print-build-logs --no-write-lock-file --no-link --json \
            '.#packages.x86_64-linux.linux-cachyos-bore-x86_64-v3^*' \
            '.#packages.x86_64-linux.linux-cachyos-bore-x86_64-v3.src' \
            '.#packages.x86_64-linux.linux-cachyos-bore-x86_64-v3.urioUpstreamSource' \
            > "$RUNNER_TEMP/kernel-build.json"
          cat "$RUNNER_TEMP/kernel-build.json"
          jq -r '.[].outputs[]' "$RUNNER_TEMP/kernel-build.json" | sort -u > "$RUNNER_TEMP/kernel-paths"
          while IFS= read -r path; do
            du -sh "$path"
          done < "$RUNNER_TEMP/kernel-paths"
          {
            echo '## CachyOS BORE x86_64-v3 (non-LTO)'
            echo 'Built on nixbuild.net; outputs:'
            echo '```'
            cat "$RUNNER_TEMP/kernel-paths"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          df -h /
      - name: Publish and verify Cachix outputs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CACHIX_AUTH_TOKEN" || { echo '::error::Missing CACHIX_AUTH_TOKEN'; exit 1; }
          cachix push uriotv < "$RUNNER_TEMP/kernel-paths"
          while IFS= read -r path; do
            hash="${path#/nix/store/}"
            hash="${hash%%-*}"
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              "https://uriotv.cachix.org/${hash}.narinfo" > "$RUNNER_TEMP/kernel.narinfo"
            grep -Fx "StorePath: $path" "$RUNNER_TEMP/kernel.narinfo"
          done < "$RUNNER_TEMP/kernel-paths"
          echo 'All kernel outputs published and their narinfo verified on uriotv.cachix.org.' >> "$GITHUB_STEP_SUMMARY"

name: "Build and populate cache"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main, master]
  # One daily clock: the updater starts at 02:00 Europe/Warsaw. Audit/cache
  # validation follows its successful completion, rather than a second cron.
  workflow_run:
    workflows: ['Update packages']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_storyforge_updater:
        description: 'Regenerate StoryForge locks using the pinned generator (may build the tool)'
        type: boolean
        required: false
        default: false
      allow_heavy_builds:
        description: 'Allow compiling toolchains (compilers/SDKs) from source; may exceed the job timeout'
        type: boolean
        required: false
        default: false

env:
  CI_TRUSTED_UPDATE_COMPLETION: >-
    ${{ github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch') }}

jobs:
  test-update-scripts:
    # Never grant a workflow_run from PR/untrusted code a publication path.
    if: >-
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.user.login == github.repository_owner &&
        github.event.pull_request.head.repo.full_name == github.repository)) &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: [self-hosted, nixos, cachix-builder]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-runner-tools
      - name: Run offline workflow and update-script tests
        run: |
          ./tests/run-tests.sh

  tests:
    needs: test-update-scripts
    # statuses: write is used only by the main-only publication status step below.
    permissions:
      contents: read
      statuses: write
    runs-on: [self-hosted, nixos, cachix-builder]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        nurRepo: [urio-nur]
        cachixName: [uriotv]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The publication granularity below needs the parent commit to tell a
          # shared flake-input change from a package-only change.
          fetch-depth: 2
      - name: Detect shared flake input changes
        run: |
          # flake.lock/flake.nix are shared by every package: a revision that moves
          # them is published all-or-nothing, a package-only revision is published
          # per package. Without history, stay conservative (all-or-nothing).
          if git rev-parse --quiet --verify 'HEAD^' > /dev/null 2>&1; then
            if git diff --quiet HEAD^ HEAD -- flake.lock flake.nix; then
              echo 'CI_SHARED_INPUTS_CHANGED=false' >> "$GITHUB_ENV"
            else
              echo 'CI_SHARED_INPUTS_CHANGED=true' >> "$GITHUB_ENV"
            fi
          else
            echo '::notice::No parent commit available; treating shared flake inputs as changed.'
            echo 'CI_SHARED_INPUTS_CHANGED=unknown' >> "$GITHUB_ENV"
          fi
      - uses: ./.github/actions/setup-runner-tools
      # The NixOS runner already configures uriotv as a read-only substituter.
      - name: Evaluate CI manifest
        env:
          CI_MANIFEST_PATH: ${{ runner.temp }}/ci-manifest.json
        run: |
          python3 -B tests/registry-eval.py
          nix eval --json --no-write-lock-file .#ci.x86_64-linux.policyTests
          nix eval --json --no-write-lock-file .#ci.x86_64-linux.kernelTests
          nix eval --json --no-write-lock-file .#ci.x86_64-linux.overlayPinTests
          nix eval --json --no-write-lock-file .#ci.x86_64-linux.manifest > "$CI_MANIFEST_PATH"
          python3 -B scripts/readme-versions.py --check --manifest "$CI_MANIFEST_PATH"
      - name: Verify StoryForge dependency regeneration
        if: github.event_name == 'workflow_dispatch' && inputs.verify_storyforge_updater
        run: ./pkgs/storyforge/update.sh --verify-current
      - name: Build every eligible package output
        env:
          CI_MANIFEST_PATH: ${{ runner.temp }}/ci-manifest.json
          CI_BUILT_OUTPUTS_FILE: ${{ runner.temp }}/ci-built-outputs.txt
          CI_ALLOW_HEAVY_BUILDS: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_heavy_builds }}
        run: bash scripts/build-ci.sh
      - name: Publish eligible outputs
        id: cachix
        # Runs after a failed build too: the successful packages still warm the
        # cache. Only a shared flake-input change makes publication all-or-nothing.
        if: >-
          !cancelled() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'workflow_run' && env.CI_TRUSTED_UPDATE_COMPLETION == 'true'))
        env:
          CI_MANIFEST_PATH: ${{ runner.temp }}/ci-manifest.json
          CI_BUILT_OUTPUTS_FILE: ${{ runner.temp }}/ci-built-outputs.txt
          CI_PUBLISH_ONLY: 'true'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: bash scripts/build-ci.sh
      - name: Trigger NUR update
        if: >-
          success() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'workflow_run' && env.CI_TRUSTED_UPDATE_COMPLETION == 'true'))
        run: bash scripts/notify-nur.sh '${{ matrix.nurRepo }}'

      - name: Record publication status for the cache branch
        # Success only when eligible outputs were pushed to uriotv and verified.
        if: >-
          always() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'workflow_run' && env.CI_TRUSTED_UPDATE_COMPLETION == 'true'))
        env:
          GH_TOKEN: ${{ github.token }}
          CACHIX_OUTCOME: ${{ steps.cachix.outcome }}
        run: bash scripts/publication-status.sh cache/packages "$CACHIX_OUTCOME"

  test-gate:
    runs-on: [self-hosted, nixos, cachix-builder]
    needs: [test-update-scripts, tests]
    if: >-
      always() && (github.event_name != 'pull_request' ||
      (github.event.pull_request.user.login == github.repository_owner &&
       github.event.pull_request.head.repo.full_name == github.repository)) &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')))
    steps:
      - name: Check test results
        env:
          UPDATE_RESULT: ${{ needs.test-update-scripts.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          if [ "$UPDATE_RESULT" != success ] || [ "$TESTS_RESULT" != success ]; then
            echo '::error::CI checks failed; merge is blocked.'
            exit 1
          fi
          echo 'All CI checks passed'

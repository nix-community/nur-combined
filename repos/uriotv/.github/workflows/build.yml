name: "Build and populate cache"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    # rebuild everyday at 2:51
    # TIP: Choose a random time here so not all repositories are build at once:
    # https://www.random.org/clock-times/?num=1&earliest=01%3A00&latest=08%3A00&interval=5&format=html&rnd=new
    - cron:  '51 2 * * *'
  workflow_dispatch:
jobs:
  test-update-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run update script tests
        run: ./tests/run-tests.sh

  kernel:
    uses: ./.github/workflows/kernel.yml
    permissions:
      contents: read
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      NIXBUILD_TOKEN: ${{ secrets.NIXBUILD_TOKEN }}

  # This is a required branch-protection check. Keep it dependent on every CI
  # test job so auto-merge cannot bypass a failed package build.
  test-gate:
    runs-on: ubuntu-latest
    needs:
      - test-update-scripts
      - tests
      - kernel
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test-update-scripts.result }}" != "success" ] || [ "${{ needs.tests.result }}" != "success" ] || [ "${{ needs.kernel.result }}" != "success" ]; then
            echo "::error::CI checks failed; merge is blocked."
            exit 1
          fi
          echo "✓ All CI checks passed"

  tests:
    strategy:
      fail-fast: false
      matrix:
        # Set this to notify the global nur package registry that changes are
        # available.
        #
        # The repo name as used in
        # https://github.com/nix-community/NUR/blob/master/repos.json
        nurRepo:
          - urio-nur
        # Set this to cache your build results in cachix for faster builds
        # in CI and for everyone who uses your cache.
        #
        # Format: Your cachix cache host name without the ".cachix.org" suffix.
        # Example: mycache (for mycache.cachix.org)
        #
        # For this to work, you also need to set the CACHIX_SIGNING_KEY or
        # CACHIX_AUTH_TOKEN secret in your repository secrets settings in
        # Github found at
        # https://github.com/<your_githubname>/nur-packages/settings/secrets
        cachixName:
          - uriotv
        nixPath:
          - nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-unstable.tar.gz
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    # Every build goes to nixbuild.net; uriotv.cachix.org is read-only here.
    - name: Set up Nix with nixbuild.net
      uses: ./.github/actions/setup-nix-nixbuild
      with:
        nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
        nix_path: "${{ matrix.nixPath }}"
        extra_nix_config: |
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    - name: Show nixpkgs version
      run: nix-instantiate --eval -E '(import <nixpkgs> {}).lib.version'
    - name: Check evaluation
      run: |
        nix-env -f . -qa \* --meta --xml \
          --allowed-uris https://static.rust-lang.org \
          --option restrict-eval true \
          --option allow-import-from-derivation true \
          --drv-path --show-trace \
          -I "nixpkgs=$(nix-instantiate --find-file nixpkgs)" \
          -I "$PWD"
    - name: Build nix packages
      run: |
        set -euo pipefail
        nix-build ci.nix -A cacheOutputs --keep-going --no-out-link \
          | sort -u > "$RUNNER_TEMP/package-paths"
        cat "$RUNNER_TEMP/package-paths"
    - name: Publish packages to Cachix
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      env:
        CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      run: |
        set -euo pipefail
        test -n "$CACHIX_AUTH_TOKEN" || { echo '::error::Missing CACHIX_AUTH_TOKEN'; exit 1; }
        if [ -s "$RUNNER_TEMP/package-paths" ]; then
          cachix push ${{ matrix.cachixName }} < "$RUNNER_TEMP/package-paths"
        fi
    - name: Trigger NUR update
      # Don't replace <YOUR_REPO_NAME> here!
      if: ${{ matrix.nurRepo != '<YOUR_REPO_NAME>' }}
      run: curl -XPOST "https://nur-update.nix-community.org/update?repo=${{ matrix.nurRepo }}"

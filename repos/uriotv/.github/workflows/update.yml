name: "Update packages"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 2 * * *'
      timezone: 'Europe/Warsaw'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to update (leave empty for all)'
        required: false
        default: ''

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Require update PR token
        env:
          PAT_FOR_UPDATES: ${{ secrets.PAT_FOR_UPDATES }}
        run: |
          if [ -z "$PAT_FOR_UPDATES" ]; then
            echo '::error::PAT_FOR_UPDATES is required; GITHUB_TOKEN cannot trigger PR CI.'
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Install updater tools from the locked nixpkgs input
        run: nix profile install --no-write-lock-file --inputs-from . nixpkgs#nix-update nixpkgs#nix-prefetch-git
      - name: Update packages
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_PACKAGE: ${{ inputs.package }}
          BUILD_LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/update-packages.sh
      - name: Refresh package versions in README
        run: python3 -B scripts/readme-versions.py --write
      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- pkgs/ README.md)" ]; then
            echo 'has_changes=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Create Pull Request
        id: cpr
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_FOR_UPDATES }}
          add-paths: |
            pkgs/
            README.md
          commit-message: 'chore: auto-update packages'
          title: 'chore: Auto-update packages'
          body-path: /tmp/pr-body.md
          branch: auto-update-packages
          delete-branch: true
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_UPDATES }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --squash --auto --delete-branch
      - name: Fail when any package updater failed
        if: always() && steps.update.outputs.update_failures != '' && steps.update.outputs.update_failures != '0'
        env:
          UPDATE_FAILURES: ${{ steps.update.outputs.update_failures }}
          SUCCESSFUL_UPDATES: ${{ steps.update.outputs.successful_updates }}
        run: |
          echo "::error::$UPDATE_FAILURES package updater(s) failed; successful updates: ${SUCCESSFUL_UPDATES:-unknown}."
          exit 1

name: "Update packages"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    # Run every Sunday at 3:00 AM
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to update (leave empty for all)'
        required: false
        default: ''

jobs:
  update:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Setup cachix
        uses: cachix/cachix-action@v17
        with:
          name: uriotv
          signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Install nix-update
        run: nix profile install nixpkgs#nix-update

      - name: Update packages
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_PACKAGE: ${{ inputs.package }}
        run: |
          # markdown_escape FILE: render log as ONE physical line safe for a
          # Markdown table cell: escape backslash/pipe/backtick/angle brackets
          # (so raw logs can never break table structure or inject HTML), then
          # join lines with <br> (GitHub ignores raw newlines inside cells)
          markdown_escape() {
            awk '
              BEGIN { ORS = "" }
              NR > 1 { print "<br>" }
              {
                gsub(/\\/, "\\\\")
                gsub(/\|/, "\\|")
                gsub(/`/, "\\`")
                gsub(/</, "\\<")
                gsub(/>/, "\\>")
                gsub(/\r/, "")
                print
              }
            ' "$1"
            echo
          }

          # truncate FILE MAX_LINES: keep first MAX_LINES lines and add
          # an explicit "truncated" marker; also cap total characters as a
          # second guard
          truncate_log() {
            local file=$1
            local max_lines=$2
            local max_chars=4000
            local lines chars
            lines=$(wc -l < "$file")
            chars=$(wc -c < "$file")
            if [ "$lines" -gt "$max_lines" ]; then
              head -n "$max_lines" "$file" > "$file.tmp"
              echo "... (truncated, $((lines - max_lines)) more lines; see full log in the Build Log)" >> "$file.tmp"
              mv "$file.tmp" "$file"
            fi
            if [ "$(wc -c < "$file")" -gt $max_chars ]; then
              head -c $max_chars "$file" > "$file.tmp"
              echo "" >> "$file.tmp"
              echo "... (truncated at ${max_chars} chars; see full log in the Build Log)" >> "$file.tmp"
              mv "$file.tmp" "$file"
            fi
          }

          summary="## Package Update Status"
          summary+=$'\n'"| Package | Status | Details |"
          summary+=$'\n'"| --- | --- | --- |"

          FAILED=0

          run_update() {
            local script=$1
            local pkg_dir
            local pkg_name
            pkg_dir=$(dirname "$script")
            pkg_name=$(basename "$pkg_dir")

            echo "::group::Updating $pkg_name"

            local output
            if output=$(./"$script" 2>&1); then
              echo "$output" > /tmp/last_output.txt
              echo "✅ Success"
              truncate_log /tmp/last_output.txt 15
              local escaped
              escaped=$(markdown_escape /tmp/last_output.txt)
              summary+=$'\n'"| $pkg_name | ✅ Success | $escaped |"
            else
              echo "$output" > /tmp/last_output.txt
              echo "❌ Failed"
              truncate_log /tmp/last_output.txt 50
              local escaped
              escaped=$(markdown_escape /tmp/last_output.txt)
              summary+=$'\n'"| $pkg_name | ❌ Failed | $escaped |"
              FAILED=1
            fi

            echo "$output"
            echo "::endgroup::"
          }

          # If specific package requested, update only that
          if [ -n "$UPDATE_PACKAGE" ]; then
            if [[ ! "$UPDATE_PACKAGE" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Invalid package name: $UPDATE_PACKAGE"
              exit 1
            fi

            script="pkgs/$UPDATE_PACKAGE/update.sh"
            if [ ! -x "$script" ]; then
              echo "::error::No executable update script found at $script"
              exit 1
            fi

            run_update "$script"
          else
            # Update all packages
            for script in pkgs/*/update.sh; do
              run_update "$script"
            done
          fi

          # Write summary to the job step summary and the full PR body to a
          # file. Using body-path (not a workflow output) avoids heredoc
          # breakage when a log line is literally "EOF" and YAML/markdown
          # mangling of very long lines.
          BUILD_LOG_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "$summary"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "This PR was automatically created by the update workflow."
            echo ""
            echo "See the [Build Log](${BUILD_LOG_URL}) for details."
            echo ""
            echo "<details><summary>Package Update Status</summary>"
            echo ""
            echo "$summary"
            echo ""
            echo "</details>"
          } > /tmp/pr-body.md

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Some packages failed to update"
            exit 1
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_FOR_UPDATES || secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-update packages"
          title: "chore: Auto-update packages"
          body-path: /tmp/pr-body.md
          branch: auto-update-packages
          delete-branch: true

      - name: Enable auto-merge
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_UPDATES || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr view --json number --jq .number)
          if [ -n "${PR_NUMBER}" ]; then
            gh pr merge "$PR_NUMBER" --squash --auto --delete-branch
          fi

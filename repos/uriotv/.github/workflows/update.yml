name: "Update packages"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 2 * * *'
      timezone: 'Europe/Warsaw'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to update (leave empty for all)'
        required: false
        default: ''

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    runs-on: [self-hosted, nixos, cachix-builder]
    # create-pull-request parses Git's English stash output.
    env:
      LC_ALL: C
    timeout-minutes: 120
    steps:
      - name: Require update PR token
        env:
          PAT_FOR_UPDATES: ${{ secrets.PAT_FOR_UPDATES }}
        run: |
          if [ -z "$PAT_FOR_UPDATES" ]; then
            echo '::error::PAT_FOR_UPDATES is required; GITHUB_TOKEN cannot trigger PR CI.'
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-runner-tools
      - name: Update packages
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_PACKAGE: ${{ inputs.package }}
          BUILD_LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/update-packages.sh
      - name: Roll back package updates that do not build
        id: revert
        # A broken update must not hold back the rest of the PR (and the cache
        # publication that follows the merge). It is reverted here, before the
        # README/PR steps, and retried by the next run.
        env:
          BUILD_LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UPDATE_BUILD_TIMEOUT_SECONDS: ${{ vars.UPDATE_BUILD_TIMEOUT_SECONDS }}
        run: bash scripts/revert-broken-updates.sh
      - name: Open one pull request per updated package
        id: pull-requests
        # One PR per package: build.yml builds it, test-gate gates its merge, and a
        # package whose update fails never holds back the others (or the cache).
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_UPDATES }}
          BUILD_LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/open-update-prs.sh
      - name: Fail when any package updater failed
        if: always() && steps.update.outputs.update_failures != '' && steps.update.outputs.update_failures != '0'
        env:
          UPDATE_FAILURES: ${{ steps.update.outputs.update_failures }}
          SUCCESSFUL_UPDATES: ${{ steps.update.outputs.successful_updates }}
          FAILED_PACKAGES: ${{ steps.update.outputs.failed_packages }}
        run: |
          echo "::error::$UPDATE_FAILURES package updater(s) failed (${FAILED_PACKAGES:-unknown}); successful updates: ${SUCCESSFUL_UPDATES:-unknown}."
          exit 1

name: Set up Nix with nixbuild.net
description: >-
  Install Nix and send every Nix build to nixbuild.net (local builds disabled).
  uriotv.cachix.org is configured read-only; publication is always an explicit
  workflow step.

inputs:
  nixbuild_token:
    description: nixbuild.net token (build:read, build:write, store:read, store:write).
    required: true
  nixbuild_settings:
    description: Optional nixbuild.net settings, one `name = value` per line.
    required: false
    default: ''
  extra_nix_config:
    description: Additional nix.conf lines.
    required: false
    default: ''
  nix_path:
    description: Optional NIX_PATH for legacy nix-build/nix-env commands.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Require nixbuild.net token
      shell: bash
      env:
        NIXBUILD_TOKEN: ${{ inputs.nixbuild_token }}
      run: |
        # No fallback: CI must never silently compile on the GitHub runner.
        if [ -z "$NIXBUILD_TOKEN" ]; then
          echo '::error::Missing NIXBUILD_TOKEN secret. All Nix builds run on nixbuild.net; add it under Settings → Secrets and variables → Actions (and Dependabot, for Dependabot PRs).'
          exit 1
        fi
    # Single-user Nix on purpose: with a multi-user nix-daemon (e.g.
    # cachix/install-nix-action), builds are dispatched by root, which does not
    # see nixbuild-action's NIX_SSHOPTS, and fail with
    # "failed to start SSH connection to 'nixbuild'".
    - uses: nixbuild/nix-quick-install-action@v35
      with:
        nix_conf: |
          experimental-features = nix-command flakes
          ${{ inputs.extra_nix_config }}
    - name: Set NIX_PATH
      if: inputs.nix_path != ''
      shell: bash
      env:
        INPUT_NIX_PATH: ${{ inputs.nix_path }}
      run: echo "NIX_PATH=$INPUT_NIX_PATH" >> "$GITHUB_ENV"
    - uses: cachix/cachix-action@v17
      with:
        name: uriotv
        # Read-only here. Workflows push explicitly, only from main.
        skipPush: true
    # Must come after the steps above: it extends NIX_CONFIG with max-jobs = 0,
    # the nixbuild.net builders and its substituter.
    - uses: nixbuild/nixbuild-action@v27
      with:
        nixbuild_token: ${{ inputs.nixbuild_token }}
        settings: ${{ inputs.nixbuild_settings }}
        generate_summary_for: job
    - name: Verify that no build can run on the runner
      shell: bash
      run: |
        set -euo pipefail
        max_jobs="$(nix config show max-jobs)"
        builders="$(nix config show builders)"
        echo "max-jobs = $max_jobs; builders = $builders"
        [ "$max_jobs" = 0 ] || { echo '::error::Local Nix builds are still enabled'; exit 1; }
        [ -n "$builders" ] || { echo '::error::nixbuild.net builder is not configured'; exit 1; }
        [ ! -S /nix/var/nix/daemon-socket/socket ] || {
          echo '::error::A nix-daemon is running; it cannot reach nixbuild.net'; exit 1; }

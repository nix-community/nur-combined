# SecretSpec contract for Immich's Postgres password.
#
# Pass holds the generated password (provider default; untouched). k8s gets
# the exact `DB_PASSWORD` entry in the `immich-db` Secret via per-provider
# `refs.kube` — NOT route-wide `ref`.
#
# CONSTRAINT (upstream v3.3.6 docker example.env): DB_PASSWORD must be
# A-Za-z0-9 only — no special characters or spaces.
#
# HARD REQUIREMENT (learned 2026-10-26, verified against 0.21.1): always
# address providers BY ALIAS (`-p kube`, `-p pass`). A literal URI
# (`-p k8s+secret://...`) has no alias identity, so `refs` is silently
# skipped and writes fall back to namespaced
# `secretspec--{project}--{profile}--{key}` entries, which kubelet drops
# as invalid env names. There is no error — verify with:
#   kubectl get secret immich-db -o jsonpath='{.data}'
# and expect exactly the `DB_PASSWORD` key, nothing namespaced.
[project]
name = "immich"
revision = "1.0"

[providers]
pass = "protonpass://secretspec"
kube = "k8s+secret://immich-db"

[profiles.default]
DB_PASSWORD = { description = "Postgres password for k8s Immich (role immich, db immich). A-Za-z0-9 only, 32 chars.", providers = ["pass", "kube"], refs = { kube = { item = "DB_PASSWORD" } } }

# SecretSpec contract for homepage widget secrets.
#
# Keys are the full HOMEPAGE_VAR_* names the app reads (same as the native
# env file). Values live in Proton Pass under BARE names; the populate loop
# prefixes them explicitly — no hidden mapping. providers order: pass, kube.
[project]
name = "homepage"
revision = "1.0"

[providers]
pass = "protonpass://secretspec"
kube = "k8s+secret://homepage-widgets"

[profiles.default]
HOMEPAGE_VAR_HOMEASSISTANT_API_KEY = { description = "Home Assistant long-lived access token for the homepage widget", providers = ["pass", "kube"] }
HOMEPAGE_VAR_IMMICH_API_KEY = { description = "Immich photos API key for the homepage widget", providers = ["pass", "kube"] }
HOMEPAGE_VAR_JELLYFIN_API_KEY = { description = "Jellyfin media server API key for the homepage widget", providers = ["pass", "kube"] }
HOMEPAGE_VAR_LIDARR_API_KEY = { description = "Lidarr music manager API key for the homepage widget", providers = ["pass", "kube"] }
HOMEPAGE_VAR_BAZARR_API_KEY = { description = "Bazarr subtitle manager API key for the homepage widget", providers = ["pass", "kube"] }
HOMEPAGE_VAR_PROWLARR_API_KEY = { description = "Prowlarr indexer manager API key for the homepage widget", providers = ["pass", "kube"] }
HOMEPAGE_VAR_SONARR_API_KEY = { description = "Sonarr TV manager API key for the homepage widget", providers = ["pass", "kube"] }
HOMEPAGE_VAR_RADARR_API_KEY = { description = "Radarr movie manager API key for the homepage widget", providers = ["pass", "kube"] }
HOMEPAGE_VAR_READARR_API_KEY = { description = "Readarr book manager API key for the homepage widget", providers = ["pass", "kube"] }
HOMEPAGE_VAR_QBITTORRENT_USERNAME = { description = "qBittorrent Web UI username for the homepage widget", providers = ["pass", "kube"] }
HOMEPAGE_VAR_QBITTORRENT_PASSWORD = { description = "qBittorrent Web UI password for the homepage widget", providers = ["pass", "kube"] }
HOMEPAGE_VAR_NEXTCLOUD_USERNAME = { description = "Nextcloud admin username for container setup and homepage widget", providers = ["pass", "kube"] }

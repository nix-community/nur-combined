# SecretSpec contract for homepage widget secrets.
#
# Values live in Proton Pass (vault `secretspec`, note items titled
# `homepage/default/<KEY>`); this file holds names + descriptions only.
# The k8s provider writes plain entries into Secret `homepage-widgets`
# (default namespace), which the Deployment consumes via envFrom.
# Pattern for future services: project = service name, profile = default.
[project]
name = "homepage"
revision = "1.0"

[providers]
pass = "protonpass://secretspec"
kube = "k8s+secret://homepage-widgets"

[profiles.default]
HOMEASSISTANT_API_KEY = { description = "Home Assistant long-lived access token for the homepage widget", providers = ["pass", "kube"], ref = { item = "HOMEASSISTANT_API_KEY" } }
IMMICH_API_KEY = { description = "Immich photos API key for the homepage widget", providers = ["pass", "kube"], ref = { item = "IMMICH_API_KEY" } }
JELLYFIN_API_KEY = { description = "Jellyfin media server API key for the homepage widget", providers = ["pass", "kube"], ref = { item = "JELLYFIN_API_KEY" } }
LIDARR_API_KEY = { description = "Lidarr music manager API key for the homepage widget", providers = ["pass", "kube"], ref = { item = "LIDARR_API_KEY" } }
BAZARR_API_KEY = { description = "Bazarr subtitle manager API key for the homepage widget", providers = ["pass", "kube"], ref = { item = "BAZARR_API_KEY" } }
PROWLARR_API_KEY = { description = "Prowlarr indexer manager API key for the homepage widget", providers = ["pass", "kube"], ref = { item = "PROWLARR_API_KEY" } }
SONARR_API_KEY = { description = "Sonarr TV manager API key for the homepage widget", providers = ["pass", "kube"], ref = { item = "SONARR_API_KEY" } }
RADARR_API_KEY = { description = "Radarr movie manager API key for the homepage widget", providers = ["pass", "kube"], ref = { item = "RADARR_API_KEY" } }
READARR_API_KEY = { description = "Readarr book manager API key for the homepage widget", providers = ["pass", "kube"], ref = { item = "READARR_API_KEY" } }
QBITTORRENT_USERNAME = { description = "qBittorrent Web UI username for the homepage widget", providers = ["pass", "kube"], ref = { item = "QBITTORRENT_USERNAME" } }
QBITTORRENT_PASSWORD = { description = "qBittorrent Web UI password for the homepage widget", providers = ["pass", "kube"], ref = { item = "QBITTORRENT_PASSWORD" } }
NEXTCLOUD_USERNAME = { description = "Nextcloud admin username for container setup and homepage widget", providers = ["pass", "kube"], ref = { item = "NEXTCLOUD_USERNAME" } }
NEXTCLOUD_PASSWORD = { description = "Nextcloud admin password for the homepage widget (same credential as NEXTCLOUD_ADMIN_PASSWORD)", providers = ["pass", "kube"], ref = { item = "NEXTCLOUD_PASSWORD" } }
OMADA_USERNAME = { description = "TP-Link Omada controller username for the homepage widget", providers = ["pass", "kube"], ref = { item = "OMADA_USERNAME" } }
OMADA_PASSWORD = { description = "TP-Link Omada controller password for the homepage widget", providers = ["pass", "kube"], ref = { item = "OMADA_PASSWORD" } }
TECHNITIUM_USERNAME = { description = "Technitium DNS admin username for the homepage widget", providers = ["pass", "kube"], ref = { item = "TECHNITIUM_USERNAME" } }
TECHNITIUM_PASSWORD = { description = "Technitium DNS admin password for the homepage widget (same credential as TECHNITIUM_ADMIN_PASSWORD)", providers = ["pass", "kube"], ref = { item = "TECHNITIUM_PASSWORD" } }

# SecretSpec contract for homepage widget secrets.
#
# Pass holds namespaced notes `homepage/default/<KEY>` (provider default;
# untouched). k8s gets exact HOMEPAGE_VAR_* entries via per-provider
# `refs.kube` — NOT route-wide `ref`, which would also redirect Pass reads.
#
# HARD REQUIREMENT (learned 2026-10-26, verified against 0.21.1): always
# address providers BY ALIAS (`-p kube`, `-p pass`). A literal URI
# (`-p k8s+secret://...`) has no alias identity, so `refs` is silently
# skipped and writes fall back to namespaced
# `secretspec--{project}--{profile}--{key}` entries, which kubelet drops
# as invalid env names. There is no error — verify with:
#   kubectl get secret homepage-widgets -o jsonpath='{.data}'
# and expect exactly the HOMEPAGE_VAR_* keys, nothing namespaced.
[project]
name = "homepage"
revision = "1.0"

[providers]
pass = "protonpass://secretspec"
kube = "k8s+secret://homepage-widgets"

[profiles.default]
HOMEPAGE_VAR_HOMEASSISTANT_API_KEY = { description = "Home Assistant long-lived access token for the homepage widget", providers = ["pass", "kube"], refs = { kube = { item = "HOMEPAGE_VAR_HOMEASSISTANT_API_KEY" } } }
HOMEPAGE_VAR_IMMICH_API_KEY = { description = "Immich photos API key for the homepage widget", providers = ["pass", "kube"], refs = { kube = { item = "HOMEPAGE_VAR_IMMICH_API_KEY" } } }
HOMEPAGE_VAR_JELLYFIN_API_KEY = { description = "Jellyfin media server API key for the homepage widget", providers = ["pass", "kube"], refs = { kube = { item = "HOMEPAGE_VAR_JELLYFIN_API_KEY" } } }
HOMEPAGE_VAR_LIDARR_API_KEY = { description = "Lidarr music manager API key for the homepage widget", providers = ["pass", "kube"], refs = { kube = { item = "HOMEPAGE_VAR_LIDARR_API_KEY" } } }
HOMEPAGE_VAR_BAZARR_API_KEY = { description = "Bazarr subtitle manager API key for the homepage widget", providers = ["pass", "kube"], refs = { kube = { item = "HOMEPAGE_VAR_BAZARR_API_KEY" } } }
HOMEPAGE_VAR_PROWLARR_API_KEY = { description = "Prowlarr indexer manager API key for the homepage widget", providers = ["pass", "kube"], refs = { kube = { item = "HOMEPAGE_VAR_PROWLARR_API_KEY" } } }

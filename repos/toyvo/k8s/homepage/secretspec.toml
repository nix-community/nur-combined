HOMEPAGE_VAR_SONARR_API_KEY = { description = "Sonarr TV manager API key for the homepage widget", providers = ["pass", "kube"], refs = { kube = { item = "HOMEPAGE_VAR_SONARR_API_KEY" } } }
HOMEPAGE_VAR_RADARR_API_KEY = { description = "Radarr movie manager API key for the homepage widget", providers = ["pass", "kube"], refs = { kube = { item = "HOMEPAGE_VAR_RADARR_API_KEY" } } }

# SecretSpec contract for homepage widget secrets (Pass side).
#
# Keys are BARE names matching Proton Pass items. The k8s provider
# namespaces toml-declared keys (secretspec--homepage--default--*),
# which are invalid env names that kubelet silently drops — so k8s
# writes use ad-hoc FULL names instead (see runbook). Do NOT add
# `providers: [kube]` or `ref` here: either re-triggers namespacing.
# The full HOMEPAGE_VAR_* names live in the populate loop only.
[project]
name = "homepage"
revision = "1.0"

[providers]
pass = "protonpass://secretspec"

[profiles.default]
HOMEASSISTANT_API_KEY = { description = "Home Assistant long-lived access token for the homepage widget", providers = ["pass"] }
IMMICH_API_KEY = { description = "Immich photos API key for the homepage widget", providers = ["pass"] }
JELLYFIN_API_KEY = { description = "Jellyfin media server API key for the homepage widget", providers = ["pass"] }
LIDARR_API_KEY = { description = "Lidarr music manager API key for the homepage widget", providers = ["pass"] }
BAZARR_API_KEY = { description = "Bazarr subtitle manager API key for the homepage widget", providers = ["pass"] }
PROWLARR_API_KEY = { description = "Prowlarr indexer manager API key for the homepage widget", providers = ["pass"] }
SONARR_API_KEY = { description = "Sonarr TV manager API key for the homepage widget", providers = ["pass"] }
RADARR_API_KEY = { description = "Radarr movie manager API key for the homepage widget", providers = ["pass"] }
READARR_API_KEY = { description = "Readarr book manager API key for the homepage widget", providers = ["pass"] }
QBITTORRENT_USERNAME = { description = "qBittorrent Web UI username for the homepage widget", providers = ["pass"] }
QBITTORRENT_PASSWORD = { description = "qBittorrent Web UI password for the homepage widget", providers = ["pass"] }
NEXTCLOUD_USERNAME = { description = "Nextcloud admin username for container setup and homepage widget", providers = ["pass"] }
NEXTCLOUD_PASSWORD = { description = "Nextcloud admin password for the homepage widget (same credential as NEXTCLOUD_ADMIN_PASSWORD)", providers = ["pass"] }
OMADA_USERNAME = { description = "TP-Link Omada controller username for the homepage widget", providers = ["pass"] }
OMADA_PASSWORD = { description = "TP-Link Omada controller password for the homepage widget", providers = ["pass"] }
TECHNITIUM_USERNAME = { description = "Technitium DNS admin username for the homepage widget", providers = ["pass"] }
TECHNITIUM_PASSWORD = { description = "Technitium DNS admin password for the homepage widget (same credential as TECHNITIUM_ADMIN_PASSWORD)", providers = ["pass"] }

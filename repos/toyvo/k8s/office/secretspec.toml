# SecretSpec contract for the Euro-Office Document Server JWT secret.
#
# Shared secret between DocumentServer (JWT_SECRET env) and the Nextcloud
# connector app (occ config:app:set eurooffice jwt_secret). A-Za-z0-9 only.
#
# CRITICAL: always supply this explicitly. If the server auto-generates its
# secrets (default when JWT_SECRET is absent), a pod recreate desyncs the
# pairing and every save breaks with no error until the first failed save.
#
# Reconciled from Mac/kubectl-direct (pass-cli is broken on headless hosts).
# The kube provider patches existing Secrets, never creates them:
#   kubectl create secret generic euro-office-jwt --from-literal=JWT_SECRET=<value>
# Verify with:
#   kubectl get secret euro-office-jwt -o jsonpath='{.data}'
# and expect exactly the `JWT_SECRET` key, nothing namespaced.
#
# HARD REQUIREMENT (learned 2026-10-26, verified against 0.21.1): always
# address providers BY ALIAS (`-p kube`, `-p pass`). A literal URI
# (`-p k8s+secret://...`) has no alias identity, so `refs` is silently
# skipped and writes fall back to namespaced
# `secretspec--{project}--{profile}--{key}` entries, which kubelet drops
# as invalid env names.
[project]
name = "euro-office"
revision = "1.0"

[providers]
pass = "protonpass://secretspec"
kube = "k8s+secret://euro-office-jwt"

[profiles.default]
JWT_SECRET = { description = "Shared JWT secret: Euro-Office Document Server <-> Nextcloud connector. A-Za-z0-9 only, 32+ chars.", providers = ["pass", "kube"], refs = { kube = { item = "JWT_SECRET" } } }

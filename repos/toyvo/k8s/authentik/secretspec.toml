# Secretspec contract for the k3s authentik stack.
#
# ALL values MUST carry over byte-identical from the live container
# (rotating any of these logs out the world or breaks enrollment):
#   sudo cat /run/secrets/authentik-secret-key         (sessions + tokens)
#   sudo cat /run/secrets/authentik-db-password        (host PG role)
#   sudo cat /run/secrets/authentik-bootstrap-password (post-bootstrap unused)
#   sudo cat /run/secrets/authentik-ldap-token         (outpost enrollment)
#
# The kube provider patches existing Secrets, never creates them.
# kubectl-direct (pass-cli is headless-broken — office precedent):
#   kubectl create secret generic authentik-secrets \
#     --from-literal=secret-key=<value> \
#     --from-literal=db-password=<value> \
#     --from-literal=ldap-token=<value> \
#     --from-literal=bootstrap-password=<value>
# Verify with:
#   kubectl get secret authentik-secrets -o jsonpath='{.data}'
# and expect exactly the four keys above, nothing namespaced.
#
# HARD REQUIREMENT (learned 2026-10-26, verified against 0.21.1): always
# address providers BY ALIAS (`-p kube`, `-p pass`). A literal URI
# (`-p k8s+secret://...`) has no alias identity, so `refs` is silently
# skipped and writes fall back to namespaced
# `secretspec--{project}--{profile}--{key}` entries, which kubelet drops
# as invalid env names.
[project]
name = "authentik"
revision = "1.0"

[providers]
pass = "protonpass://secretspec"
kube = "k8s+secret://authentik-secrets"

[profiles.default]
secret-key = { description = "Authentik SECRET_KEY (carry byte-identical from /run/secrets/authentik-secret-key).", providers = ["pass", "kube"], refs = { kube = { item = "secret-key" } } }
db-password = { description = "Host Postgres authentik role password (carry from /run/secrets/authentik-db-password).", providers = ["pass", "kube"], refs = { kube = { item = "db-password" } } }
ldap-token = { description = "LDAP outpost token (carry from /run/secrets/authentik-ldap-token — no re-enrollment).", providers = ["pass", "kube"], refs = { kube = { item = "ldap-token" } } }
bootstrap-password = { description = "Bootstrap admin password (post-bootstrap unused; carried for rebuild completeness).", providers = ["pass", "kube"], refs = { kube = { item = "bootstrap-password" } } }

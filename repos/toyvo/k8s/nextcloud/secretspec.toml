# SecretSpec contract for Nextcloud's Postgres password.
#
# The NixOS module used peer auth (no password); k8s needs one, so this is
# a NEW generated value (provider default; untouched). k8s gets the exact
# `DB_PASSWORD` entry in the `nextcloud-db` Secret via per-provider
# `refs.kube` — NOT route-wide `ref`.
#
# CONSTRAINT (Nextcloud + postgres images): DB_PASSWORD must be
# A-Za-z0-9 only — no special characters or spaces.
#
# Reconcile from the Mac (pass-cli is broken on headless hosts): load the
# value into Proton Pass there, or `kubectl create secret generic
# nextcloud-db --from-literal=DB_PASSWORD=...` directly (the kube provider
# patches existing Secrets, never creates them).
#
# HARD REQUIREMENT (learned 2026-10-26, verified against 0.21.1): always
# address providers BY ALIAS (`-p kube`, `-p pass`). A literal URI
# (`-p k8s+secret://...`) has no alias identity, so `refs` is silently
# skipped and writes fall back to namespaced
# `secretspec--{project}--{profile}--{key}` entries, which kubelet drops
# as invalid env names. There is no error — verify with:
#   kubectl get secret nextcloud-db -o jsonpath='{.data}'
# and expect exactly the `DB_PASSWORD` key, nothing namespaced.
[project]
name = "nextcloud"
revision = "1.0"

[providers]
pass = "protonpass://secretspec"
kube = "k8s+secret://nextcloud-db"

[profiles.default]
DB_PASSWORD = { description = "Postgres password for k8s Nextcloud (role nextcloud, db nextcloud). A-Za-z0-9 only, 32 chars.", providers = ["pass", "kube"], refs = { kube = { item = "DB_PASSWORD" } } }

# Secretspec contract for the k3s NetBird control plane.
#
# Values:
# - relay-auth-secret: GENERATE fresh (openssl rand -hex 32) — shared
#   management<->relay, never leaves the cluster.
# - datastore-enc-key: GENERATE fresh (openssl rand -hex 32) — sqlite
#   encryption at rest.
# - auth-client-id / auth-client-secret / auth-audience: from the
#   Authentik OIDC provider+application for NetBird (user creates at
#   Task 3; application slug `netbird`, redirect
#   `https://netbird.diekvoss.net/` + `/silent-callback`).
#
# The kube provider patches existing Secrets, never creates them.
# kubectl-direct (pass-cli is headless-broken — office precedent):
#   kubectl create secret generic netbird-secrets \
#     --from-literal=relay-auth-secret=<gen> \
#     --from-literal=datastore-enc-key=<gen> \
#     --from-literal=auth-client-id=<from-authentik> \
#     --from-literal=auth-client-secret=<from-authentik> \
#     --from-literal=auth-audience=<from-authentik>
# Verify with:
#   kubectl get secret netbird-secrets -o jsonpath='{.data}'
# and expect exactly the five keys above, nothing namespaced.
#
# HARD REQUIREMENT (learned 2026-10-26, verified against 0.21.1): always
# address providers BY ALIAS (`-p kube`, `-p pass`). A literal URI
# (`-p k8s+secret://...`) has no alias identity, so `refs` is silently
# skipped and writes fall back to namespaced
# `secretspec--{project}--{profile}--{key}` entries, which kubelet drops
# as invalid env names.
[project]
name = "netbird"
revision = "1.0"

[providers]
pass = "protonpass://secretspec"
kube = "k8s+secret://netbird-secrets"

[profiles.default]
relay-auth-secret = { description = "Fresh-generated relay auth (openssl rand -hex 32).", providers = ["pass", "kube"], refs = { kube = { item = "relay-auth-secret" } } }
datastore-enc-key = { description = "Fresh-generated sqlite enc key (openssl rand -hex 32).", providers = ["pass", "kube"], refs = { kube = { item = "datastore-enc-key" } } }
auth-client-id = { description = "Authentik OIDC client ID for NetBird.", providers = ["pass", "kube"], refs = { kube = { item = "auth-client-id" } } }
auth-client-secret = { description = "Authentik OIDC client secret for NetBird.", providers = ["pass", "kube"], refs = { kube = { item = "auth-client-secret" } } }
auth-audience = { description = "Authentik OIDC audience for NetBird.", providers = ["pass", "kube"], refs = { kube = { item = "auth-audience" } } }

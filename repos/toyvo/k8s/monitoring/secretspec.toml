# SecretSpec contract for the k3s monitoring stack (Grafana only — the
# backends need no secrets).
#
# Values MUST carry over from the live container (zero behavior change):
# read them on the nas from the sops-decrypted host paths:
#   sudo cat /run/secrets/grafana-admin-password
#   sudo cat /run/secrets/grafana-secret-key
# (rotating them instead is safe but forces every Grafana session to
# re-login — carry-over avoids the churn.)
#
# The kube provider patches existing Secrets, never creates them.
# kubectl-direct (pass-cli is broken on headless hosts — office precedent):
#   kubectl create secret generic monitoring-grafana \
#     --from-literal=admin-password=<value> \
#     --from-literal=secret-key=<value>
# Verify with:
#   kubectl get secret monitoring-grafana -o jsonpath='{.data}'
# and expect exactly the `admin-password` + `secret-key` keys.
#
# HARD REQUIREMENT (learned 2026-10-26, verified against 0.21.1): always
# address providers BY ALIAS (`-p kube`, `-p pass`). A literal URI
# (`-p k8s+secret://...`) has no alias identity, so `refs` is silently
# skipped and writes fall back to namespaced
# `secretspec--{project}--{profile}--{key}` entries, which kubelet drops
# as invalid env names.
[project]
name = "monitoring"
revision = "1.0"

[providers]
pass = "protonpass://secretspec"
kube = "k8s+secret://monitoring-grafana"

[profiles.default]
admin-password = { description = "Grafana admin password (carry over from /run/secrets/grafana-admin-password on nas).", providers = ["pass", "kube"], refs = { kube = { item = "admin-password" } } }
secret-key = { description = "Grafana secret_key (carry over from /run/secrets/grafana-secret-key on nas).", providers = ["pass", "kube"], refs = { kube = { item = "secret-key" } } }

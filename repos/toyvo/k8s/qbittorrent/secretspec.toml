# SecretSpec contract for qBittorrent's ProtonVPN client config.
#
# Pass holds the full `wg0.conf` (provider default; untouched). k8s gets
# the exact `wg0.conf` file in the `qbittorrent-vpn` Secret via
# per-provider `refs.kube` — NOT route-wide `ref`.
#
# HARD REQUIREMENT (learned 2026-10-26, verified against 0.21.1): always
# address providers BY ALIAS (`-p kube`, `-p pass`). A literal URI
# (`-p k8s+secret://...`) has no alias identity, so `refs` is silently
# skipped and writes fall back to namespaced
# `secretspec--{project}--{profile}--{key}` entries, which kubelet drops
# as invalid env names. There is no error — verify with:
#   kubectl get secret qbittorrent-vpn -o jsonpath='{.data}'
# and expect exactly the `wg0.conf` key, nothing namespaced.
[project]
name = "qbittorrent"
revision = "1.0"

[providers]
pass = "protonpass://secretspec"
kube = "k8s+secret://qbittorrent-vpn"

[profiles.default]
WG_CONFIG = { description = "Full ProtonVPN wg0.conf for the k8s qBittorrent pod (Interface PrivateKey/Address 10.2.0.2/32/DNS 10.2.0.1 + Peer PublicKey/AllowedIPs 0.0.0.0/0/Endpoint 79.127.187.156:51820)", providers = ["pass", "kube"], refs = { kube = { item = "wg0.conf" } } }

name: "Build and populate cache"
# Forgejo-native CI (replaces the old GitHub Actions workflow).
# Runs on the nas runner (host executor), so nix is already installed and
# builds share the system store.
#
# update: on main, refresh flake.lock + formatting into the update-flake-lock
#         branch and open/reuse its PR (Forgejo API + the job's GITHUB_TOKEN)
# build:  validate that branch (or the triggering ref) and populate the cache
# merge:  squash-merge the update PR once build is green
on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    # rebuild everyday at 8:26
    - cron: "26 8 * * *"
  workflow_dispatch:
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  update:
    runs-on: native
    outputs:
      branch: ${{ steps.update.outputs.branch }}
      pr_number: ${{ steps.update.outputs.pr_number }}
    steps:
      - name: Checkout repository
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
      - name: Update flake.lock and format code
        if: github.ref == 'refs/heads/main'
        id: update
        run: |
          set -euo pipefail
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@users.noreply.git.toyvo.dev"
          BRANCH="update-flake-lock"

          nix flake update
          nix fmt

          if git diff --quiet; then
            echo "flake.lock and formatting already up to date"
            exit 0
          fi

          git checkout -B "$BRANCH"
          if ! git diff --quiet -- flake.lock; then
            git add flake.lock
            git commit -m "chore: update flake.lock"
          fi
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "style: auto-format"
          fi
          git push --force origin "$BRANCH"

          # Reuse the open PR for this branch if there is one
          PR_NUMBER=$(curl -sf -H "Authorization: token $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls?state=open&limit=50" \
            | jq -r --arg b "$BRANCH" '[.[] | select(.head.ref == $b)][0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            TITLE="style: auto-format"
            if git log --format='%s' "origin/main..$BRANCH" | grep -q flake.lock; then
              TITLE="chore: update flake.lock"
            fi
            PR_NUMBER=$(jq -n \
              --arg title "$TITLE" \
              --arg head "$BRANCH" \
              --arg base "main" \
              --arg body "Automated flake.lock update and formatting fixes." \
              '{title: $title, head: $head, base: $base, body: $body}' \
              | curl -sf -X POST \
                -H "Authorization: token $GH_TOKEN" \
                -H "Content-Type: application/json" \
                -d @- \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls" \
              | jq -r '.number')
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
  build:
    needs: update
    runs-on: native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Build the bot branch when the update job produced one,
          # otherwise the ref that triggered the workflow.
          ref: ${{ needs.update.outputs.branch }}
      - name: Show nixpkgs version
        run: nix-instantiate --eval -E '(builtins.getFlake (builtins.toString ./.)).inputs.nixos-unstable.lib.version'
      - name: Show evaluation
        run: nix flake show
      - name: Check evaluation
        run: nix flake check -j 1
      - name: Build nix packages
        run: nix build -j 1 -L ".#checks.$(nix eval --raw --impure --expr builtins.currentSystem).all"
  merge:
    needs:
      - update
      - build
    if: needs.update.outputs.pr_number != ''
    runs-on: native
    steps:
      - name: Merge update PR
        run: |
          set -uo pipefail
          PR_NUMBER="${{ needs.update.outputs.pr_number }}"
          BRANCH="${{ needs.update.outputs.branch }}"

          # Check PR status first
          echo "Checking PR #$PR_NUMBER status..."
          PR_STATE=$(curl -sf -H "Authorization: token $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            | jq -r '.state // "unknown"')
          echo "PR #$PR_NUMBER state: $PR_STATE"

          if [ "$PR_STATE" != "open" ]; then
            echo "PR is not open (state: $PR_STATE), skipping merge"
            exit 0
          fi

          # Check if PR is mergeable
          PR_MERGEABLE=$(curl -sf -H "Authorization: token $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            | jq -r '.mergeable // "null"')
          echo "PR #$PR_NUMBER mergeable: $PR_MERGEABLE"

          if [ "$PR_MERGEABLE" != "true" ]; then
            echo "PR is not mergeable, skipping merge"
            exit 0
          fi

          echo "Attempting to merge PR #$PR_NUMBER..."
          # Forgejo uses PUT not POST for merge
          MERGE_RESPONSE=$(curl -s -w "%{http_code}" -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"Do": "squash"}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -o /tmp/merge_response.json)

          if [ "$MERGE_RESPONSE" = "200" ]; then
            echo "Successfully merged PR #$PR_NUMBER"
          elif [ "$MERGE_RESPONSE" = "201" ]; then
            echo "Successfully merged PR #$PR_NUMBER (created)"
          elif [ "$MERGE_RESPONSE" = "405" ]; then
            echo "PR #$PR_NUMBER already merged or merge not allowed (HTTP 405)"
          elif [ "$MERGE_RESPONSE" = "404" ]; then
            echo "PR #$PR_NUMBER not found (HTTP 404)"
          elif [ "$MERGE_RESPONSE" = "409" ]; then
            echo "PR #$PR_NUMBER has merge conflicts (HTTP 409)"
          else
            echo "Merge failed with HTTP $MERGE_RESPONSE"
            cat /tmp/merge_response.json 2>/dev/null || echo "No response body"
            echo "Continuing anyway..."
          fi

          echo "Attempting to delete branch $BRANCH..."
          DELETE_RESPONSE=$(curl -s -w "%{http_code}" -X DELETE \
            -H "Authorization: token $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/$BRANCH" \
            -o /tmp/delete_response.json)

          if [ "$DELETE_RESPONSE" = "204" ]; then
            echo "Successfully deleted branch $BRANCH"
          elif [ "$DELETE_RESPONSE" = "404" ]; then
            echo "Branch $BRANCH not found (HTTP 404) - may already be deleted"
          else
            echo "Delete failed with HTTP $DELETE_RESPONSE"
            cat /tmp/delete_response.json 2>/dev/null || echo "No response body"
            echo "Continuing..."
          fi
  nur:
    needs: build
    strategy:
      matrix:
        nixPath:
          - nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixpkgs-unstable.tar.gz
          - nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-unstable.tar.gz
          - nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-26.05.tar.gz
    runs-on: native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Show nixpkgs version
        run: NIX_PATH="${{ matrix.nixPath }}" nix-instantiate --eval -E '(import <nixpkgs> {}).lib.version'
      - name: Check evaluation (NUR-style)
        timeout-minutes: 1
        run: |
          nixpkgs_path=$(NIX_PATH="${{ matrix.nixPath }}" nix-instantiate --find-file nixpkgs)
          
          nix-env -f ./.forgejo/workflows/nur-eval.nix -qa \* --meta --json \
            --allowed-uris https://static.rust-lang.org \
            --option restrict-eval true \
            --option allow-import-from-derivation true \
            --show-trace \
            -I nixpkgs="$nixpkgs_path" \
            -I . \
            --arg pkgs 'import <nixpkgs> {}'
      - name: Check evaluation (flake)
        run: |
          NIX_PATH="${{ matrix.nixPath }}" nix-env -f . -qa \* --meta --xml \
            --allowed-uris https://static.rust-lang.org \
            --option restrict-eval true \
            --option allow-import-from-derivation true \
            --drv-path --show-trace \
            -I nixpkgs=$(NIX_PATH="${{ matrix.nixPath }}" nix-instantiate --find-file nixpkgs) \
            -I $PWD
      - name: Build nix packages
        run: NIX_PATH="${{ matrix.nixPath }}" nix shell -f '<nixpkgs>' nix-build-uncached -c nix-build-uncached ci.nix -A cacheOutputs
      - name: Trigger NUR update
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: curl -XPOST "https://nur-update.nix-community.org/update?repo=https://github.com/ToyVo/nixcfg"

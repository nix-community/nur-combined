name: "Build and populate cache"
on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    # rebuild everyday at 8:26
    # TIP: Choose a random time here so not all repositories are build at once:
    # https://www.random.org/clock-times/?num=1&earliest=01%3A00&latest=08%3A00&interval=5&format=html&rnd=new
    - cron: "26 8 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: write
jobs:
  Build:
    runs-on: ubuntu-latest
    outputs:
      on_pr_branch: ${{ steps.export-flag.outputs.on_pr_branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install nix
        uses: DeterminateSystems/determinate-nix-action@main
      - name: Update flake.lock
        if: github.ref == 'refs/heads/main'
        uses: DeterminateSystems/update-flake-lock@main
        id: update-flake-lock
        with:
          pr-title: "Update Nix flake inputs"
          pr-labels: |
            dependencies
            automated
      - name: Checkout PR branch
        if: github.ref == 'refs/heads/main' && steps.update-flake-lock.outputs.pull-request-number != ''
        run: |
          PR_BRANCH=$(gh pr view ${{ steps.update-flake-lock.outputs.pull-request-number }} --json headRefName --jq .headRefName)
          git fetch origin "$PR_BRANCH" main
          git checkout "$PR_BRANCH"
          git rebase origin/main
          git push --force-with-lease origin "$PR_BRANCH"
          echo "ON_PR_BRANCH=true" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Format code
        run: nix fmt
      - name: Commit formatting changes
        id: format
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            if [ -n "${{ steps.update-flake-lock.outputs.pull-request-number }}" ]; then
              git commit -m "style: auto-format"
              git pull --rebase
              git push
            else
              BRANCH="format-code-$(date +%Y%m%d%H%M%S)"
              git checkout -b "$BRANCH"
              git commit -m "style: auto-format"
              git push origin "$BRANCH"
              FORMAT_PR_NUMBER=$(gh pr create \
                --title "style: auto-format" \
                --body "Automated formatting fixes." \
                --base main | grep -oP '\d+$')
              echo "pr_number=$FORMAT_PR_NUMBER" >> "$GITHUB_OUTPUT"
              echo "ON_PR_BRANCH=true" >> "$GITHUB_ENV"
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Export PR branch flag
        id: export-flag
        run: echo "on_pr_branch=${ON_PR_BRANCH:-false}" >> "$GITHUB_OUTPUT"
      - name: Show nixpkgs version
        run: nix-instantiate --eval -E '(builtins.getFlake (builtins.toString ./.)).inputs.nixos-unstable.lib.version'
      - name: Check evaluation
        run: nix flake show
      - name: Build nix packages
        run: nix run nixpkgs#nix-fast-build -- --skip-cached --flake ".#checks.$(nix eval --raw --impure --expr builtins.currentSystem)" -j 1 --eval-workers 1 --no-nom --cachix-cache toyvo --option accept-flake-config true
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Report check to PR branch
        if: env.ON_PR_BRANCH == 'true'
        run: |
          gh api repos/${{ github.repository }}/check-runs \
            --method POST \
            -f name="Build" \
            -f head_sha="$(git rev-parse HEAD)" \
            -f status="completed" \
            -f conclusion="success" \
            -f "output[title]=Build" \
            -f "output[summary]=Build passed."
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Merge PR
        if: github.ref == 'refs/heads/main' && (steps.update-flake-lock.outputs.pull-request-number != '' || steps.format.outputs.pr_number != '')
        run: |
          PR_NUMBER="${{ steps.update-flake-lock.outputs.pull-request-number }}"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="${{ steps.format.outputs.pr_number }}"
          fi
          gh pr merge --auto --squash "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ github.token }}
  tests:
    needs: Build
    if: needs.Build.outputs.on_pr_branch != 'true'
    strategy:
      matrix:
        # Set this to notify the global nur package registry that changes are
        # available.
        #
        # The repo name as used in
        # https://github.com/nix-community/NUR/blob/master/repos.json
        nurRepo:
          - https://github.com/ToyVo/nixcfg
        # Set this to cache your build results in cachix for faster builds
        # in CI and for everyone who uses your cache.
        #
        # Format: Your cachix cache host name without the ".cachix.org" suffix.
        # Example: mycache (for mycache.cachix.org)
        #
        # For this to work, you also need to set the CACHIX_SIGNING_KEY or
        # CACHIX_AUTH_TOKEN secret in your repository secrets settings in
        # Github found at
        # https://github.com/<your_githubname>/nur-packages/settings/secrets
        cachixName:
          - toyvo
        nixPath:
          - nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixpkgs-unstable.tar.gz
          - nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-unstable.tar.gz
          - nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-26.05.tar.gz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: "${{ matrix.nixPath }}"
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Show nixpkgs version
        run: NIX_PATH="${{ matrix.nixPath }}" nix-instantiate --eval -E '(import <nixpkgs> {}).lib.version'
      - name: Setup cachix
        uses: cachix/cachix-action@v17
        # Don't replace <YOUR_CACHIX_NAME> here!
        if: ${{ matrix.cachixName != '<YOUR_CACHIX_NAME>' }}
        with:
          name: ${{ matrix.cachixName }}
          signingKey: "${{ secrets.CACHIX_SIGNING_KEY }}"
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Check evaluation
        run: |
          NIX_PATH="${{ matrix.nixPath }}" nix-env -f . -qa \* --meta --xml \
            --allowed-uris https://static.rust-lang.org \
            --option restrict-eval true \
            --option allow-import-from-derivation true \
            --drv-path --show-trace \
            -I nixpkgs=$(NIX_PATH="${{ matrix.nixPath }}" nix-instantiate --find-file nixpkgs) \
            -I $PWD
      - name: Build nix packages
        run: NIX_PATH="${{ matrix.nixPath }}" nix shell -f '<nixpkgs>' nix-build-uncached -c nix-build-uncached ci.nix -A cacheOutputs
      - name: Trigger NUR update
        # Don't replace <YOUR_REPO_NAME> here!
        if: ${{ matrix.nurRepo != '<YOUR_REPO_NAME>' }} && (${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }})
        run: curl -XPOST "https://nur-update.nix-community.org/update?repo=${{ matrix.nurRepo }}"

name: Update packages
on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Install nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixpkgs-unstable.tar.gz
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    - name: Run update scripts
      run: |
        for dir in pkgs/*/; do
          pkg=$(basename "$dir")
          if [ -x "$dir/update.sh" ]; then
            echo "::group::Checking $pkg"
            "$dir/update.sh" || echo "::warning::$pkg update script failed"
            echo "::endgroup::"
          fi
        done
    - name: Create PRs for updated packages
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if git diff --quiet; then
          echo "No updates found"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Snapshot every changed package, then stash so we branch off clean main.
        changed=()
        for dir in pkgs/*/; do
          git diff --quiet -- "$dir" || changed+=("$dir")
        done
        git stash push -m updater >/dev/null

        failures=0
        for dir in "${changed[@]}"; do
          pkg=$(basename "$dir")
          version=$(grep 'version = ' "$dir/default.nix" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          branch="update/${pkg}-${version}"
          echo "::group::PR for $pkg -> $version"
          # Isolate each package: one failing update must not abort the rest.
          if (
            set -e
            git checkout -B "$branch" main
            git checkout "stash@{0}" -- "$dir"
            git add "$dir"
            git commit -m "$pkg: update to ${version}"
            git push -f -u origin "$branch"
            if [ "$(gh pr list --head "$branch" --state open --json number --jq length)" = "0" ]; then
              gh pr create \
                --title "$pkg: update to ${version}" \
                --body "Automated update detected a new \`${pkg}\` release (\`${version}\`)." \
                --base main --head "$branch"
            fi
          ); then
            echo "opened/updated PR for $pkg"
          else
            echo "::warning::failed to open PR for $pkg ($version)"
            failures=$((failures + 1))
          fi
          git checkout -f main
          echo "::endgroup::"
        done

        if [ "$failures" -gt 0 ]; then
          echo "::warning::$failures package PR(s) failed; see logs above"
        fi

name: 'Auto update packages'
on:
  workflow_dispatch:
  schedule:
    - cron: '13 20 * * *'
permissions:
  actions: write
  contents: write
jobs:
  auto-update:
    runs-on: ubuntu-latest
    env:
      GIT_SSL_NO_VERIFY: 'true'
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 1024
          swap-size-mb: 4096
          build-mount-path: '/nix'
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: Create nix daemon tmpdir path
        run: |
          sudo mkdir -p /nix/tmpdir
          sudo chown "$(whoami)" /nix/tmpdir

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes ca-derivations
            extra-experimental-features = nix-command flakes ca-derivations
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-platforms = i686-linux aarch64-linux arm-linux
            build-dir = /nix/tmpdir
            log-lines = 25

      - name: Update sources
        run: |
          cat > secrets.toml <<EOF
          [keys]
          github = "${{ secrets.GITHUB_TOKEN }}"
          EOF
          # Always remove the token file, even if a step below fails (the
          # default shell runs with `set -e`, so a bare `rm` at the end would
          # be skipped and the token could leak into the auto-commit).
          trap 'rm -f secrets.toml' EXIT

          sudo mkdir -p /nix/tmpdir2
          sudo chown "$(whoami)" /nix/tmpdir2
          export TMPDIR=/nix/tmpdir2

          nix run .#update
          nix run .#update-hashes

      - name: Commit back to repository
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'auto: update packages'
          commit_user_name: 'zhyiheihei-bot'
          commit_user_email: 'zhyiheihei-bot@users.noreply.github.com'

      # Pushes made with the default GITHUB_TOKEN do not trigger other
      # workflows' `on: push`; explicitly dispatch the build so updated
      # sources are built and pushed to the Attic cache. workflow_dispatch
      # is the one event GITHUB_TOKEN is allowed to trigger.
      - name: Trigger build and cache workflow
        if: steps.commit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Build and populate cache" --ref main

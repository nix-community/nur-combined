name: 'Build and populate cache'
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
permissions:
  actions: write
  contents: write
jobs:
  test-nur-eval:
    runs-on: ubuntu-latest
    env:
      GIT_SSL_NO_VERIFY: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes ca-derivations
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-platforms = i686-linux aarch64-linux arm-linux
      - name: Build nix packages
        run: |
          nix run .#nur-check

  check-package-meta:
    runs-on: ubuntu-latest
    env:
      GIT_SSL_NO_VERIFY: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes ca-derivations
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-platforms = i686-linux aarch64-linux arm-linux
      - name: Check package meta
        run: |
          tools/check_package_meta.py

  update-nur:
    runs-on: ubuntu-latest
    needs:
      - test-nur-eval
      - check-package-meta
    steps:
      - name: Trigger NUR update
        run: curl -XPOST "https://nur-update.nix-community.org/update?repo=zhyiheihei"

  push-cache:
    runs-on: ubuntu-latest
    needs:
      - test-nur-eval
      - check-package-meta
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes ca-derivations
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-platforms = i686-linux aarch64-linux arm-linux
      - name: Build and push packages to Attic
        env:
          ATTIC_UPLOAD_KEY: ${{ secrets.ATTIC_UPLOAD_KEY }}
        run: |
          if [ -z "$ATTIC_UPLOAD_KEY" ]; then
            echo "ATTIC_UPLOAD_KEY is not configured; skipping cache push"
            exit 0
          fi

          : > /tmp/pkg-out-paths
          for system in x86_64-linux aarch64-linux; do
            nix eval --json ".#packages.$system" --apply builtins.attrNames \
              | jq -r '.[]' > "/tmp/pkg-names-$system"
            while read -r pkg; do
              if ! nix eval --raw ".#packages.$system.$pkg.drvPath" \
                >/dev/null 2>&1; then
                echo "skip $system/$pkg (not a derivation)"
                continue
              fi
              if nix build --no-link --print-out-paths \
                ".#packages.$system.$pkg" >> /tmp/pkg-out-paths 2>/tmp/build-err; then
                echo "ok $system/$pkg"
              else
                echo "FAIL $system/$pkg"
              fi
            done < "/tmp/pkg-names-$system"
          done

          printf '%s' "$ATTIC_UPLOAD_KEY" > /tmp/attic-key
          nix shell nixpkgs#attic-client -c attic login --set-default lantian \
            https://attic.zhyi.xin "$(cat /tmp/attic-key)"
          mapfile -t pkg_out_paths < /tmp/pkg-out-paths
          nix shell nixpkgs#attic-client -c attic push lantian "${pkg_out_paths[@]}"
          rm -f /tmp/attic-key

name: "Update packages"
on:
  schedule:
    # Run daily at 05:23 UTC
    - cron: '23 5 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixpkgs-unstable.tar.gz
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    # Each package is updated independently: `continue-on-error` keeps one
    # broken package from blocking the others, and the final step turns any
    # failure back into a red run so it doesn't go unnoticed.
    - name: Update blink
      id: blink
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd pkgs/blink
        ./update.sh

    - name: Update bluevein
      id: bluevein
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd pkgs/bluevein
        ./update.sh

    - name: Update aw-watcher-media-player
      id: aw_watcher_media_player
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd pkgs/aw-watcher-media-player
        ./update.sh

    - name: Update pelagica
      id: pelagica
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd pkgs/pelagica
        ./update.sh

    - name: Push changes
      run: |
        # An update script that failed partway can leave the tree dirty; it only
        # commits once it has a verified build, so drop anything uncommitted.
        git checkout -- .
        git push

    - name: Report update failures
      env:
        BLINK: ${{ steps.blink.outcome }}
        BLUEVEIN: ${{ steps.bluevein.outcome }}
        AW_WATCHER_MEDIA_PLAYER: ${{ steps.aw_watcher_media_player.outcome }}
        PELAGICA: ${{ steps.pelagica.outcome }}
      run: |
        failed=""
        for pkg in blink bluevein aw-watcher-media-player pelagica; do
          var=$(echo "$pkg" | tr 'a-z-' 'A-Z_')
          if [ "${!var}" = "failure" ]; then
            failed="$failed $pkg"
          fi
        done
        if [ -n "$failed" ]; then
          echo "::error::Update script failed for:$failed"
          exit 1
        fi
        echo "All update scripts succeeded."

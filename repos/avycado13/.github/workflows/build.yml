name: build and eval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
    env:
      EVAL_SYSTEM: ${{ matrix.system }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19
      # Evaluation can build dependencies via import-from-derivation (IFD).
      # Each runner must only force configurations for its native platform.
      - name: Evaluate native NixOS configurations
        if: runner.os == 'Linux'
        run: |
          nix eval \
            --accept-flake-config \
            --json \
            .#nixosConfigurations \
            --apply '
              hosts:
                builtins.mapAttrs
                  (_: host: host.config.system.build.toplevel.drvPath)
                  (builtins.listToAttrs (builtins.concatMap
                    (name:
                      let host = hosts.${name};
                      in if host.pkgs.stdenv.hostPlatform.system == "'"$EVAL_SYSTEM"'"
                      then [{ inherit name; value = host; }]
                      else [])
                    (builtins.attrNames hosts)))
            '

      - name: Evaluate Darwin configurations
        if: runner.os == 'macOS'
        run: |
          nix eval \
            --accept-flake-config \
            --json \
            .#darwinConfigurations \
            --apply '
              builtins.mapAttrs
                (_: host: host.system.drvPath)
            '

      - name: Check flake
        run: |
          nix flake check \
            --accept-flake-config \
            --no-build \
            --show-trace

  builds:
    runs-on: ${{ matrix.runner }}
    # needs: eval
    # timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: macos-latest
            system: aarch64-darwin
          - runner: ubuntu-24.04-arm
            system: aarch64-linux

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19
      - name: Add Magic nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: 100.72.166.0
      - uses: Mic92/niks3-action@v1
        with:
          server-url: https://cache.avyay.in
      - name: "Install omnix"
        run: |
           nix profile add nixpkgs#omnix
      - name: Run om ci
        run: |
            om ci run \
              --extra-access-tokens ${{ secrets.GITHUB_TOKEN }} -d \
              -- --accept-flake-config

name: Publish crate

# Publishes the `sasso` crate to crates.io on a version tag, alongside the
# cargo-dist binary release (release.yml). Uses crates.io Trusted Publishing
# (OIDC) — no CARGO_REGISTRY_TOKEN secret is stored.
#
# Three crates since #305: `sasso-core` (the compiler), `sasso-macros`
# (`include!`) and `sasso`, which re-exports both, all on one version. The
# publish step below uploads them in that order and skips any version
# crates.io already has (see the step for why). Trusted Publishing is set up
# per crate: `sasso-core` and `sasso-macros` each need the same publisher
# entry as `sasso`, which crates.io only offers once a crate exists — so their
# first version goes up by hand with a token, as `sasso` 0.1.0 did.
#
# One-time setup on crates.io (Settings -> Trusted Publishing for the `sasso`
# crate): add a GitHub publisher with repository `momiji-rs/sasso`, workflow
# `release-crate.yml`, and (recommended) environment `release`. The very first
# publish (0.1.0) was done with a token; every subsequent tagged version
# publishes through this workflow with a short-lived OIDC token.

on:
  push:
    tags:
      # Crate releases ride `v*` tags. The decoupled npm line uses `npm-v*`
      # (see release-wasm.yml) and deliberately does NOT match here.
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  # Manual fallback: re-publish from a branch when a tagged run failed AFTER the
  # binary release was already cut (e.g. a dirty-lockfile `cargo publish` error),
  # so we don't have to re-tag and re-run cargo-dist. Publishes whatever version
  # the checked-out ref's Cargo.toml declares.
  workflow_dispatch: {}

permissions: {}

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    # Optional hardening: create a `release` environment with required
    # reviewers / tag protection in the repo settings, then this gates on it.
    environment: release
    permissions:
      id-token: write # mint the crates.io OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: mint crates.io token (OIDC)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # One crate at a time, in dependency order, skipping a version crates.io
      # already has. A bare `cargo publish` of the workspace checks every
      # crate before uploading any and stops at the first that exists, so
      # neither a crate published by hand (the first `sasso-core` and
      # `sasso-macros`) nor a run that died after uploading `sasso-core` could
      # ever be finished by re-running. `cargo publish -p` waits until the
      # index serves the crate before returning, so the next one resolves it.
      - name: cargo publish
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "sasso") | .version')
          for crate in sasso-core sasso-macros sasso; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -A 'momiji-rs/sasso release-crate.yml' \
              "https://crates.io/api/v1/crates/$crate/$version")
            case "$status" in
              200) echo "$crate $version is already on crates.io; skipping" ;;
              404) cargo publish -p "$crate" ;;
              *)
                echo "::error::crates.io answered HTTP $status for $crate $version"
                exit 1
                ;;
            esac
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

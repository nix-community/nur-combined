# Moonlight OS.  The appliance user has no password and passwordless sudo,
# so password logins would be an open door -- keys only.
#
# moonlight-ssh can turn password logins on temporarily (it sets a password
# at the same time); it writes 20-moonlight-password.conf, which sorts after
# this file and wins.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AllowUsers moonlight

# Nothing here has a reason to forward anything.  X11 is deliberately left
# off: diagnosing the display is done with DISPLAY=:0 on the box itself,
# which needs no forwarding.
AllowTcpForwarding no
X11Forwarding no
PrintMotd no

# Intel SST audio on Bay Trail and Cherry Trail: give it a buffer it can
# actually service.
#
# These tablets put audio through a small DSP that cannot keep up with the
# tiny buffers PipeWire hands out by default.  Left alone the graph settles
# on a 128 frame quantum -- 2.7 ms -- and the DSP xruns roughly a hundred
# times a second.  What that looks like from the outside is very specific and
# very misleading:
#
#   * a local sound test works, because speaker-test asks for big buffers
#   * a stream has no audio at all
#   * the ALSA device is RUNNING and its hw_ptr advances at exactly realtime,
#     so every obvious check says audio is fine
#   * Moonlight logs "Audio packet queue overflow" and then "Network dropped
#     audio data", which reads like a network fault and is not one -- the
#     output side never drains a full period, the queue backs up, and the
#     dropped sequence numbers are the consequence rather than the cause
#
# 1024 frames is 21 ms.  That is a lot of audio latency by desktop standards
# and irrelevant here: the stream it is playing has already crossed a network
# and been through a decoder, and Moonlight's own jitter buffer dwarfs it.
#
# Matched on the platform driver rather than applied globally, so a machine
# with an ordinary HDA codec -- which handles 128 frames without complaint --
# keeps its low latency.  bytcr and bytcht are the Bay Trail spellings of the
# same hardware family; cht-bsw is Cherry Trail.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-cht-bsw.*" }
      { node.name = "~alsa_output.platform-bytcr.*"  }
      { node.name = "~alsa_output.platform-bytcht.*" }
      { node.name = "~alsa_input.platform-cht-bsw.*" }
      { node.name = "~alsa_input.platform-bytcr.*"   }
      { node.name = "~alsa_input.platform-bytcht.*"  }
    ]
    actions = {
      update-props = {
        api.alsa.period-size = 1024
        api.alsa.headroom    = 8192
        node.force-quantum   = 1024
      }
    }
  }
]

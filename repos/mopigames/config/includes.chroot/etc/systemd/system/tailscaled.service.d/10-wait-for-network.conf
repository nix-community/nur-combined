# The unit that ships in Tailscale's tarball is ordered after
# NetworkManager.service, which is up long before any Wi-Fi association has
# happened.  On an appliance with no cable in it, tailscaled therefore starts
# with no route to anywhere -- and with the tarball's Restart=on-failure and
# systemd's default rate limit it gives up for good after a handful of tries
# a fraction of a second apart.  Nothing brings it back, so the Tailscale
# menu reports a dead daemon for the rest of the boot.
#
# Two changes, because either on its own leaves a hole.

[Unit]
# Wait for an actual association rather than for the daemon that manages
# associations.  Wants= and not Requires=: an appliance that has no network
# configured yet must still boot, and NetworkManager-wait-online failing
# after its timeout must not keep tailscaled down.
Wants=network-online.target
After=network-online.target

# No permanent give-up.  Wi-Fi drops, and the first boot of a live image has
# no saved network at all, so tailscaled will sometimes legitimately start
# before there is anywhere to connect to.
StartLimitIntervalSec=0

[Service]
# Retrying every ten seconds forever costs nothing on an idle appliance and
# removes the state where only a reboot fixes it.  An explicit `systemctl
# stop` still stops it -- Restart= does not fight the admin.
Restart=always
RestartSec=10

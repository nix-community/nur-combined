# Moonlight raises the priority of its render and audio threads, and without
# these it is refused:
#
#   SDL Warn: Unable to set render thread to high priority: setpriority() failed
#   SDL Warn: Unable to set audio thread to high priority: setpriority() failed
#
# which costs frame pacing and can crackle the audio.  This is a single-user
# appliance whose one job is the thing asking for the priority.

moonlight - nice -11
moonlight - rtprio 20

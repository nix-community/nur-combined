# Moonlight OS settings.  Edited by the on-screen menus; safe to edit by hand.

# xrandr output Moonlight should open on (e.g. HDMI-1).  Empty = let X decide.
MOONLIGHT_OUTPUT=""

# single | mirror | extend
DISPLAY_MODE="single"

# Generated from the display menu; passed straight to xrandr.
XRANDR_ARGS=""

# Per-screen resolution overrides: "HDMI-1=1920x1080@119.88 eDP-1=1280x720@60.00"
# A screen with no entry here uses the best mode it says it supports.
MODE_OVERRIDES=""

# Per-screen, and only meaningful with more than one screen attached.
# Rotation is normal | left | right | inverted, e.g. "HDMI-1=left".
# Sides place a screen next to MOONLIGHT_OUTPUT when DISPLAY_MODE is extend:
# right | left | above | below, e.g. "HDMI-1=above".
ROTATIONS=""
SCREEN_SIDES=""

# Set a host here to skip the launcher and stream immediately on boot.
AUTOCONNECT_HOST=""
AUTOCONNECT_APP="Desktop"

# Set by the first-run wizard; applied to both the console and X.
KEYBOARD_LAYOUT=""
KEYBOARD_VARIANT=""
TIMEZONE=""

# Set to "yes" to bypass Vulkan/hardware decoding when the stream is black.
FORCE_SOFTWARE="no"

# borderless | fullscreen | windowed.  Borderless covers the screen without
# asking the monitor to change mode, which is what some Intel panels choke on.
WINDOW_MODE="borderless"

# What to ask the host PC for.  An empty width and height means "whatever
# this screen is running at", which beats Moonlight's own 1280x720 default on
# anything bigger than a netbook.
STREAM_WIDTH=""
STREAM_HEIGHT=""
STREAM_FPS="60"
# 0 lets Moonlight work it out from the resolution and frame rate.
STREAM_BITRATE="0"

# stereo | 5.1 | 7.1, and whether the sound comes out here or on the PC.
AUDIO_CONFIG="stereo"
HOST_AUDIO="no"

# yes sends the Windows key and Alt+Tab to the host PC.  The cost is that
# while a stream is running this machine sees no keys at all, so Ctrl+Alt+M
# cannot open the menu -- leave the stream with Ctrl+Alt+Shift+Q first.
CAPTURE_SYS_KEYS="yes"

# yes inverts the trackpad, so content follows your fingers.  Moonlight's own
# reverse-scroll flag is held off so the two do not cancel each other out.
NATURAL_SCROLL="no"

# Low-battery warnings, drawn over the top of the stream.  Nothing in the
# streaming protocol carries this machine's battery to the host PC, and a
# fullscreen app hides any taskbar that might have shown it -- so the warning
# has to happen on this end.  Ignored on a machine with no battery.
#
# BATTERY_LEVELS is a list of percentages, warned about once each as the
# charge falls past them; the last one is treated as critical and repeats
# until the charger goes back in.
BATTERY_WARN="yes"
BATTERY_LEVELS="20 10 5"

# USB passthrough to the host PC.
#
# These are set by Devices & input -> USB passthrough, and only do anything
# when mlos-host-utils is running on the host PC -- it is the half
# that knows whether that PC needs usbip-win2 or a kernel module, so nothing
# here mentions an operating system.
#
# yes keeps the host PC in step with what is plugged in here: plug a wheel
# in and it appears there, unplug it and it goes away again.
USB_AUTOSHARE="no"

# safe | all
#
# safe shares wheels, HOTAS, pedals, dongles, printers, MIDI and microphones,
# and keeps keyboards, mice, speakers, webcams and storage on this machine --
# Moonlight already forwards input and playback with less latency than USB/IP
# can, and video and disks are more than it can carry.
#
# Microphones are shared, and headphones are not, because the stream carries
# sound one way: to this machine, never from it.  Nothing else can get a mic
# to the host.  A headset counts as a microphone, so it goes over as a whole.
#
# all shares everything, *including this machine's own keyboard and mouse*,
# which then drive the host PC and not these menus.
#
# Under both: hubs, whatever this machine booted from, and the network
# adapter carrying the connection are never shared.  Losing any of those
# takes the running system with them.
USB_AUTOSHARE_POLICY="safe"

# Space-separated vendor:product ids, e.g. "046d:c262 044f:b68f".
# INCLUDE shares a device the policy would have skipped; EXCLUDE never
# shares one.  By id rather than bus id, so moving the cable to a different
# socket does not silently change the answer.
USB_AUTOSHARE_INCLUDE=""
USB_AUTOSHARE_EXCLUDE=""

# Where mlos-host-utils is listening, and the code it printed.
# Written by "Pair the host PC"; the code is what proves this machine is
# allowed to plug USB devices into that one, so treat it like a password.
USB_HOST_ADDR=""
USB_HOST_PORT="48020"
USB_HOST_TOKEN=""

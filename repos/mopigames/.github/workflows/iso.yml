name: iso

# A full live-build run: ~1 GB of downloads and a multi-GB chroot, so this is
# deliberately not on every push.  Tag a release, or start it by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      iso_version:
        description: 'Version label stamped into the ISO filename'
        default: '6.2.0'
      os_version:
        description: 'Installed OS version (tag builds use the tag)'
        default: '0~dev'
      selene_ref:
        description: 'Compatible Selene ref (must provide setup and panel actions)'
        default: 'v6.2.0'
      firmware:
        description: 'full keeps every blob, slim drops ~400 MB'
        type: choice
        options: [full, slim]
        default: full
      ssh_public_key:
        description: 'Public key authorised for the moonlight user (blank = none)'
        default: ''
  schedule:
    # Weekly, so a broken upstream package or a moved download URL surfaces
    # before you need an image rather than after.
    - cron: '17 4 * * 1'

permissions:
  contents: write   # needed only by the release step

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # A stock runner has ~14 GB free on /, and the chroot plus squashfs
      # plus the ISO does not fit.  None of this is used by the build.
      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /usr/local/share/powershell /usr/share/swift
          sudo docker image prune -af
          df -h /

      # cache/ holds the Tailscale tarball and live-build's .deb pool.
      # Restoring it cuts the download
      # from ~1 GB to almost nothing; the key rolls weekly so the pool does
      # not go stale (and stays under the 10 GB cache budget).
      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: cache
          key: mlos-cache-${{ inputs.iso_version || '6.2.0' }}-${{ github.run_id }}
          restore-keys: |
            mlos-cache-${{ inputs.iso_version || '6.2.0' }}-

      - name: Stage SSH key
        id: ssh
        env:
          KEY: ${{ inputs.ssh_public_key }}
        run: |
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > "$RUNNER_TEMP/authorized_keys"
            echo "arg=$RUNNER_TEMP/authorized_keys" >> "$GITHUB_OUTPUT"
          else
            # Never 'auto' here: that would bake whatever keys happen to be
            # on the runner into a public image.
            echo "arg=none" >> "$GITHUB_OUTPUT"
          fi

      # The client is built from source into a .deb, so its checkout is a
      # build input.  Submodules are required: Selene links the shared
      # protocol library (moonlight-os/lunaris) as a submodule.
      - name: Check out Selene
        uses: actions/checkout@v4
        with:
          repository: moonlight-os/selene
          # Pin the compatible appliance client. Selene main does not yet
          # provide the setup/panel commands the session calls at boot.
          ref: ${{ inputs.selene_ref || 'v6.2.0' }}
          submodules: recursive
          path: selene

      - name: Build the ISO
        env:
          ISO_VERSION: ${{ inputs.iso_version || '6.2.0' }}
          MLOS_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.os_version || '0~dev' }}
          FIRMWARE: ${{ inputs.firmware || 'full' }}
          SSH_KEYS: ${{ steps.ssh.outputs.arg }}
          SELENE_SRC: ${{ github.workspace }}/selene
        run: ./build.sh

      - name: Describe the image
        id: iso
        run: |
          iso="$(find out -maxdepth 1 -name '*.iso' -print -quit)"
          [ -n "$iso" ] || { echo "no ISO produced"; exit 1; }
          sudo chown "$(id -u):$(id -g)" "$iso"
          ( cd out && sha256sum "$(basename "$iso")" > SHA256SUMS )
          echo "path=$iso" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$iso" .iso)" >> "$GITHUB_OUTPUT"
          ls -lh out
          cat out/SHA256SUMS

      - name: Sign updater metadata
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_KEY: ${{ secrets.MLOS_UPDATE_SIGNING_KEY }}
        run: |
          [ -n "$SIGNING_KEY" ] || { echo "MLOS_UPDATE_SIGNING_KEY is not configured"; exit 1; }
          iso="${{ steps.iso.outputs.path }}"
          version="${GITHUB_REF_NAME#v}"
          sha256="$(sha256sum "$iso" | awk '{ print $1 }')"
          size="$(wc -c < "$iso" | tr -d '[:space:]')"
          printf 'format=1\nversion=%s\niso=%s\nsha256=%s\nsize=%s\n' \
            "$version" "$(basename "$iso")" "$sha256" "$size" \
            > out/moonlight-os-update.txt
          key="$RUNNER_TEMP/moonlight-os-update.pem"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          chmod 0600 "$key"
          openssl pkeyutl -sign -rawin -inkey "$key" \
            -in out/moonlight-os-update.txt \
            -out out/moonlight-os-update.txt.sig
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/update.pub"
          cmp "$RUNNER_TEMP/update.pub" \
            config/includes.chroot/usr/share/moonlight-os/update.pub

      # An ISO is already compressed; re-compressing it wastes several
      # minutes for nothing.
      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.iso.outputs.name }}
          path: |
            out/*.iso
            out/SHA256SUMS
            out/moonlight-os-update.txt
            out/moonlight-os-update.txt.sig
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      # The package manifest is what tells you why an image changed.
      - name: Upload the build manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ github.run_id }}
          path: |
            moonlight-os-*.packages
            moonlight-os-*.files
          retention-days: 14
          if-no-files-found: ignore

      # live-build also caches the bootstrapped rootfs under cache/bootstrap,
      # and that one must not be carried between runs here.  It is a real
      # filesystem, so it depends on ownership the cache cannot preserve: the
      # step below chowns everything to the runner user so the cache can be
      # saved at all, which rewrites /tmp inside that rootfs away from root.
      # apt drops to the _apt user to verify signatures and then cannot write
      # there, so every signed repository fails with
      #
      #   Unable to mkstemp /tmp/apt.sig.XXXXXX - GetTempFile (13: Permission denied)
      #   E: The repository '...' is not signed.
      #
      # and live-build aborts.  The trap is that this never breaks the run
      # that saves the cache, only the next one that restores it -- so it
      # looks intermittent and unrelated to whatever was merged in between.
      # Re-bootstrapping costs well under a minute; the package pool, the Go
      # caches and the Tailscale tarball are what the cache is actually for
      # and they stay.
      - name: Drop the bootstrap stage from the cache
        if: always()
        run: sudo rm -rf cache/bootstrap

      # Parts of cache/ are written by root inside the build containers; the
      # cache post-step runs as the runner user and cannot read those.
      - name: Normalise cache ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" cache 2>/dev/null || true

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --generate-notes --title "$tag"
          gh release upload "$tag" \
            "${{ steps.iso.outputs.path }}" out/SHA256SUMS \
            out/moonlight-os-update.txt out/moonlight-os-update.txt.sig --clobber

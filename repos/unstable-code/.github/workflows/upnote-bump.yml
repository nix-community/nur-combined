name: "UpNote bump"
# UpNote 는 버전 없는 롤링 URL 로만 배포돼 flake/dependabot 어느 쪽도 신버전을 알려주지 못한다.
# 게다가 unfree 라 ci.nix 의 isBuildable 필터에서 빠져 build.yml 의 일일 cron 도 이 패키지를 건드리지
# 않는다 → 아무 자동화도 없으면 영원히 뒤처진다. 그래서 별도 폴링 파이프라인이 필요하다.
on:
  schedule:
    # 매일 01:00 UTC = 10:00 KST. 롤링 URL 이라 **폴링 간격이 그대로 다운스트림의 고장 노출 창**이다 —
    # 업스트림이 파일을 갈아치우는 순간, 옛 해시에 묶인 소비자는 새로 빌드할 방법이 사라진다.
    # 주 1회(월요일)였을 때 그 창이 최대 7일이었고 실제로 터졌다: UpNote 가 2026-08-27(목) 9.22.2 를
    # 내놓았는데 봇은 08-31(월)에야 잡았고, 그 사이 9.22.0 에 묶여 있던 nix-configurations 의
    # home-manager switch 가 hash mismatch 로 죽었다. 매일 돌리면 창이 24시간으로 줄어든다.
    # 빈도를 올려도 비용은 거의 없다 — Check upstream version 스텝(update.sh)이 순수 셸이라
    # 범프 없는 날은 nix 설치조차 하지 않고 no-op 으로 끝난다.
    # nix-configurations 의 weekly flake update(화 06:30 KST)보다 앞서 도는 성질은 그대로다 —
    # 월요일 10:00 KST 실행분이 다음 날 그쪽 `nix flake update` 에 자연히 실려간다.
    # ⚠ 그게 성립하려면 **반영까지 자동**이어야 한다(→ 아래 Commit & push). PR 만 열고 사람 손을
    #   기다리면 그 사이 롤링 URL 이 갈려 다운스트림 빌드가 깨진다(#4 에서 실제로 겪었다).
    # ⚠ 남는 창(최대 24시간)은 구조적이라 주기로는 못 없앤다. 폴링 직후 릴리스가 나면, 그 사이
    #   store 에 결과물이 없는 기기는 여전히 깨진다. 그쪽 대책은 이미 빌드된 store path 를 기기 간에
    #   공유하는 것(다운스트림 substituter)이지 폴링을 더 조이는 게 아니다.
    - cron: '0 1 * * *'
  workflow_dispatch:

# 레포 기본값이 default_workflow_permissions=read 라 명시적 상향이 필요하다.
#   master 직접 푸시라 contents 만 있으면 된다(PR 을 안 만드므로 pull-requests 불요).
permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 버전 확인이 먼저다 — update.sh 는 순수 셸(sort -V)이라 nix 가 필요 없다. 덕분에 아래
      #   nix 설치를 실제 범프가 있는 주로 미룰 수 있다(대부분의 주는 no-op).
      - name: Check upstream version
        id: update
        run: ./pkgs/upnote/update.sh

      - name: Install nix
        if: steps.update.outputs.updated == 'true'
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixpkgs-unstable.tar.gz
          extra_nix_config: |
            experimental-features = nix-command flakes

      # 검증을 여기서 하는 이유: bump PR 이 트리거하는 build.yml 은 ci.nix 의 unfree 필터 때문에
      #   upnote 를 빌드하지 않는다. 즉 이 스텝이 이 패키지의 유일한 CI 검증 지점이다.
      #   해시는 업스트림 메타파일에서 왔으니 맞지만, 새 버전이 새 공유 라이브러리를 요구하거나
      #   동봉 prebuild 경로가 바뀌면 autoPatchelf 가 깨진다 — PR 을 열기 전에 그걸 잡는다.
      - name: Verify build
        if: steps.update.outputs.updated == 'true'
        run: |
          nix-build . -A upnote \
            --arg pkgs 'import <nixpkgs> { config.allowUnfree = true; }' \
            --no-out-link

      # PR 을 거치지 않고 기본 브랜치에 직접 커밋한다. 이 레포엔 브랜치 보호가 없어 squash 머지
      #   결과와 직접 푸시 결과가 **동일한 커밋 하나**이고, 리뷰 창은 실제로 아무도 쓰지 않는다 —
      #   알림이 오지 않아 PR #4(9.20.0)가 일주일 방치됐고 그 사이 업스트림이 롤링 URL 을 갈아끼워
      #   다운스트림(nix-configurations) 주간 빌드가 해시 불일치로 깨졌다. 사람 손이 필요한 단계를
      #   두는 것 자체가 이 파이프라인의 단일 실패점이었다.
      #   검증은 바로 위 Verify build 가 담당하고, 회귀 시 대응은 revert 다.
      - name: Commit & push
        if: steps.update.outputs.updated == 'true'
        env:
          OLD: ${{ steps.update.outputs.old_version }}
          NEW: ${{ steps.update.outputs.new_version }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 커밋 메시지는 파일로 넘긴다(-F). heredoc 을 <<'EOF' 로 **인용**해 셸 해석을 전부 끈다 —
          #   본문에 백틱이 있어 비인용 heredoc 이면 명령치환으로 먹힌다. 값은 sed 로 주입.
          msg="$RUNNER_TEMP/commit-msg.txt"
          cat > "$msg" <<'EOF'
          upnote: @OLD@ -> @NEW@

          업스트림 메타파일(<https://download.getupnote.com/app/latest-linux.yml>)의 version 과
          .deb 아티팩트 sha512 를 그대로 SRI 로 옮겼다. 롤링 URL 이라 이 갱신이 늦으면 옛 해시가
          그대로 깨지므로 자동 폴링·자동 푸시한다.

          검증: `nix-build . -A upnote` (allowUnfree) 통과 — UpNote 는 unfree 라 build.yml 의
          isBuildable 필터에서 빠져, 이 워크플로가 유일한 CI 검증 지점이다.

          ⚠ 실행 확인은 사후다. Electron GPU 가속(libEGL dlopen)과 fcitx5 한글 입력은 빌드가
          잡지 못한다 — 이상이 있으면 이 커밋을 revert 할 것.
          EOF
          sed -i -e "s|@OLD@|$OLD|g" -e "s|@NEW@|$NEW|g" "$msg"
          git commit -aF "$msg"

          # 스케줄 실행 중 다른 커밋이 들어와 non-fast-forward 가 될 수 있다. 이 커밋은 default.nix
          #   두 줄만 건드리므로 rebase 로 얹으면 그만이다(강제 푸시는 쓰지 않는다).
          for i in 1 2 3; do
            if git push origin "HEAD:$BASE"; then
              exit 0
            fi
            echo "푸시 재시도 $i/3 — 원격이 앞서 있어 rebase 후 재시도"
            git pull --rebase origin "$BASE"
          done
          echo "error: 푸시 실패 — 수동 확인 필요" >&2
          exit 1

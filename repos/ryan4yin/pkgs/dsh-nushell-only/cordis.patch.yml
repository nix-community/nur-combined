# dsh-nushell-only: replace the first-party shell providers with Nushell.
# The bundle and Nushell paths are substituted at build time.
- id: bash-sandbox
  disabled: true

- id: pwsh-sandbox
  disabled: true

- insert:
    - id: nushell-executor
      name: @bundle@/lib/executor.js
      config:
        nuPath: @nu@/bin/nu
        timeoutMs: 60000
        maxTimeoutMs: 600000
        maxOutputBytes: 64000
        graceMs: 3000
        enforceNushellOnly: true
        requireNu: true
        verifyNu: true
    - id: nushell-teaching
      name: @bundle@/lib/teaching.js
      config:
        guide: full
        rewriteToolDescriptions: true
        rules: true

name: Update packages

# Runs daily (and on demand) and opens one pull request per outdated package.
# Flake inputs are handled by update-flake-inputs.yml, which runs weekly and
# commits flake.lock straight to main.
#
# The default GITHUB_TOKEN can push branches and open PRs, but workflows it
# triggers do not run. The update job therefore builds each package before
# opening the PR.
on:
  schedule:
    # Random off-peak minute (UTC), away from the top-of-hour rush and the
    # 03:23 build workflow.
    - cron: '42 6 * * *'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated package names to update (empty = all)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has-updates: ${{ steps.discover.outputs.has-updates }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Build update matrix
        id: discover
        env:
          PACKAGES: ${{ github.event.inputs.packages }}
          TYPES: package
        run: python3 scripts/discover_updates.py

  update:
    needs: discover
    if: needs.discover.outputs.has-updates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ matrix.name }}
        run: nix run ".#packages.x86_64-linux.$NAME.updateScript"
      - name: Verify updated package
        env:
          NAME: ${{ matrix.name }}
        run: nix build --no-link ".#packages.x86_64-linux.$NAME"
      - name: Compute PR metadata
        id: pr
        env:
          NAME: ${{ matrix.name }}
          OLD_VERSION: ${{ matrix.version }}
        run: |
          new=$(nix eval --raw ".#packages.x86_64-linux.$NAME.version")
          echo "title=$NAME: $OLD_VERSION -> $new" >> "$GITHUB_OUTPUT"
          echo "commit=chore($NAME): update to $new" >> "$GITHUB_OUTPUT"
      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update/${{ matrix.name }}
          delete-branch: true
          labels: dependencies,automated
          title: ${{ steps.pr.outputs.title }}
          commit-message: ${{ steps.pr.outputs.commit }}
          body: |
            Automated update from .github/workflows/update-packages.yml.

            - package: ${{ matrix.name }}

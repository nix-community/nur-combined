name: Update packages
on:
  schedule:
    # Random off-peak minute (UTC), away from the top-of-hour rush and the
    # 03:23 build workflow.
    - cron: '42 6 * * *'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated package names to update (empty = all)'
        required: false
        default: ''
      inputs:
        description: 'Space-separated flake inputs to update (empty = all)'
        required: false
        default: ''

# The default GITHUB_TOKEN can push branches and open PRs, but workflows it
# triggers do not run. The update job therefore builds each package before
# opening the PR.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has-updates: ${{ steps.discover.outputs.has-updates }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Build update matrix
        id: discover
        env:
          PACKAGES: ${{ github.event.inputs.packages }}
          INPUTS: ${{ github.event.inputs.inputs }}
        run: python3 scripts/discover_updates.py

  update:
    needs: discover
    if: needs.discover.outputs.has-updates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TYPE: ${{ matrix.type }}
          NAME: ${{ matrix.name }}
        run: |
          if [ "$TYPE" = "package" ]; then
            nix run ".#packages.x86_64-linux.$NAME.updateScript"
          else
            nix flake update "$NAME"
          fi
      - name: Verify updated package
        if: matrix.type == 'package'
        env:
          NAME: ${{ matrix.name }}
        run: nix build --no-link ".#packages.x86_64-linux.$NAME"
      - name: Compute PR metadata
        id: pr
        env:
          TYPE: ${{ matrix.type }}
          NAME: ${{ matrix.name }}
          OLD_VERSION: ${{ matrix.version }}
        run: |
          if [ "$TYPE" = "package" ]; then
            new=$(nix eval --raw ".#packages.x86_64-linux.$NAME.version")
            echo "title=$NAME: $OLD_VERSION -> $new" >> "$GITHUB_OUTPUT"
            echo "commit=chore($NAME): update to $new" >> "$GITHUB_OUTPUT"
          else
            echo "title=flake.lock: update $NAME" >> "$GITHUB_OUTPUT"
            echo "commit=chore(flake.lock): update $NAME" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update/${{ matrix.name }}
          delete-branch: true
          labels: dependencies,automated
          title: ${{ steps.pr.outputs.title }}
          commit-message: ${{ steps.pr.outputs.commit }}
          body: |
            Automated update from .github/workflows/update.yml.

            - item: ${{ matrix.name }} (${{ matrix.type }})

name: "Build and populate cache"
on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    # rebuild everyday at 5:55; scheduled runs also bump flake.lock first
    - cron: "55 5 * * *"
  workflow_dispatch:

# push-flake-lock needs to commit the updated flake.lock back to the branch.
permissions:
  contents: write

jobs:
  update-flake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Update flake.lock
        # Only scheduled and manual runs move the pin; push/PR builds
        # always use the committed lock.
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: nix flake update
      - name: Hand flake.lock to later jobs
        uses: actions/upload-artifact@v7
        with:
          name: flake-lock
          path: flake.lock
          overwrite: true

  build:
    needs: update-flake
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Restore flake.lock
        uses: actions/download-artifact@v8
        with:
          name: flake-lock
          path: .
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = https://zerozawa.cachix.org https://nix-community.cachix.org
            extra-trusted-public-keys = zerozawa.cachix.org-1:9jPl+Xq6S4va32gPNJXTApDafDUwa5zjgFX65QfJ1CQ= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - name: Show flake inputs
        run: nix flake metadata
      # Builds against the nixpkgs pinned in flake.lock, so the pushed
      # store paths match exactly what flake users build locally.
      # nix-fast-build pushes each finished build to cachix via its own
      # `nix shell nixpkgs#cachix` daemon; no cachix-action needed.
      - name: Build nix packages
        run: nix run nixpkgs#nix-fast-build -- --no-nom --skip-cached --max-jobs 1 --flake .#ciJobs.x86_64-linux --cachix-cache zerozawa
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}
      - name: Trigger NUR update
        if: ${{ github.event_name != 'pull_request' }}
        run: curl -XPOST "https://nur-update.nix-community.org/update?repo=zerozawa"

  push-flake-lock:
    # Only land the bumped pin once the build against it is green, so a
    # broken nixpkgs-unstable HEAD never reaches the committed lock.
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Restore flake.lock
        uses: actions/download-artifact@v8
        with:
          name: flake-lock
          path: .
      - name: Commit flake.lock
        run: |
          if git diff --quiet flake.lock; then
            echo "flake.lock unchanged, nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore(flake): update flake.lock"
          git push

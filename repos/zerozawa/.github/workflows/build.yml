name: "Build and populate cache"
on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    # rebuild everyday at 5:55; scheduled runs also bump flake.lock first
    - cron: "55 5 * * *"
  workflow_dispatch:

# push-flake-lock needs to commit the updated flake.lock back to the branch.
permissions:
  contents: write

jobs:
  update-flake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Update flake.lock
        # Only scheduled and manual runs move the pin; push/PR builds
        # always use the committed lock.
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: nix flake update
      - name: Hand flake.lock to later jobs
        uses: actions/upload-artifact@v7
        with:
          name: flake-lock
          path: flake.lock
          overwrite: true

  build:
    needs: update-flake
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Restore flake.lock
        uses: actions/download-artifact@v8
        with:
          name: flake-lock
          path: .
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            # 只是信任设置，不涉及缓存地址：flake.nix 是缓存配置的唯一来源。
            # cachix 的 post-build-hook 模式需要 runner 是 trusted user，
            # 否则退化成 watch 整个 store（会把替换下来的依赖也传上去）。
            # accept-flake-config 让本 job 的每条 nix 命令（包括枚举 ciJobs 的
            # nix eval）都接受 flake.nix 的 substituters，而不是只对手写
            # --option 的那一条生效。
            trusted-users = root runner
            accept-flake-config = true
      - name: Show flake inputs
        run: nix flake metadata
      # Builds against the nixpkgs pinned in flake.lock, so the pushed
      # store paths match exactly what flake users build locally.
      # nix-fast-build pushes each finished build to cachix via its own
      # `nix shell nixpkgs#cachix` daemon; no cachix-action needed.
      # nix-eval-jobs is provided explicitly: recent nixpkgs builds of
      # nix-fast-build dropped the wrapper PATH entry for it, so relying on
      # nix-fast-build's own closure fails with "No such file or directory:
      # 'nix-eval-jobs'".
      - name: Build nix packages
        run: |
          # 要构建哪些包完全由 flake.nix 的 ciJobs 决定（ciPackages 按包名索引）。
          # 不用 nix-fast-build：installable 是 flake 属性，nix 自己会应用
          # flake.nix 的 nixConfig，缓存地址因此只在那声明一次；
          # cachix watch-exec 走 post-build-hook，只推送本次真正构建的路径
          targets=()
          while IFS= read -r name; do
            targets+=(".#ciJobs.x86_64-linux.\"$name\"")
          done < <(nix eval --json .#ciJobs.x86_64-linux --apply builtins.attrNames | jq -r '.[]')
          nix shell nixpkgs#cachix -c \
            cachix watch-exec zerozawa -- \
              nix build --no-link --max-jobs 1 --keep-going \
                "${targets[@]}"
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}
      - name: Trigger NUR update
        if: ${{ github.event_name != 'pull_request' }}
        run: curl -XPOST "https://nur-update.nix-community.org/update?repo=zerozawa"

  push-flake-lock:
    # Only land the bumped pin once the build against it is green, so a
    # broken nixpkgs-unstable HEAD never reaches the committed lock.
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Restore flake.lock
        uses: actions/download-artifact@v8
        with:
          name: flake-lock
          path: .
      - name: Commit flake.lock
        run: |
          if git diff --quiet flake.lock; then
            echo "flake.lock unchanged, nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore(flake): update flake.lock"
          git push

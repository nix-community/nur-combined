name: "Update packages"
on:
  schedule:
    - cron: '0 9 * * *' # Daily at 9:00 UTC
  workflow_dispatch:

jobs:
  update-pkg:
    name: update-${{ matrix.package }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - ccpocket-bridge
          - kagiana
          - roots
          - givy
          - symbol-desktop-wallet
          - mdhq
        include:
          # Upstream tags multiple components (windows/v*, bridge/v*, ...);
          # restrict to bridge tags so nix-update doesn't pick another component's version.
          # --use-github-releases is required: the releases.atom feed only carries the
          # most recent ~20 entries, and the other components now ship far more often
          # than bridge, pushing bridge releases out of that window.
          - package: ccpocket-bridge
            nix-update-extra-args: "--version-regex 'bridge/v(.+)' --use-github-releases"
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install nix
      uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      with:
        nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixpkgs-unstable.tar.gz
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Capture current version
      id: before
      run: |
        VERSION=$(grep 'version = ' pkgs/${{ matrix.package }}/default.nix | head -1 | sed 's/.*"\(.*\)".*/\1/')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Run nix-update
      env:
        NIXPKGS_ALLOW_UNFREE: "1"
      run: |
        nix shell nixpkgs#nix-update -c \
          nix-update --system x86_64-linux --build -f ./default.nix ${{ matrix.package }} ${{ matrix.nix-update-extra-args }}

    - name: Detect changes
      id: after
      run: |
        if git diff --quiet pkgs/${{ matrix.package }}/; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          VERSION=$(grep 'version = ' pkgs/${{ matrix.package }}/default.nix | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        fi

    - name: Create Pull Request
      id: cpr
      if: steps.after.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
      with:
        token: ${{ secrets.NUR_UPDATE_PAT }}
        branch: update/${{ matrix.package }}-${{ steps.after.outputs.version }}
        commit-message: "${{ matrix.package }}: ${{ steps.before.outputs.version }} -> ${{ steps.after.outputs.version }}"
        title: "${{ matrix.package }}: ${{ steps.before.outputs.version }} -> ${{ steps.after.outputs.version }}"
        body: |
          Automated update of ${{ matrix.package }} from `${{ steps.before.outputs.version }}` to `${{ steps.after.outputs.version }}`.

          Generated by `nix-update` (`passthru.updateScript`).
        labels: automated

    - name: Enable auto-merge
      if: steps.after.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}"

  update-oneaws:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install nix
      uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      with:
        nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixpkgs-unstable.tar.gz
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Get current oneaws version
      id: before
      run: |
        VERSION=$(grep -A1 'oneaws = {' pkgs/oneaws/gemset.nix | grep version | sed 's/.*"\(.*\)".*/\1/' || true)
        # Fallback: parse from Gemfile.lock
        if [ -z "$VERSION" ]; then
          VERSION=$(grep '    oneaws ' pkgs/oneaws/Gemfile.lock | awk '{print $2}' | tr -d '()')
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Update oneaws gems
      run: |
        cd pkgs/oneaws
        nix shell nixpkgs#bundler nixpkgs#bundix -c bash -c '
          bundle update
          bundix
        '

    - name: Check for changes
      id: check
      run: |
        if git diff --quiet pkgs/oneaws/; then
          echo "needs_update=false" >> "$GITHUB_OUTPUT"
        else
          echo "needs_update=true" >> "$GITHUB_OUTPUT"
          VERSION=$(grep '    oneaws ' pkgs/oneaws/Gemfile.lock | awk '{print $2}' | tr -d '()')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.before.outputs.version }}" != "$VERSION" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi
        fi

    - name: Create Pull Request (version update)
      id: cpr_version
      if: steps.check.outputs.needs_update == 'true' && steps.check.outputs.version_changed == 'true'
      uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
      with:
        token: ${{ secrets.NUR_UPDATE_PAT }}
        branch: update/oneaws-${{ steps.check.outputs.version }}
        commit-message: "oneaws: ${{ steps.before.outputs.version }} -> ${{ steps.check.outputs.version }}"
        title: "oneaws: ${{ steps.before.outputs.version }} -> ${{ steps.check.outputs.version }}"
        body: |
          Automated update of oneaws from `${{ steps.before.outputs.version }}` to `${{ steps.check.outputs.version }}`.

          Release: https://github.com/pepabo/oneaws/releases/tag/v${{ steps.check.outputs.version }}
        labels: automated

    - name: Create Pull Request (dependency update)
      id: cpr_deps
      if: steps.check.outputs.needs_update == 'true' && steps.check.outputs.version_changed == 'false'
      uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
      with:
        token: ${{ secrets.NUR_UPDATE_PAT }}
        branch: update/oneaws-deps
        commit-message: "oneaws: update dependencies"
        title: "oneaws: update dependencies"
        body: |
          Automated dependency update for oneaws (version unchanged at `${{ steps.check.outputs.version }}`).
        labels: automated

    - name: Enable auto-merge (version update)
      if: steps.check.outputs.needs_update == 'true' && steps.check.outputs.version_changed == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh pr merge --squash --auto "${{ steps.cpr_version.outputs.pull-request-number }}"

    - name: Enable auto-merge (dependency update)
      if: steps.check.outputs.needs_update == 'true' && steps.check.outputs.version_changed == 'false'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh pr merge --squash --auto "${{ steps.cpr_deps.outputs.pull-request-number }}"

  update-proton-drive-cli:
    # Proton publishes binaries on its own CDN with no GitHub releases for
    # nix-update to follow, so read version and SHA-512 checksums from the
    # official version.json manifest.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install nix
      uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      with:
        nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixpkgs-unstable.tar.gz
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Capture current version
      id: before
      run: echo "version=$(jq -r .version pkgs/proton-drive-cli/sources.json)" >> "$GITHUB_OUTPUT"

    - name: Update sources.json from version.json
      id: fetch
      run: |
        curl -fsSL https://proton.me/download/drive/cli/version.json | jq '
          [.Releases[] | select(.CategoryName == "Stable")]
          | max_by(.Version | split(".") | map(tonumber))
          | {
              version: .Version,
              hashes: ([.Files[] | {key: (.Url | split("/")[-2]), value: .Sha512CheckSum}] | from_entries
                       | with_entries(select(.key | IN("linux-x64", "linux-arm64", "darwin-x64", "darwin-arm64"))))
            }' > pkgs/proton-drive-cli/sources.json
        echo "version=$(jq -r .version pkgs/proton-drive-cli/sources.json)" >> "$GITHUB_OUTPUT"

    - name: Detect changes
      id: after
      run: |
        if git diff --quiet pkgs/proton-drive-cli/; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Build package
      if: steps.after.outputs.changed == 'true'
      run: nix-build -E 'with import <nixpkgs> { }; callPackage ./pkgs/proton-drive-cli { }'

    - name: Create Pull Request
      id: cpr
      if: steps.after.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
      with:
        token: ${{ secrets.NUR_UPDATE_PAT }}
        branch: update/proton-drive-cli-${{ steps.fetch.outputs.version }}
        commit-message: "proton-drive-cli: ${{ steps.before.outputs.version }} -> ${{ steps.fetch.outputs.version }}"
        title: "proton-drive-cli: ${{ steps.before.outputs.version }} -> ${{ steps.fetch.outputs.version }}"
        body: |
          Automated update of proton-drive-cli from `${{ steps.before.outputs.version }}` to `${{ steps.fetch.outputs.version }}`.
        labels: automated

    - name: Enable auto-merge
      if: steps.after.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}"

  update-plannotator:
    # nix-update cannot refresh the per-platform hashes of a prebuilt
    # binary, so read them from the .sha256 files upstream attaches to
    # each GitHub release.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install nix
      uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      with:
        nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixpkgs-unstable.tar.gz
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Capture current version
      id: before
      run: echo "version=$(jq -r .version pkgs/plannotator/sources.json)" >> "$GITHUB_OUTPUT"

    - name: Update sources.json from the latest release
      id: fetch
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG=$(gh api repos/backnotprop/plannotator/releases/latest --jq .tag_name)
        if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "unexpected tag: $TAG" >&2
          exit 1
        fi
        VERSION=${TAG#v}
        HASHES='{}'
        for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
          HASH=$(curl -fsSL "https://github.com/backnotprop/plannotator/releases/download/${TAG}/plannotator-${platform}.sha256" | awk '{print $1}')
          if ! [[ "$HASH" =~ ^[0-9a-f]{64}$ ]]; then
            echo "unexpected hash for ${platform}: $HASH" >&2
            exit 1
          fi
          HASHES=$(jq --arg k "$platform" --arg v "$HASH" '. + {($k): $v}' <<< "$HASHES")
        done
        jq -n --arg version "$VERSION" --argjson hashes "$HASHES" \
          '{version: $version, hashes: ($hashes | to_entries | sort_by(.key) | from_entries)}' \
          > pkgs/plannotator/sources.json
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Detect changes
      id: after
      run: |
        if git diff --quiet pkgs/plannotator/; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Build package
      if: steps.after.outputs.changed == 'true'
      run: nix-build -E 'with import <nixpkgs> { }; callPackage ./pkgs/plannotator { }'

    - name: Create Pull Request
      id: cpr
      if: steps.after.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
      with:
        token: ${{ secrets.NUR_UPDATE_PAT }}
        branch: update/plannotator-${{ steps.fetch.outputs.version }}
        commit-message: "plannotator: ${{ steps.before.outputs.version }} -> ${{ steps.fetch.outputs.version }}"
        title: "plannotator: ${{ steps.before.outputs.version }} -> ${{ steps.fetch.outputs.version }}"
        body: |
          Automated update of plannotator from `${{ steps.before.outputs.version }}` to `${{ steps.fetch.outputs.version }}`.

          Release: https://github.com/backnotprop/plannotator/releases/tag/v${{ steps.fetch.outputs.version }}
        labels: automated

    - name: Enable auto-merge
      if: steps.after.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}"

name: "Update packages"
on:
  schedule:
    - cron: '0 9 * * *' # Daily at 9:00 UTC
  workflow_dispatch:

jobs:
  update-pkg:
    name: update-${{ matrix.package }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - ccpocket-bridge
          - kagiana
          - roots
          - givy
          - symbol-desktop-wallet
          - mdhq
        include:
          # Upstream tags multiple components (windows/v*, bridge/v*, ...);
          # restrict to bridge tags so nix-update doesn't pick another component's version.
          # --use-github-releases is required: the releases.atom feed only carries the
          # most recent ~20 entries, and the other components now ship far more often
          # than bridge, pushing bridge releases out of that window.
          - package: ccpocket-bridge
            nix-update-extra-args: "--version-regex 'bridge/v(.+)' --use-github-releases"
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixpkgs-unstable.tar.gz
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Capture current version
      id: before
      run: |
        VERSION=$(grep 'version = ' pkgs/${{ matrix.package }}/default.nix | head -1 | sed 's/.*"\(.*\)".*/\1/')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Run nix-update
      env:
        NIXPKGS_ALLOW_UNFREE: "1"
      run: |
        nix shell nixpkgs#nix-update -c \
          nix-update --system x86_64-linux --build -f ./default.nix ${{ matrix.package }} ${{ matrix.nix-update-extra-args }}

    - name: Detect changes
      id: after
      run: |
        if git diff --quiet pkgs/${{ matrix.package }}/; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          VERSION=$(grep 'version = ' pkgs/${{ matrix.package }}/default.nix | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        fi

    - name: Create Pull Request
      id: cpr
      if: steps.after.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@v8
      with:
        branch: update/${{ matrix.package }}-${{ steps.after.outputs.version }}
        commit-message: "${{ matrix.package }}: ${{ steps.before.outputs.version }} -> ${{ steps.after.outputs.version }}"
        title: "${{ matrix.package }}: ${{ steps.before.outputs.version }} -> ${{ steps.after.outputs.version }}"
        body: |
          Automated update of ${{ matrix.package }} from `${{ steps.before.outputs.version }}` to `${{ steps.after.outputs.version }}`.

          Generated by `nix-update` (`passthru.updateScript`).
        labels: automated

    - name: Enable auto-merge
      if: steps.after.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}"

  update-oneaws:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixpkgs-unstable.tar.gz
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Get current oneaws version
      id: before
      run: |
        VERSION=$(grep -A1 'oneaws = {' pkgs/oneaws/gemset.nix | grep version | sed 's/.*"\(.*\)".*/\1/' || true)
        # Fallback: parse from Gemfile.lock
        if [ -z "$VERSION" ]; then
          VERSION=$(grep '    oneaws ' pkgs/oneaws/Gemfile.lock | awk '{print $2}' | tr -d '()')
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Update oneaws gems
      run: |
        cd pkgs/oneaws
        nix shell nixpkgs#bundler nixpkgs#bundix -c bash -c '
          bundle update
          bundix
        '

    - name: Check for changes
      id: check
      run: |
        if git diff --quiet pkgs/oneaws/; then
          echo "needs_update=false" >> "$GITHUB_OUTPUT"
        else
          echo "needs_update=true" >> "$GITHUB_OUTPUT"
          VERSION=$(grep '    oneaws ' pkgs/oneaws/Gemfile.lock | awk '{print $2}' | tr -d '()')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.before.outputs.version }}" != "$VERSION" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi
        fi

    - name: Create Pull Request (version update)
      id: cpr_version
      if: steps.check.outputs.needs_update == 'true' && steps.check.outputs.version_changed == 'true'
      uses: peter-evans/create-pull-request@v8
      with:
        branch: update/oneaws-${{ steps.check.outputs.version }}
        commit-message: "oneaws: ${{ steps.before.outputs.version }} -> ${{ steps.check.outputs.version }}"
        title: "oneaws: ${{ steps.before.outputs.version }} -> ${{ steps.check.outputs.version }}"
        body: |
          Automated update of oneaws from `${{ steps.before.outputs.version }}` to `${{ steps.check.outputs.version }}`.

          Release: https://github.com/pepabo/oneaws/releases/tag/v${{ steps.check.outputs.version }}
        labels: automated

    - name: Create Pull Request (dependency update)
      id: cpr_deps
      if: steps.check.outputs.needs_update == 'true' && steps.check.outputs.version_changed == 'false'
      uses: peter-evans/create-pull-request@v8
      with:
        branch: update/oneaws-deps
        commit-message: "oneaws: update dependencies"
        title: "oneaws: update dependencies"
        body: |
          Automated dependency update for oneaws (version unchanged at `${{ steps.check.outputs.version }}`).
        labels: automated

    - name: Enable auto-merge (version update)
      if: steps.check.outputs.needs_update == 'true' && steps.check.outputs.version_changed == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh pr merge --squash --auto "${{ steps.cpr_version.outputs.pull-request-number }}"

    - name: Enable auto-merge (dependency update)
      if: steps.check.outputs.needs_update == 'true' && steps.check.outputs.version_changed == 'false'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh pr merge --squash --auto "${{ steps.cpr_deps.outputs.pull-request-number }}"

  update-chatgpt:
    # chatgpt's upstream .deb is served from a fixed "latest" URL with no
    # version in it, so nix-update can't detect version/hash changes here.
    # Fetch the deb directly, read the version out of its control file, and
    # recompute both arch hashes to see if anything actually changed.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixpkgs-unstable.tar.gz
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Capture current version
      id: before
      run: |
        VERSION=$(grep 'version = ' pkgs/chatgpt/default.nix | head -1 | sed 's/.*"\(.*\)".*/\1/')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Fetch latest .deb and compute version/hashes
      id: fetch
      run: |
        curl -fsSL -o /tmp/chatgpt_amd64.deb https://persistent.oaistatic.com/codex-app-prod/linux/deb/latest/chatgpt_amd64.deb
        curl -fsSL -o /tmp/chatgpt_arm64.deb https://persistent.oaistatic.com/codex-app-prod/linux/deb/latest/chatgpt_arm64.deb

        echo "version=$(dpkg-deb -f /tmp/chatgpt_amd64.deb Version)" >> "$GITHUB_OUTPUT"
        echo "hash_x86_64=$(nix hash file --sri /tmp/chatgpt_amd64.deb)" >> "$GITHUB_OUTPUT"
        echo "hash_aarch64=$(nix hash file --sri /tmp/chatgpt_arm64.deb)" >> "$GITHUB_OUTPUT"

    - name: Update default.nix
      run: |
        sed -i "s/version = \"[^\"]*\";/version = \"${{ steps.fetch.outputs.version }}\";/" pkgs/chatgpt/default.nix
        sed -i "/chatgpt_amd64.deb/,/hash = /{s|hash = \"[^\"]*\";|hash = \"${{ steps.fetch.outputs.hash_x86_64 }}\";|}" pkgs/chatgpt/default.nix
        sed -i "/chatgpt_arm64.deb/,/hash = /{s|hash = \"[^\"]*\";|hash = \"${{ steps.fetch.outputs.hash_aarch64 }}\";|}" pkgs/chatgpt/default.nix

    - name: Detect changes
      id: after
      run: |
        if git diff --quiet pkgs/chatgpt/; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Build package
      if: steps.after.outputs.changed == 'true'
      env:
        NIXPKGS_ALLOW_UNFREE: "1"
      run: nix-build --impure -E 'with import <nixpkgs> { config.allowUnfree = true; }; callPackage ./pkgs/chatgpt { }'

    - name: Create Pull Request
      id: cpr
      if: steps.after.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@v8
      with:
        branch: update/chatgpt-${{ steps.fetch.outputs.version }}
        commit-message: "chatgpt: ${{ steps.before.outputs.version }} -> ${{ steps.fetch.outputs.version }}"
        title: "chatgpt: ${{ steps.before.outputs.version }} -> ${{ steps.fetch.outputs.version }}"
        body: |
          Automated update of chatgpt from `${{ steps.before.outputs.version }}` to `${{ steps.fetch.outputs.version }}`.

          Rolling URL hash bump (the upstream .deb is served from a fixed "latest" URL).
        labels: automated

    - name: Enable auto-merge
      if: steps.after.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}"

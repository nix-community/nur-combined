name: Build NUR packages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nur-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate flake
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = https://cache.mr-why.cn/nur https://cache.mr-why.cn/nur-pr
            extra-trusted-public-keys = nur:aQlY5sfibsfPJgLVG4yMCrJLB4+RJ1vaebK4sWl74K4= nur-pr:jUrGaS3si2esbX9X2BvhP7mpx2Wyf3Fy3SCC+JQ7E58=

      - name: Check package inventory
        run: |
          nix eval --json .#packages.x86_64-linux \
            --apply 'packages: builtins.attrNames (builtins.removeAttrs packages [ "attic-cache-image" ])'
          nix eval --json .#packages.aarch64-linux \
            --apply 'packages: builtins.attrNames (builtins.removeAttrs packages [ "attic-cache-image" ])'

  build:
    name: Build ${{ matrix.package }} (${{ matrix.system }})
    needs: evaluate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - { package: amber-lsp, system: x86_64-linux, runner: ubuntu-latest }
          - { package: code996, system: x86_64-linux, runner: ubuntu-latest }
          - { package: dnspick, system: x86_64-linux, runner: ubuntu-latest }
          - { package: ghost-downloader-3, system: x86_64-linux, runner: ubuntu-latest }
          - { package: ipgw, system: x86_64-linux, runner: ubuntu-latest }
          - { package: meatshell-bin, system: x86_64-linux, runner: ubuntu-latest }
          - { package: nyaterm-bin, system: x86_64-linux, runner: ubuntu-latest }
          - { package: quien, system: x86_64-linux, runner: ubuntu-latest }
          - { package: seekey, system: x86_64-linux, runner: ubuntu-latest }
          - { package: uipro-cli, system: x86_64-linux, runner: ubuntu-latest }
          - { package: meatshell-bin, system: aarch64-linux, runner: ubuntu-24.04-arm }
          - { package: nyaterm-bin, system: aarch64-linux, runner: ubuntu-24.04-arm }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = https://cache.mr-why.cn/nur https://cache.mr-why.cn/nur-pr
            extra-trusted-public-keys = nur:aQlY5sfibsfPJgLVG4yMCrJLB4+RJ1vaebK4sWl74K4= nur-pr:jUrGaS3si2esbX9X2BvhP7mpx2Wyf3Fy3SCC+JQ7E58=

      - name: Build package
        run: >-
          nix build
          ".#packages.${{ matrix.system }}.${{ matrix.package }}"
          --out-link result
          --show-trace

      # Cache uploads are temporarily disabled while the Attic server is

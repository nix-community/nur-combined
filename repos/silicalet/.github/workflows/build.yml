name: Build NUR packages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nur-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate flake
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = https://cache.mr-why.cn/nur
            extra-trusted-public-keys = nur:aQlY5sfibsfPJgLVG4yMCrJLB4+RJ1vaebK4sWl74K4=

      - name: Check package inventory
        run: |
          nix eval --json .#packages.x86_64-linux \
            --apply 'packages: builtins.attrNames (builtins.removeAttrs packages [ "attic-cache-image" ])'

  build:
    name: Build ${{ matrix.package }}
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        package:
          - amber-lsp
          - cangjie
          - code996
          - dnspick
          - ghost-downloader-3
          - ipgw
          - meatshell
          - nyaterm
          - quien
          - uipro-cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = https://cache.mr-why.cn/nur
            extra-trusted-public-keys = nur:aQlY5sfibsfPJgLVG4yMCrJLB4+RJ1vaebK4sWl74K4=

      - name: Build package
        run: nix build ".#${{ matrix.package }}" --out-link result --show-trace

      - name: Upload closure to Attic
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          test -n "$ATTIC_TOKEN"
          nixpkgs_rev="$(jq -er '.nodes.nixpkgs.locked.rev' flake.lock)"
          attic_installable="github:NixOS/nixpkgs/${nixpkgs_rev}#attic-client"
          nix shell "$attic_installable" -c attic login --set-default \
            github-actions https://cache.mr-why.cn "$ATTIC_TOKEN"
          nix shell "$attic_installable" -c attic push -j 2 nur ./result

name: Update NUR packages

on:
  schedule:
    # Daily at 11:17 Asia/Shanghai (03:17 UTC).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: nur-package-updates
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ github.token }}
  UPDATE_BRANCH: ${{ github.event.repository.default_branch }}
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    access-tokens = github.com=${{ github.token }}
    extra-substituters = https://cache.mr-why.cn/nur
    extra-trusted-public-keys = nur:aQlY5sfibsfPJgLVG4yMCrJLB4+RJ1vaebK4sWl74K4=
    sandbox = false
    filter-syscalls = false

jobs:
  update:
    name: Update packages and push
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: nixos/nix:2.35.2
      # nix-update --build wraps AppImage/FHS packages with bwrap.
      options: --privileged
    defaults:
      run:
        shell: bash

    steps:
      # nixos/nix cannot run actions/checkout (no host Node interpreter).
      - name: Install GitHub CLI
        run: nix-env -iA nixpkgs.gh

      - name: Checkout default branch
        run: |
          git clone --depth 1 --branch "$UPDATE_BRANCH" \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update regular and x86_64 binary packages
        run: nix run .#update -- --all

      - name: Update aarch64 binary packages
        run: >-
          nix run .#update --
          --arch aarch64-linux
          meatshell-bin neomacs-bin nyaterm-bin

      - name: Commit and push updates
        id: commit
        run: |
          if git diff --quiet; then
            echo "All packages are already up to date."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: update packages"
          git pull --rebase origin "$UPDATE_BRANCH"
          git push origin "HEAD:$UPDATE_BRANCH"
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Trigger package builds
        if: steps.commit.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref "$UPDATE_BRANCH"

name: Update tools packages

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  update:
    uses: ./.github/workflows/update-packages.yml
    with:
      category: tools
      # honk source pins require manual coordination; only binaries auto-update.
      packages: >-
        amber-lsp code996 dnspick honk-bin ipgw kuake-cli neu-cli nodecode-bin
        qrypt-bin quarkpan quien uipro-cli zlib-cli
      arm-packages: honk-bin qrypt-bin

name: Update rpcs3-git

on:
  schedule:
    - cron: "00 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Update rpcs3-git
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Update package
        env:
          # nix-update starts nested Nix commands, so this must be inherited rather
          # than passed only to the outer `nix run`.
          NIX_CONFIG: |
            fallback = true
          NIXPKGS_ALLOW_UNFREE: "1"
        run: nix run nixpkgs#nix-update -- --flake --use-update-script rpcs3-git

      - name: Validate and push package update
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          if git diff --quiet pkgs/rpcs3-git/default.nix pkgs/rpcs3-git/submodules.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkgs/rpcs3-git/default.nix pkgs/rpcs3-git/submodules.json
          git commit -m "Update rpcs3-git"

          # Other updaters often push to main during this long build. The same
          # derivation on the new base is exactly the build already validated, so
          # rebuild only when the rebased update evaluates to a different one.
          validated_drv=
          for _ in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            drv=$(nix eval --impure --raw .#rpcs3-git.drvPath)
            if [ "$drv" != "$validated_drv" ]; then
              nix build --impure --no-link --print-build-logs --cores 2 "$drv^*"
              validated_drv=$drv
            fi

            # This non-force push rejects a main that moved after the fetch.
            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "main kept changing during validation; rerun the update" >&2
          exit 1

name: Update wondershaper

on:
  schedule:
    - cron: "00 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Update wondershaper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Update package
        env:
          # nix-update starts nested Nix commands, so this must be inherited rather
          # than passed only to the outer `nix run`.
          NIX_CONFIG: |
            fallback = true
        run: nix run nixpkgs#nix-update -- --flake --use-update-script wondershaper

      - name: Commit and push package update
        run: |
          if git diff --quiet pkgs/wondershaper/default.nix; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkgs/wondershaper/default.nix
          git commit -m "Update wondershaper"
          git push origin HEAD:main

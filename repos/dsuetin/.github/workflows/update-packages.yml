name: "Update packages"
on:
  workflow_dispatch: # allows manual triggering
  schedule:
    - cron: "0 0 * * *" # At 00:00 every day
jobs:
  update_packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          # Nix 2.35+ stops copying local flake sources to the store, which breaks
          # nix-update 1.16.0's getFlake (Mic92/nix-update#693). Unpin once a fixed
          # nix-update (>1.16.0) is released. 2.34.9 is what NixOS 26.11 ships.
          install_url: https://releases.nixos.org/nix/nix-2.34.9/install
          nix_path: "${{ matrix.nixPath }}"
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Update flake packages
        uses: gepbird/nix-update-action@v3.1.3
        with:
          token: ${{ secrets.UPDATE_TOKEN }}

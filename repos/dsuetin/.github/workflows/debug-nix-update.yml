name: "Debug nix-update"
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.9/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Reproduce nix-update-action pipeline
        shell: bash
        run: |
          set -x
          nix profile install --profile "$HOME/dbg-profile" nixpkgs#nix-update nixpkgs#jq 2>&1 | tail -5
          ls "$HOME/dbg-profile/bin"
          export PATH="$HOME/dbg-profile/bin:$PATH"
          which nix nix-instantiate nix-update
          nix --version
          nix flake show --json > /dev/null
          git status --porcelain
          git diff -- flake.lock | head -20
          nix flake metadata --json | python3 -c 'import json,sys,os; d=json.load(sys.stdin); print("META1", d["path"], os.path.exists(d["path"]))'
          nix-update --flake firefox/userjs/betterfox; echo "nix-update exit: $?"
          git status --porcelain
          git diff -- pkgs/firefox/userjs/betterfox.nix | head
          nix flake metadata --json | python3 -c 'import json,sys,os; d=json.load(sys.stdin); print("META2", d["path"], os.path.exists(d["path"]))'

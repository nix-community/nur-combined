name: "Package Updates"
"on":
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      package_filter:
        description: "Regex pattern to filter packages (e.g., ^autokuma or wordpressPackages\\..*)"
        required: false
        default: ""
        type: string
jobs:
  eval:
    runs-on: [bigger-parallel, native-x86_64-linux]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Evaluate Updatable Packages
        id: set-matrix
        env:
          INPUT_FILTER: ${{ inputs.package_filter }}
        run: |
          updatables=$(nix eval --raw .#_bartPackages.updatablesJson)
          if [[ -n "$INPUT_FILTER" ]]; then
            echo "Applying package filter regex: $INPUT_FILTER"
            updatables=$(echo "$updatables" | jq --arg pattern "$INPUT_FILTER" 'map(select(.attrPath | test($pattern)))')
          fi
          updatables=$(echo "$updatables" | jq -c '{ include: . }')
          echo "Final matrix: $updatables"
          echo "matrix=$updatables" >> $GITHUB_OUTPUT
  update-package:
    needs: eval
    runs-on: [bigger-parallel, native-x86_64-linux]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.eval.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-home@a4a889b9c11347ff52afd33bd731618604bbb8b1 # v1
        with:
          gpg-privkey: ${{ secrets.GPG_PRIVKEY }}
          gpg-key-id: ${{ vars.GPG_KEY_ID }}
      - name: update package
        run: |
          base="master"
          head="ci-update/${{ matrix.attrPath }}"

          echo "Processing package: ${{ matrix.attrPath }} (${{ matrix.version }})"
          export NIX_PATH="nixpkgs=$(nix eval --raw .#inputs.nixpkgs.outPath):$NIX_PATH"

          git checkout -B "$head" "origin/$base" || git checkout -b "$head"
          read -r -a update_script_cmd <<< "$(echo '${{ toJson(matrix.updateScript) }}' | jq -r 'join(" ")')"

          echo "Realising ${update_script_cmd[0]}"
          nix-store --realise "${update_script_cmd[0]}" || true
          "${update_script_cmd[@]}" --flake --commit

          if [[ "$(git rev-list origin/"$base"..HEAD --count)" -ne 1 ]]; then
            echo "No changes for ${{ matrix.attrPath }}"
            exit 0
          fi

          git push origin "$head" --force

          existing_prs="$(
            curl --silent --fail-with-body \
              -H "Authorization: token $FORGEJO_TOKEN" \
              "$FORGEJO_SERVER_URL/api/v1/repos/$FORGEJO_REPOSITORY/pulls?state=open"
          )"

          if jq -e --arg head "$head" 'any(.[]; .head.ref == $head)' <<< "$existing_prs" > /dev/null; then
            echo "PR for branch '$head' already exists"
            exit 0
          fi

          title="$(git log -1 --pretty=%s)"
          commit_body="$(git log -1 --pretty=%b)"

          new_version=$(nix eval --raw ".#${{ matrix.attrPath }}.version")
          body="Automated version bump for **${{ matrix.attrPath }}** from \`${{ matrix.version }}\` to \`$new_version\` using \`passthru.updateScript\`."

          if [[ -n "$commit_body" ]]; then
            body="$(printf '%s\n\n```\n%s\n```' "$body" "$commit_body")"
          fi

          jq -n \
            --arg base "$base" \
            --arg head "$head" \
            --arg title "$title" \
            --arg body "$body" \
            '{
              base: $base,
              head: $head,
              title: $title,
              body: $body
            }' |
          curl --fail-with-body "$FORGEJO_SERVER_URL/api/v1/repos/$FORGEJO_REPOSITORY/pulls" \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            --data @-
        env:
          UPDATE_NIX_NAME: ${{ matrix.name }}
          UPDATE_NIX_PNAME: ${{ matrix.pname }}
          UPDATE_NIX_OLD_VERSION: ${{ matrix.version }}
          UPDATE_NIX_ATTR_PATH: ${{ matrix.attrPath }}

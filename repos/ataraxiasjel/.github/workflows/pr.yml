name: "Check eval"
on:
  pull_request:
    paths:
      - "flake.*"
      - "ci.nix"
      - "pkgs/**"
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup magic nix cache
        uses: DeterminateSystems/flakehub-cache-action@main
      - name: Add devShell tools to PATH
        run: |
          # shellcheck disable=SC2016
          nix develop -c sh -c 'echo "$PATH"' | tr ':' '\n' >> "$GITHUB_PATH"
      - name: Show nixpkgs version
        run: nix flake metadata --json --inputs-from . nixpkgs | jq .url
      - name: Check evaluation
        env:
          NIXPKGS_ALLOW_UNFREE: 1
          NIXPKGS_ALLOW_UNSUPPORTED_SYSTEM: 1
        run: ./ci.sh --flake .#checks."$(nix eval --raw --impure --expr builtins.currentSystem)"

name: "Auto update packages"
on:
  schedule:
    - cron: "18 6 * * *"
  workflow_dispatch:
jobs:
  auto-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: master
          ssh-key: ${{ secrets.SSH_DEPLOY_PRIVATE_KEY }}
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup magic nix cache
        uses: DeterminateSystems/flakehub-cache-action@main
      - name: Setup cachix devenv repo
        uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Install and setup direnv
        run: |
          curl -sfL https://direnv.net/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          direnv allow .
          direnv export gha >> "$GITHUB_ENV"
      - name: Show nixpkgs version
        run: |
          direnv status
          nix flake metadata --json --inputs-from . nixpkgs | jq .url
      - name: Update packages
        id: update
        env:
          XDG_RUNTIME_DIR: ${{ github.workspace }}
          GIT_AUTHOR_NAME: AtaraxiaSjel (bot)
          GIT_AUTHOR_EMAIL: ataraxiasjel@users.noreply.github.com
          GIT_COMMITTER_NAME: AtaraxiaSjel (bot)
          GIT_COMMITTER_EMAIL: ataraxiasjel@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIXPKGS_ALLOW_UNFREE: 1
          NIXPKGS_ALLOW_UNSUPPORTED_SYSTEM: 1
        timeout-minutes: 90
        run: |
          # shellcheck disable=SC2155
          export NIX_PATH="nixpkgs=$(nix eval --raw --impure --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.outPath')"
          pkgsNames=$(nix eval --json --impure --expr "(import ./ci.nix {}).updatablePkgsNames" | jq -r ".[]")
          pyNames=$(nix eval --json --impure --expr "(import ./ci.nix {}).pyUpdatablePkgsNames" | jq -r ".[]")
          FAILED_FILE="$RUNNER_TEMP/failed-updates.txt"
          : > "$FAILED_FILE"
          while read -r pkg; do
            if ! nix-update --use-update-script --commit --flake "$pkg"; then
              echo "$pkg" >> "$FAILED_FILE"
            fi
          done <<< "$pkgsNames"
          while read -r py; do
            if ! nix-update --commit -f default.nix "python3Packages.$py"; then
              echo "python3Packages.$py" >> "$FAILED_FILE"
            fi
          done <<< "$pyNames"
          echo "failed-count=$(wc -l < "$FAILED_FILE")" >> "$GITHUB_OUTPUT"
          cat "$FAILED_FILE" || true
      - name: Notify Telegram on failures
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -s "$RUNNER_TEMP/failed-updates.txt" ]; then
            MSG="⚠️ auto-update $(date -u +%F) failed for: $(paste -sd' ' "$RUNNER_TEMP/failed-updates.txt")"
            curl -fsSL -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
              -d chat_id="$TG_CHAT" -d text="$MSG" -d disable_notification=true || true
          fi
      - name: Check evaluation
        env:
          NIXPKGS_ALLOW_UNFREE: 1
          NIXPKGS_ALLOW_UNSUPPORTED_SYSTEM: 1
        run: ./ci.sh --flake .#checks."$(nix eval --raw --impure --expr builtins.currentSystem)"
      - name: Submit auto-update PR
        uses: peter-evans/create-pull-request@v8
        with:
          title: "chore(pkgs): Bump packages to latest version"
          delete-branch: true
          reviewers: ataraxiasjel
          add-paths: |
            pkgs/**

name: "Auto update packages"
on:
  schedule:
    - cron: "18 6 * * *"
  workflow_dispatch:
jobs:
  auto-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: master
          ssh-key: ${{ secrets.SSH_DEPLOY_PRIVATE_KEY }}
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup magic nix cache
        uses: DeterminateSystems/flakehub-cache-action@main
      - name: Setup cachix devenv repo
        uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Install and setup direnv
        run: |
          curl -sfL https://direnv.net/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          direnv allow .
          direnv export gha >> "$GITHUB_ENV"
      - name: Show nixpkgs version
        run: |
          direnv status
          nix flake metadata --json --inputs-from . nixpkgs | jq .url
      - name: Update packages
        id: update
        env:
          XDG_RUNTIME_DIR: ${{ github.workspace }}
          GIT_AUTHOR_NAME: AtaraxiaSjel (bot)
          GIT_AUTHOR_EMAIL: ataraxiasjel@users.noreply.github.com
          GIT_COMMITTER_NAME: AtaraxiaSjel (bot)
          GIT_COMMITTER_EMAIL: ataraxiasjel@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIXPKGS_ALLOW_UNFREE: 1
          NIXPKGS_ALLOW_UNSUPPORTED_SYSTEM: 1
          # suwayomi-server's gradle deps updater wraps gradle in bubblewrap, which
          # fails on GitHub's ubuntu-latest with "bwrap: setting up uid map:
          # Permission denied" (unprivileged user namespaces are restricted there;
          # bwrap runs outside the nix sandbox, so sandbox=false would not help).
          # nixpkgs honors USE_BWRAP=0 to skip it (pure hygiene wrapper, see
          # gradle/update-deps.nix in nixpkgs).
          USE_BWRAP: "0"
        timeout-minutes: 90
        run: |
          # shellcheck disable=SC2155
          export NIX_PATH="nixpkgs=$(nix eval --raw --impure --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.outPath')"
          pkgsNames=$(nix eval --json --impure --expr "(import ./ci.nix {}).updatablePkgsNames" | jq -r ".[]")
          pyNames=$(nix eval --json --impure --expr "(import ./ci.nix {}).pyUpdatablePkgsNames" | jq -r ".[]")
          FAILED_FILE="$RUNNER_TEMP/failed-updates.txt"
          : > "$FAILED_FILE"
          while read -r pkg; do
            # `<<< "$var"` yields one empty line when the list is empty;
            # without this guard we'd run `nix-update --flake ""` once.
            [[ -z "${pkg//[[:space:]]/}" ]] && continue
            if ! nix-update --use-update-script --commit --flake "$pkg"; then
              echo "$pkg" >> "$FAILED_FILE"
            fi
          done <<< "$pkgsNames"
          while read -r py; do
            [[ -z "${py//[[:space:]]/}" ]] && continue
            if ! nix-update --commit -f default.nix "python3Packages.$py"; then
              echo "python3Packages.$py" >> "$FAILED_FILE"
            fi
          done <<< "$pyNames"
          echo "failed-count=$(wc -l < "$FAILED_FILE")" >> "$GITHUB_OUTPUT"
          cat "$FAILED_FILE" || true
      - name: Notify Telegram on failures
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FAILED_FILE="$RUNNER_TEMP/failed-updates.txt"
          if [[ ! -f "$FAILED_FILE" ]] || [[ ! -s "$FAILED_FILE" ]]; then
            echo "No failed updates to report."
            exit 0
          fi
          # 404 from api.telegram.org almost always means the bot token is
          # missing/invalid (URL becomes .../bot/sendMessage). Fail loudly
          # here instead of a cryptic `curl: (22) ... 404`.
          if [[ -z "${TG_TOKEN//[[:space:]]/}" ]]; then
            echo "::warning::TELEGRAM_BOT_TOKEN is empty, skipping Telegram notify. Set it in Settings → Secrets → Actions."
            cat "$FAILED_FILE"
            exit 0
          fi
          if [[ -z "${TG_CHAT//[[:space:]]/}" ]]; then
            echo "::warning::TELEGRAM_CHAT_ID is empty, skipping Telegram notify. Set it in Settings → Secrets → Actions."
            cat "$FAILED_FILE"
            exit 0
          fi
          # Telegram caps text at 4096 chars; keep the message safely below.
          FAILED_LIST="$(paste -sd' ' "$FAILED_FILE")"
          MSG="⚠️ auto-update $(date -u +%F) failed for: $FAILED_LIST"
          if ((${#MSG} > 4000)); then
            MSG="${MSG:0:3900}… (truncated, see job log)"
          fi
          echo "Notifying Telegram chat about: $FAILED_LIST"
          # No -f flag on purpose: on error we want the API body in the log
          # (e.g. {"ok":false,"error_code":404,...}), not just `curl: (22)`.
          # `|| true`: notify must never fail the job / block the PR.
          HTTP_CODE="$(curl -sS -o /tmp/tg-response.txt -w '%{http_code}' -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "disable_notification=true" || echo "curl-failed")"
          echo "Telegram HTTP code: $HTTP_CODE"
          head -c 1000 /tmp/tg-response.txt 2>/dev/null; echo
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::warning::Telegram notify failed with HTTP $HTTP_CODE (see body above). Check TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID."
          fi
          exit 0
      - name: Check evaluation
        env:
          NIXPKGS_ALLOW_UNFREE: 1
          NIXPKGS_ALLOW_UNSUPPORTED_SYSTEM: 1
        run: ./ci.sh --flake .#checks."$(nix eval --raw --impure --expr builtins.currentSystem)"
      - name: Submit auto-update PR
        uses: peter-evans/create-pull-request@v8
        with:
          title: "chore(pkgs): Bump packages to latest version"
          delete-branch: true
          reviewers: ataraxiasjel
          add-paths: |
            pkgs/**

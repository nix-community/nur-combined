name: "Build and populate cache"
on:
  push:
    branches:
      - master
    paths:
      - ".github/**"
      - "flake.*"
      - "ci.nix"
      - "pkgs/**"
  schedule:
    - cron: "43 7 * * *"
  workflow_dispatch:
jobs:
  tests:
    strategy:
      matrix:
        nurRepo:
          - ataraxiasjel
        cachixName:
          - ataraxiadev-foss
        nixpkgs:
          - nixos-unstable # Unstable from flake.lock, updated weekly
          - nixos-26.05 # Latest stable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          android: true
          docker-images: true
          dotnet: true
          haskell: true
          large-packages: false
          preinstalled-runtimes: false
          swap-storage: false
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup magic nix cache
        uses: DeterminateSystems/flakehub-cache-action@main
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: "${{ matrix.cachixName }}"
          signingKey: "${{ secrets.CACHIX_SIGNING_KEY }}"
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          extraPullNames: "devenv"
      - name: Override nixpkgs in flake to latest stable
        if: ${{ matrix.nixpkgs != 'nixos-unstable' }}
        run: nix flake lock --override-input nixpkgs "github:nixos/nixpkgs/${{ matrix.nixpkgs }}"
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Install and setup direnv
        run: |
          curl -sfL https://direnv.net/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          direnv allow .
          direnv export gha >> "$GITHUB_ENV"
      - name: Show nixpkgs version
        run: nix flake metadata --json --inputs-from . nixpkgs | jq .url
      - name: Check evaluation
        id: eval
        env:
          NIXPKGS_ALLOW_UNFREE: 1
          NIXPKGS_ALLOW_UNSUPPORTED_SYSTEM: 1
        run: ./ci.sh --flake .#checks."$(nix eval --raw --impure --expr builtins.currentSystem)"
      - name: Build nix packages
        continue-on-error: true
        id: build-cache
        env:
          NIXPKGS_ALLOW_UNFREE: 1
          NIXPKGS_ALLOW_UNSUPPORTED_SYSTEM: 1
        run: |
          nix-fast-build --option accept-flake-config true --skip-cached --no-nom \
            --flake .#checks."$(nix eval --raw --impure --expr builtins.currentSystem)" \
            --result-file build.json --result-format json
      - name: Print failed builds
        if: steps.build-cache.outcome == 'failure'
        run: jq '.results[] | select(.success != true)' build.json
      - name: Notify Telegram on failures
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FAILED=""
          if [[ "${{ steps.eval.outcome }}" == "failure" ]]; then
            FAILED="evaluation, ${FAILED}"
          fi
          if [[ -f build.json ]]; then
            PKGS="$(jq -r '[.results[] | select(.success != true) | .attr] | unique | .[]' build.json | paste -sd' ')"
            if [[ -n "$PKGS" ]]; then
              FAILED="${FAILED} build: ${PKGS}"
            fi
          elif [[ "${{ steps.build-cache.outcome }}" == "failure" ]]; then
            FAILED="${FAILED} build (no build.json)"
          fi
          if [[ -z "${FAILED//[[:space:],]/}" ]]; then
            echo "No failures to report."
            exit 0
          fi
          if [[ -z "${TG_TOKEN//[[:space:]]/}" ]]; then
            echo "::warning::TELEGRAM_BOT_TOKEN is empty, skipping Telegram notify."
            echo "Failed: $FAILED"
            exit 0
          fi
          if [[ -z "${TG_CHAT//[[:space:]]/}" ]]; then
            echo "::warning::TELEGRAM_CHAT_ID is empty, skipping Telegram notify."
            echo "Failed: $FAILED"
            exit 0
          fi
          MSG="⚠️ build (${{ matrix.nixpkgs }}) failed: ${FAILED}"
          if ((${#MSG} > 4000)); then
            MSG="${MSG:0:3900}… (truncated, see job log)"
          fi
          echo "Notifying Telegram chat about: $FAILED"
          HTTP_CODE="$(curl -sS -o /tmp/tg-response.txt -w '%{http_code}' -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "disable_notification=true" || echo "curl-failed")"
          echo "Telegram HTTP code: $HTTP_CODE"
          head -c 1000 /tmp/tg-response.txt 2>/dev/null; echo
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::warning::Telegram notify failed with HTTP $HTTP_CODE (see body above). Check TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID."
          fi
          exit 0
      - name: Trigger NUR update
        if: ${{ matrix.nurRepo != '<YOUR_REPO_NAME>' }}
        run: curl -XPOST "https://nur-update.nix-community.org/update?repo=${{ matrix.nurRepo }}"

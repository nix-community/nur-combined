name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Pushes to niks3. Pull requests from forks get no token and only build.
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: NixOS/nix-installer-action@v1

      - name: Use niks3 as a substituter
        uses: Mic92/niks3-action@v1.10.0
        with:
          server-url: https://niks3-api.tsubasa.moe
          skip-push: true

      - name: Build and cache outputs
        uses: merrkry/niks3-build-action@v0.1.0
        with:
          server-url: https://niks3-api.tsubasa.moe
          flake: .#buildJobs.x86_64-linux
          args: |
            --option access-tokens "github.com=${{ github.token }}"
            --eval-workers 2
            --push-build-closure

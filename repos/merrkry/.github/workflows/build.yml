name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: NixOS/nix-installer-action@v1

      - name: Set up binary cache
        uses: Mic92/niks3-action@v1
        with:
          server-url: https://niks3-api.tsubasa.moe
          skip-push: true

      - name: Check Nix files
        run: nix develop -c bash -c 'nixfmt --check . && statix check .'

      - name: Check flake evaluation
        run: nix flake check --no-build

      - name: Build packages and dev shell
        uses: merrkry/niks3-build-action@master
        with:
          server-url: https://niks3-api.tsubasa.moe
          flake: .#buildJobs.x86_64-linux
          args: --push-build-closure

name: Update

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  # A release can also ask for an update right away:
  # gh api repos/anotherhadi/nur/dispatches -f event_type=release
  repository_dispatch:
    types: [release]

permissions:
  contents: write

concurrency: update

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Update every package to its latest release
        id: update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          failed=""
          for pkg in $(nix eval --raw .#packages.x86_64-linux --apply 'p: toString (builtins.attrNames p)'); do
            # --build checks the new version builds before --commit keeps it.
            # nix-update is pinned: 1.16.0 (nixos-unstable) fails on flakes
            # with "opening file /nix/store/...-source: No such file".
            nix run github:Mic92/nix-update/v1.17.0 -- --flake "$pkg" --version stable --build --commit || {
              failed="$failed $pkg"
              git checkout -- .
            }
          done
          if [ -n "$failed" ]; then
            echo "::error::could not update:$failed"
            echo "failed=$failed" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh the README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/update-readme.py
          git commit -qam "README: refresh the package table" || true
      - name: Push
        id: push
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "Nothing to update"
          else
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      # A push with GITHUB_TOKEN starts no other workflow: tell NUR here.
      - name: Trigger NUR update
        if: steps.push.outputs.pushed == 'true'
        run: curl -XPOST "https://nur-update.nix-community.org/update?repo=anotherhadi"
      # Fail the run last, so the packages that did update are still pushed.
      - name: Report failed updates
        if: steps.update.outputs.failed != ''
        run: |
          echo "could not update:${{ steps.update.outputs.failed }}"
          exit 1

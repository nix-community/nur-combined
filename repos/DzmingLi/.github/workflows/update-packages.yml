name: Update Packages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update-packages:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Update flake inputs
        run: |
          nix flake update
          if ! git diff --quiet -- flake.lock; then
            git add flake.lock
            git commit -m "flake: update inputs"
          fi

      - name: Check updater transactions
        run: nix build .#checks.x86_64-linux.update-transactions --no-link

      - name: Run declared package update scripts
        id: updates
        continue-on-error: true
        run: nix run .#update -- --all --commit

      # The runner rolls back failed updates and commits successful ones.
      - name: Push successful updates
        run: |
          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            git push
          fi

      - name: Report update failures
        if: steps.updates.outcome == 'failure'
        run: exit 1

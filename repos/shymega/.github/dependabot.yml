version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "Europe/London"
    commit-message:
      prefix: "chore(ci-deps)"
    reviewers:
      - "shymega"
    groups:
      gh-actions-deps:
        patterns:
          - "*"

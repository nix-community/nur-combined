name: update-omp
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # daily, since upstream releases almost every day

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check for a new oh-my-pi release and update hashes
        id: update
        run: ./scripts/update-omp.sh

      - name: Build and smoke-test omp
        if: steps.update.outputs.changed == 'true'
        run: |
          nix build .#omp -L
          version=$(./result/bin/omp --version)
          echo "omp --version -> $version"
          case "$version" in
            omp/*) ;;
            *) echo "::error::omp --version did not print an omp/<version> string (got: $version)"; exit 1 ;;
          esac

      - name: Run flake check
        if: steps.update.outputs.changed == 'true'
        run: nix flake check

      - name: Open a pull request
        if: steps.update.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          # A PAT is required (not the default GITHUB_TOKEN) so that opening this PR
          # triggers nix-check.yml's `pull_request` event — GitHub does not cascade
          # further workflow runs from events authored by the default GITHUB_TOKEN.
          # See: https://github.com/peter-evans/create-pull-request/blob/main/docs/concepts-guidelines.md#triggering-further-workflow-runs
          token: ${{ secrets.OMP_UPDATE_PAT }}
          commit-message: "chore: update omp to ${{ steps.update.outputs.new_version }}"
          title: "chore: update omp to ${{ steps.update.outputs.new_version }}"
          body: |
            Automated update of `omp` (can1357/oh-my-pi) to `${{ steps.update.outputs.new_version }}`.

            - `version` and per-platform `hash` fields in `pkgs/omp/default.nix` were regenerated from that release's `SHA256SUMS.txt` by `scripts/update-omp.sh`.
            - `nix build .#omp` succeeded and `omp --version` reported the expected version string (rules out the known `strip`-corruption regression, see AGENTS.md §1.2).
            - Only the `x86_64-linux` build was actually run and smoke-tested on this runner; the `aarch64-linux`/`aarch64-darwin` hashes are trusted from upstream's published `SHA256SUMS.txt` but not independently built here.

            This PR will auto-merge once the required `nix-check` status check passes.
          branch: update-omp
          labels: |
            dependencies
            automated

      - name: Enable auto-merge
        if: steps.update.outputs.changed == 'true' && steps.cpr.outputs.pull-request-number
        run: gh pr merge --auto --merge "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: "Nix CI"
on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v27
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - name: Nix flake check
      run: nix flake check
    - name: NUR Bot evaluation check
      run: |
        nix-env -f . -qa \* --meta --xml \
          --allowed-uris https://github.com \
          --option restrict-eval true \
          --option allow-import-from-derivation true \
          -I nixpkgs=$(nix-instantiate --find-file nixpkgs) \
          -I $PWD
    - name: Build packages from ci.nix
      run: nix shell -f '<nixpkgs>' nix-build-uncached -c nix-build-uncached ci.nix
    - name: Verify omp version string
      run: |
        nix build .#omp
        version=$(./result/bin/omp --version)
        echo "omp --version -> $version"
        case "$version" in
          omp/*) ;;
          *) echo "::error::omp --version did not print an omp/<version> string (got: $version) - check for a stripping regression"; exit 1 ;;
        esac

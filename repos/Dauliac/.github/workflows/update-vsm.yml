name: Update vsm

# Owns the one thing Renovate structurally cannot: bumping a Nix package pin
# whose correctness depends on fixed-output hashes. nix-update rewrites
# version, src hash and cargoHash together, so the resulting PR builds.
on:
  # Fired by Dauliac/vault-sessions-manager when a release is published, so
  # the bump lands in minutes rather than on the next cron tick.
  repository_dispatch:
    types: [vsm-release]
  schedule:
    # Fallback for when the dispatch does not arrive (missing PAT, failed
    # release job). Daily, off-hours.
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-vsm
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Run nix-update
        id: update
        run: |
          set -euo pipefail
          before=$(nix eval --raw .#vsm.version)

          # --version=stable follows the latest non-prerelease GitHub release
          # and rewrites version + hash + cargoHash in pkgs/vsm/default.nix.
          nix run nixpkgs#nix-update -- vsm --flake --version=stable

          after=$(nix eval --raw .#vsm.version)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after"   >> "$GITHUB_OUTPUT"
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
          fi

      # Prove the bump before asking anyone to look at it. A PR that does not
      # build is worse than no PR.
      - name: Verify the bumped package still builds
        if: steps.update.outputs.changed == 'true'
        run: nix build -L --no-link .#vsm

      - name: Verify NUR restricted evaluation still passes
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          nix-env -f . -qa '*' --meta --xml \
            --option restrict-eval true \
            --option allow-import-from-derivation true \
            --drv-path --show-trace \
            -I nixpkgs=$(nix eval --raw --impure --expr \
              '(builtins.getFlake (toString ./.)).inputs.nixpkgs.outPath') \
            -I "$PWD" > /dev/null

      - name: Open the bump PR
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update-vsm
          base: main
          title: "chore(vsm): ${{ steps.update.outputs.before }} -> ${{ steps.update.outputs.after }}"
          commit-message: |
            chore(vsm): ${{ steps.update.outputs.before }} -> ${{ steps.update.outputs.after }}

            Generated by nix-update. version, src hash and cargoHash were
            rewritten together, so the pin stays internally consistent.

            Verified in CI before this PR was opened:
              nix build .#vsm
              nix-env -qa with restrict-eval (the gate NUR's indexer applies)
          labels: dependencies
          delete-branch: true
          body: |
            Automated bump of `vsm` from `${{ steps.update.outputs.before }}`
            to `${{ steps.update.outputs.after }}`.

            Produced by `nix-update`, which rewrites the version, the
            `fetchFromGitHub` hash and the `cargoHash` in one pass. Renovate
            cannot do this: it has no way to compute a Nix fixed-output hash.

            Already verified on the branch before this PR opened:

            - `nix build .#vsm`
            - `nix-env -qa` under `restrict-eval`, the same gate NUR's
              indexer applies

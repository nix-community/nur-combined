name: "Update Flake Packages ❄️"
on:
  workflow_dispatch:
  schedule:
    - cron: "51 1 * * 0"
jobs:
  updateFlakePackages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Update flake packages
        uses: gepbird/nix-update-action@v3

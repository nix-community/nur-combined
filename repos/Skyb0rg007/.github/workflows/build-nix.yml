on:
  workflow_dispatch: ~
  schedule:
    # 7:25 on Sundays
    - cron: '25 7 * * 0'
  push:
    paths:
      - 'NixOS/**.nix'
      - 'NixOS/flake.lock'
      - '.github/workflows/build-nix.yml'

permissions: {}

jobs:
  build-nix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-latest
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Disable Ubuntu's unprivileged user namespace sysctl
        if: runner.os == 'Linux'
        run: |
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: skyenet
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Build packages
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          nix develop ./NixOS \
            --command nix-fast-build \
            --flake ./NixOS#packages.${{ matrix.system }} \
            --systems ${{ matrix.system }} \
            --select 'packages: builtins.removeAttrs packages (builtins.filter (name: !(builtins.elem "${{ matrix.system }}" (packages.${name}.meta.hydraPlatforms or [ "${{ matrix.system }}" ]))) (builtins.attrNames packages))' \
            --skip-cached \
            --cachix-cache=skyenet \
            --no-nom \
            --no-link

      - name: Run tests
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          nix develop ./NixOS \
            --command nix-fast-build \
            --flake ./NixOS#checks.${{ matrix.system }} \
            --systems ${{ matrix.system }} \
            --select 'checks: builtins.listToAttrs (map (name: { inherit name; value = checks.${name}; }) (builtins.filter (name: builtins.substring 0 5 name == "test-" && builtins.elem "${{ matrix.system }}" (checks.${name}.meta.hydraPlatforms or [ "${{ matrix.system }}" ])) (builtins.attrNames checks)))' \
            --skip-cached \
            --cachix-cache=skyenet \
            --no-nom \
            --no-link

      # TODO: Add to NUR
      # - name: Trigger NUR update
      #   run: curl -X POST "https://nur-update.nix-community.org/update?repo=skyenet"

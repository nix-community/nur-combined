
on:
  workflow_dispatch: ~
  push:
    branches:
      - main
    paths:
      - 'Debian/**'
      - '.github/workflows/build-apt.yml'

# Never publish two repositories at once, and never cancel one midway.
concurrency:
  group: build-apt
  cancel-in-progress: false

env:
  # cascade and dnst need rustc >= 1.88, which noble and plucky do not have.
  DISTRIBUTION: sid
  # Passed between the two jobs below.
  PACKAGES_ARTIFACT: packages

jobs:
  build-debs:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package:
          - cascade
          - dnst
          - skyenet-archive-keyring
    steps:
      - uses: actions/checkout@v7.0.1

        # A build consumes only pkgs/<package>/ and the two scripts, so a hit
        # here means rebuilding would reproduce what is already cached.
      - name: Restore built packages
        id: built
        uses: actions/cache@v6
        with:
          path: |
            Debian/_build/*.deb
            Debian/_build/*.dsc
            Debian/_build/*.tar.*
          key: >-
            built-${{ matrix.package }}-${{ env.DISTRIBUTION }}-${{
            hashFiles(format('Debian/pkgs/{0}/**', matrix.package),
                      'Debian/scripts/mksource.sh',
                      'Debian/scripts/buildbin.sh') }}

        # Editing debian/ invalidates the build but not the upstream tarball or
        # the crates vendored from it, which prepare reuses when present.
      - name: Restore upstream and vendored tarballs
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: Debian/_build/*.orig*.tar.gz
          key: >-
            tarballs-${{ matrix.package }}-${{
            hashFiles(format('Debian/pkgs/{0}/upstream.json', matrix.package),
                      format('Debian/pkgs/{0}/prepare', matrix.package)) }}

      - name: Install build dependencies
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            podman dpkg-dev jq curl xz-utils git make sensible-utils rustup

      - name: Download debcraft source
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: ottok/debcraft
          path: debcraft
          ref: refs/tags/debian/0.9.3

      - name: Install debcraft
        if: steps.built.outputs.cache-hit != 'true'
        working-directory: debcraft
        run: |
          make install-local
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Use a current Rust toolchain
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          rustup update stable --no-self-update
          rustup default stable
          cargo --version

      - name: Configure rootless podman
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          user="$(id -un)"
          grep -q "^$user:" /etc/subuid ||
            sudo usermod --add-subuids 524288-589823 --add-subgids 524288-589823 "$user"
          podman system migrate

      - name: Build package
        if: steps.built.outputs.cache-hit != 'true'
        working-directory: Debian
        run: ./scripts/buildbin.sh "${{ matrix.package }}" "$DISTRIBUTION"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGES_ARTIFACT }}-${{ matrix.package }}
          path: |
            Debian/_build/*.deb
            Debian/_build/*.dsc
            Debian/_build/*.tar.*

  create-repo:
    runs-on: ubuntu-24.04
    needs: build-debs
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install reprepro
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro gnupg

        # One artifact per matrix package, merged back into a single _build/.
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ env.PACKAGES_ARTIFACT }}-*
          merge-multiple: true
          path: Debian/_build

      - name: Import gpg signing key
        run: |
          gpg --batch --import <<<"$APT_SIGNING_KEY"
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}

      - name: Initialize the APT repository
        working-directory: Debian
        run: |
          reprepro -b repo createsymlinks
          reprepro -b repo export

      - name: Add packages to APT repository
        working-directory: Debian
        run: |
          reprepro -b repo includedeb "$DISTRIBUTION" _build/*.deb
          for dsc in _build/*.dsc; do
            reprepro -b repo includedsc "$DISTRIBUTION" "$dsc"
          done

      - name: Delete repo directories that shouldn't be hosted
        run: |
          rm -rf Debian/repo/{conf,db}

      - name: Generate directory listings
        run: |
          Debian/scripts/generate-indices.sh Debian/repo

      - name: Upload repository as artifact
        id: apt_repo_deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: Debian/repo

  deploy-apt:
    environment:
      name: github-pages
      url: ${{ steps.apt_repo_deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: create-repo
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: apt_repo_deployment
        uses: actions/deploy-pages@v5

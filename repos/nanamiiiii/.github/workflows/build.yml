name: "Build and populate cache"
on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    # rebuild everyday at 2:51
    # TIP: Choose a random time here so not all repositories are build at once:
    # https://www.random.org/clock-times/?num=1&earliest=01%3A00&latest=08%3A00&interval=5&format=html&rnd=new
    - cron:  '25 3 * * *'
  workflow_dispatch:
jobs:
  tests:
    strategy:
      matrix:
        # Set this to notify the global nur package registry that changes are
        # available.
        #
        # The repo name as used in
        # https://github.com/nix-community/NUR/blob/master/repos.json
        nurRepo:
          - nanamiiiii
        nixPath:
          - nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixpkgs-unstable.tar.gz

    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Install nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: "${{ matrix.nixPath }}"
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    - name: Show nixpkgs version
      run: nix-instantiate --eval -E '(import <nixpkgs> {}).lib.version'
    - name: Check evaluation
      run: |
        nix-env -f . -qa \* --meta --xml \
          --allowed-uris https://static.rust-lang.org \
          --option restrict-eval true \
          --option allow-import-from-derivation true \
          --drv-path --show-trace \
          -I "nixpkgs=$(nix-instantiate --find-file nixpkgs)" \
          -I "$PWD"
    - name: Build nix packages
      run: nix shell -f '<nixpkgs>' nix-build-uncached -c nix-build-uncached ci.nix -A cacheOutputs
    - name: Upload to S3 binary cache
      if: ${{ github.event_name != 'pull_request' }}
      env:
        S3_STORE_URL: ${{ secrets.S3_STORE_URL }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
      shell: bash
      run: |
        if [[ -z "$S3_STORE_URL" ]]; then
          echo 'S3_STORE_URL is unset; skipping upload.'
          exit 0
        fi
        : "${AWS_ACCESS_KEY_ID:?Set the AWS_ACCESS_KEY_ID secret}"
        : "${AWS_SECRET_ACCESS_KEY:?Set the AWS_SECRET_ACCESS_KEY secret}"
        : "${NIX_SIGNING_KEY:?Set the NIX_SIGNING_KEY secret}"
        [[ "$S3_STORE_URL" == s3://* ]] || { echo 'S3_STORE_URL must start with s3://'; exit 1; }

        umask 077
        key_file=/tmp/nix-cache-signing-key
        trap 'rm -f "$key_file"' EXIT
        printf '%s\n' "$NIX_SIGNING_KEY" > "$key_file"

        # Include cached outputs as well as new builds.
        nix-build ci.nix -A cacheOutputs --no-out-link > "$RUNNER_TEMP/cache-outputs"
        mapfile -t outputs < "$RUNNER_TEMP/cache-outputs"
        if (( ${#outputs[@]} == 0 )); then
          echo 'No cacheable outputs to upload.'
          exit 0
        fi

        nix copy --to "$S3_STORE_URL" "${outputs[@]}"
    - name: Trigger NUR update
      # Don't replace <YOUR_REPO_NAME> here!
      if: ${{ matrix.nurRepo != '<YOUR_REPO_NAME>' }}
      run: curl -XPOST "https://nur-update.nix-community.org/update?repo=${{ matrix.nurRepo }}"

name: "Update package version"
permissions:
  contents: write
  pull-requests: write
on:
  schedule:
    - cron:  '00 2 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Install nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    - name: Use locked nixpkgs
      shell: bash
      run: |
        nixpkgs_path=$(nix eval --impure --raw --expr \
          '(builtins.getFlake (toString ./.)).inputs.nixpkgs.outPath')
        echo "NIX_PATH=nixpkgs=$nixpkgs_path" >> "$GITHUB_ENV"
    - name: Show nixpkgs version
      run: nix-instantiate --eval -E '(import <nixpkgs> {}).lib.version'
    - name: Update clock-tui
      run: nix-shell -p nix-update --run "nix-update clock-tui"
    - name: Update sddm-astronaut
      run: nix-shell -p nix-update --run "nix-update --version=branch=master sddm-astronaut"
    - name: Update wl-x11-clipsync
      run: nix-shell -p nix-update --run "nix-update --version=branch=main wl-x11-clipsync"
    - name: Update md2puki
      run: nix-shell -p nix-update --run "nix-update md2puki"
    - name: Update git-credential-1password
      run: nix-shell -p nix-update --run "nix-update git-credential-1password"
    - name: Update npiperelay
      run: nix-shell -p nix-update --run "nix-update npiperelay"
    - name: Update socklink
      run: nix-shell -p nix-update --run "nix-update socklink"
    - name: Update proton-pass
      run: |
        set -euo pipefail
        updater=$(nix-build --no-out-link -A proton-pass.updateScript)
        "$updater"
    - name: Update proton-drive-cli
      run: |
        set -euo pipefail
        updater=$(nix-build --no-out-link -A proton-drive-cli.updateScript)
        "$updater"
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v8
      with:
        commit-message: "Bump package version"
        title: "chore: bump package version"
        assignees: Nanamiiiii
        reviewers: Nanamiiiii
        branch: ci/update-version

name: Update packages

on:
  workflow_dispatch:
    inputs:
      force_hash:
        description: Download archives and recalculate hashes even when cached
        type: boolean
        default: false
  schedule:
    # Daily at 11:17 Beijing time
    - cron: '17 3 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore source metadata
        id: source-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/source-updates
          key: source-updates-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            source-updates-v2-${{ runner.os }}-

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixpkgs-unstable.tar.gz
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update packages
        id: update
        timeout-minutes: 15
        env:
          PYTHONUNBUFFERED: '1'
          UPDATE_CACHE_DIR: ${{ github.workspace }}/.cache/source-updates
          UPDATE_FORCE_HASH: ${{ inputs.force_hash && '1' || '0' }}
        run: |
          set -euo pipefail
          nix shell nixpkgs#python3 nixpkgs#curl nixpkgs#jq -c bash -euc '
            python3 -m unittest discover -s tests -v
            failed=0
            for package in baidunetdisk lceda-pro; do
              echo "::group::Update $package"
              if ! timeout --kill-after=30s 7m bash "pkgs/$package/update.sh"; then
                echo "::error::$package update failed"
                failed=1
              fi
              echo "::endgroup::"
              if git diff --quiet -- "pkgs/$package"; then
                printf "%-12s %s\n" "$package" "No changes (see group for details)"
              else
                printf "%-12s %s\n" "$package" "Update available"
              fi
            done
            echo "failed=$failed" >> "$GITHUB_OUTPUT"
          '

      - name: Save source metadata
        uses: actions/cache/save@v5
        with:
          path: .cache/source-updates
          key: ${{ steps.source-cache.outputs.cache-primary-key }}

      - name: Review changes
        run: |
          git diff --check
          git diff -- pkgs/baidunetdisk/default.nix pkgs/lceda-pro/default.nix

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update/packages
          delete-branch: true
          commit-message: 'packages: update upstream versions and source hashes'
          title: 'packages: update upstream versions and source hashes'
          body: |
            Automatically update upstream versions and source SHA256 hashes.

            Same-version source hash changes require manual review. LCEDA sources
            are fully downloaded at least every seven days or when manually forced.

            Full Nix build validation is not performed by this workflow.
          add-paths: |
            pkgs/baidunetdisk/default.nix
            pkgs/lceda-pro/default.nix

      - name: Report failed updates
        if: steps.update.outputs.failed == '1'
        run: exit 1

name: update-firefox-addons

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-firefox-addons:
    name: update-firefox-addons
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          nix-installer-branch: main
          extra-conf: accept-flake-config = true

      - name: Configure Git
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Regenerate the add-on lock file
        run: ./scripts/update-firefox-addons

      - name: Commit and open PR if the lock file changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- pkgs/firefox-addons/addons.lock.json; then
            echo "The add-on lock file has no changes, skipping."
            exit 0
          fi

          branch="update-firefox-addons"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Branch '${branch}' already exists."
          else
            echo "Creating branch '${branch}'."
          fi

          git switch -C "$branch"

          git add pkgs/firefox-addons/addons.lock.json
          git commit -m "chore(firefox-addons): update add-on lock file"

          git push origin "HEAD:${branch}" --force

          existing_pr="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --head "${branch}" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          title="chore(firefox-addons): update add-on lock file"
          body="Automated update of \`pkgs/firefox-addons/addons.lock.json\` generated by the \`update-firefox-addons\` workflow."

          if [ -n "$existing_pr" ]; then
            echo "Updating existing PR #${existing_pr}."

            gh pr edit "${existing_pr}" \
              --title "${title}" \
              --body "${body}"
          else
            echo "Creating PR."

            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --head "${branch}" \
              --base "$(gh repo view "${GITHUB_REPOSITORY}" --json defaultBranchRef --jq '.defaultBranchRef.name')" \
              --title "${title}" \
              --body "${body}"
          fi

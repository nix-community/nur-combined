# fly.toml app configuration file for Fly.io
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "seowebchecker-seoaudit"
primary_region = "iad"

[build]
  dockerfile = "docker/Dockerfile"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  HEADLESS = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
permissions:
  contents: write
jobs:
  TagBot:
    if: github.event_name != 'issue_comment' || startsWith(github.event.comment.body, '@JuliaTagBot trigger')
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          subdir: julia

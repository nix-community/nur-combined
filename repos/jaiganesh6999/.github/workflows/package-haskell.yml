name: Build and Check Haskell Package for Hackage

on:
  push:
    paths:
      - 'haskell/**'
      - '.github/workflows/package-haskell.yml'
  workflow_dispatch:

jobs:
  build-and-package:
    name: Cabal Check & Build sdist (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up GHC and Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'
          cabal-version: '3.10'

      - name: Check Package Description
        run: |
          cd haskell
          cabal check

      - name: Build Library
        run: |
          cd haskell
          cabal update
          cabal build

      - name: Create Hackage Source Distribution (sdist)
        run: |
          cd haskell
          cabal sdist --output-dir=dist
          ls -la dist/

      - name: Upload Hackage Source Tarball
        uses: actions/upload-artifact@v4
        with:
          name: seowebchecker-hackage-tarball
          path: haskell/dist/*.tar.gz

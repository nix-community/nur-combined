name: Conda Build & Anaconda.org Publish

on:
  push:
    branches: [ main ]
    paths:
      - 'conda/**'
      - 'python/**'
      - '.github/workflows/build-and-publish-conda.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'conda/**'
      - 'python/**'
      - '.github/workflows/build-and-publish-conda.yml'
  workflow_dispatch:

jobs:
  build_conda:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools

      - name: Build Python wheel if needed
        run: |
          cd python
          python setup.py bdist_wheel
          cd ..

      - name: Build Conda Package
        run: |
          python conda/build_conda.py

      - name: Upload Conda Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seowebchecker-conda-package
          path: conda/dist/noarch/*.tar.bz2

      - name: Publish to Anaconda.org (if ANACONDA_API_TOKEN is set)
        if: env.ANACONDA_API_TOKEN != '' && github.ref == 'refs/heads/main'
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          pip install anaconda-client
          anaconda -t $ANACONDA_API_TOKEN upload --label main conda/dist/noarch/*.tar.bz2

name: Elixir Test & Hex Publish

on:
  push:
    branches: [ main ]
    paths:
      - 'elixir/**'
      - '.github/workflows/test-and-publish-hex.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'elixir/**'
      - '.github/workflows/test-and-publish-hex.yml'
  workflow_dispatch:

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup BEAM (Erlang/OTP & Elixir)
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.16.2'
          otp-version: '26.2.3'

      - name: Retrieve Cached Dependencies
        uses: actions/cache@v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install Hex & Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Format code
        run: mix format

      - name: Run test suite
        run: mix test

      - name: Build Hex package tarball
        run: mix hex.build --unpack=false

      - name: Publish to Hex.pm (if HEX_API_KEY is configured)
        if: env.HEX_API_KEY != '' && github.ref == 'refs/heads/main'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes

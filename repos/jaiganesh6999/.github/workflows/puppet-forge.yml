name: Puppet Forge Publish

on:
  push:
    branches: [main]
    paths:
      - 'puppet/**'
      - '.github/workflows/puppet-forge.yml'
  workflow_dispatch:

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    env:
      FORGE_API_KEY: ${{ secrets.FORGE_API_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Puppet Linter Tools
        run: |
          gem install puppet-lint metadata-json-lint

      - name: Validate Metadata and Manifest Syntax
        run: |
          cd puppet
          metadata-json-lint metadata.json
          puppet-lint --no-autoloader_layout-check manifests/

      - name: Build Module Release Tarball
        run: |
          BUILD_DIR="/tmp/puppet-build/jaiganesh6999-seowebchecker-1.0.0"
          mkdir -p "$BUILD_DIR"
          cp -r puppet/metadata.json puppet/README.md puppet/LICENSE puppet/CHANGELOG.md puppet/manifests puppet/tasks "$BUILD_DIR/"
          cd /tmp/puppet-build
          tar -czf jaiganesh6999-seowebchecker-1.0.0.tar.gz jaiganesh6999-seowebchecker-1.0.0
          ls -la /tmp/puppet-build/jaiganesh6999-seowebchecker-1.0.0.tar.gz

      - name: Publish to Puppet Forge
        run: |
          if [ -z "$FORGE_API_KEY" ]; then
            echo "::warning::FORGE_API_KEY secret is not set in GitHub repository secrets. Skipping Puppet Forge API upload."
            echo "To publish automatically, generate an API token at https://forge.puppet.com/ and add it as FORGE_API_KEY in repository secrets."
            exit 0
          fi

          echo "Uploading jaiganesh6999-seowebchecker-1.0.0.tar.gz to https://forgeapi.puppet.com/v3/releases..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer $FORGE_API_KEY" \
            -F "file=@/tmp/puppet-build/jaiganesh6999-seowebchecker-1.0.0.tar.gz" \
            https://forgeapi.puppet.com/v3/releases)

          BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

          echo "Response: $BODY"
          echo "Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Successfully published jaiganesh6999-seowebchecker to Puppet Forge!"
          else
            echo "::error::Puppet Forge API upload failed with HTTP status $HTTP_STATUS: $BODY"
            exit 1
          fi

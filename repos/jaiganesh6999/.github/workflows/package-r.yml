name: Build and Check R Package for CRAN

on:
  push:
    paths:
      - 'r/**'
      - '.github/workflows/package-r.yml'
  workflow_dispatch:

jobs:
  build-and-check:
    name: R CMD check & Package (.tar.gz)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install Package Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::testthat

      - name: Build R Package Source Tarball
        run: |
          R CMD build --no-build-vignettes --no-manual r
          ls -la seowebchecker_*.tar.gz

      - name: Run R CMD check --as-cran
        run: |
          R CMD check --as-cran --no-manual --ignore-vignettes seowebchecker_*.tar.gz || {
            echo "::error::R CMD check failed. Printing check logs:"
            find . -name "*.log" -exec cat {} +
            exit 1
          }

      - name: Upload CRAN Source Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seowebchecker-cran-tarball
          path: seowebchecker_*.tar.gz

      - name: Create / Update CRAN Tarball Release Asset
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: r-cran-latest
          name: "R Package CRAN Build v1.0.0"
          body: "Official CRAN-compliant package tarball generated by `R CMD build` for SEOWebChecker."
          files: seowebchecker_*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

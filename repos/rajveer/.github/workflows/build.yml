name: Build NUR packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check restricted evaluation
        run: bash scripts/check-evaluation.sh
      - name: Build and test all packages
        run: nix-build default.nix -A nixbox -A nixbox-cli -A nixbox-gui --no-out-link
      - name: Notify NUR
        if: github.event_name != 'pull_request'
        run: curl --fail --show-error --retry 3 -X POST 'https://nur-update.nix-community.org/update?repo=rajveer'

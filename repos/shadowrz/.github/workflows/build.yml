name: build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions: {}

jobs:
  eval:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            os: ubuntu-latest
          - system: aarch64-linux
            os: ubuntu-26.04-arm
          - system: aarch64-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    name: "eval (${{ matrix.system }})"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - name: Configure Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: shadowrz
          extraPullNames: nix-community
          skipPush: true
      - name: Eval
        run: |
          all_drvs="$(nix run nixpkgs#nix-eval-jobs --inputs-from . -- --flake '.#packages.${{ matrix.system }}' --force-recurse --check-cache-status)"
          unbuilt_drvs="$(echo "${all_drvs}" | jq --compact-output '
            select (.cacheStatus == "notBuilt")
            | {
              attr,
              attrPath,
              outPaths: .outputs | join(" "),
              system,
              os: "${{ matrix.os }}",
            }
          ')"
          echo "${unbuilt_drvs}" | jq
          echo "${unbuilt_drvs}" > eval-${{ matrix.system }}

      - name: Upload Result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-${{ matrix.system }}
          path: eval-${{ matrix.system }}

  aggregate:
    needs: eval
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.aggregate.outputs.matrix }}

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: eval-*
          merge-multiple: true
          path: eval-results

      - name: Aggregate
        id: aggregate
        run: |
          concat_drvs="$(cat eval-results/* | jq --slurp --compact-output)"
          echo "${concat_drvs}" | jq

          # GHA requires that at least one entry is presented in the matrix.
          matrix="$(echo "${concat_drvs}" | jq --compact-output '
            if length == 0 then
              [{
                attr: "dummy",
                attrPath: ["dummy"],
                outPaths: [],
                system: "x86_64-linux",
                os: "ubuntu-latest",
                skip: true
              }]
            else
              map(. + { skip: false })
            end
          ')"
          echo "matrix=${matrix}" >> ${GITHUB_OUTPUT}

  build:
    needs: aggregate
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.aggregate.outputs.matrix) }}
    name: build (${{ matrix.attr }}, ${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !matrix.skip }}
        with:
          persist-credentials: false
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        if: ${{ !matrix.skip }}
      - name: Configure Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: ${{ !matrix.skip }}
        with:
          name: shadowrz
          extraPullNames: nix-community
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pathsToPush: ${{ matrix.outPaths }}
      - name: Build
        if: ${{ !matrix.skip }}
        env:
          ATTR_PATH: ${{ matrix.attr }}
        run: nix build ".#${ATTR_PATH}^*" --print-build-logs

  build-ok:
    needs: build
    runs-on: ubuntu-slim
    if: always()
    steps:
      - name: Build OK
        run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "Some builds failed"
            exit 1
          fi

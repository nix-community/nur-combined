name: automerge

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Update flake.lock"
    types:
      - completed

jobs:
  automerge:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Find and merge automated PR
        env:
          GITHUB_TOKEN: ${{ secrets.FLAKE_LOCK_PAT }}
          MERGE_COMMIT_MESSAGE: "pull-request-title"
          MERGE_FORKS: "false"
          MERGE_DELETE_BRANCH: "true"
          MERGE_METHOD: "squash"
          MERGE_LABELS: ""
        run: |
          PR=$(gh pr list \
            --repo "${{ github.repository }}" \
            --state open \
            --label automated \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR" ]; then
            echo "No automated PR found"
            exit 0
          fi

          echo "Merging PR #$PR"

          gh pr update-branch "$PR" \
            --repo "${{ github.repository }}"

          gh api \
            --method PUT \
            "/repos/${{ github.repository }}/pulls/$PR/merge" \
            -f merge_method=squash \
            -f commit_title="Update flake.lock (#$PR)"

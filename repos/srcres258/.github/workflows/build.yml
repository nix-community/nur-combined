name: "Build and populate cache"
on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron:  '0 8 * * *'
  workflow_dispatch:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - nurRepo: srcres258
            cachixName: nur-packages-srcres258
            channel: nixpkgs-unstable
            triggerNurUpdate: true
          - nurRepo: srcres258
            cachixName: nur-packages-srcres258
            channel: nixos-unstable
            triggerNurUpdate: false
          - nurRepo: srcres258
            cachixName: nur-packages-srcres258
            channel: nixos-25-05
            triggerNurUpdate: false
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    - name: Install nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    - name: Show nixpkgs version
      run: nix eval --raw .#channels.${{ matrix.channel }}.nixpkgsVersion.x86_64-linux
    - name: Setup cachix
      uses: cachix/cachix-action@v16
      if: ${{ matrix.cachixName != '<YOUR_CACHIX_NAME>' }}
      with:
        name: ${{ matrix.cachixName }}
        signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    # iEDA comes from its own flake input, so it is identical in every leg;
    # build it once instead of three times.
    - name: Build iEDA
      if: ${{ matrix.channel == 'nixpkgs-unstable' }}
      run: nix build --print-build-logs .#packages.x86_64-linux.ieda
    - name: Smoke test iEDA executable
      if: ${{ matrix.channel == 'nixpkgs-unstable' }}
      run: test -x result/bin/iEDA
    # `nix build` never evaluates `meta`, but NUR tooling (`nix-env -q --meta`,
    # `nix search`, the NUR index) does. Force every package's meta here so a
    # broken attribute fails CI instead of a user's query.
    - name: Check evaluation
      run: |
        nix eval --json .#channels.${{ matrix.channel }}.packages.x86_64-linux \
          --apply 'pkgs: builtins.mapAttrs (_: p: p.meta) pkgs'
    - name: Build nix packages
      run: |
        # Flake installables must be derivations or paths, so expand the
        # cacheable-output list from the flake into one installable per output.
        # The `^*` suffix is what makes nix BUILD each derivation: a bare .drv
        # path is already a valid store path, so `nix build $drv` is a no-op.
        targets=$(nix eval --raw .#channels.${{ matrix.channel }}.cacheOutputs.x86_64-linux \
          --apply 'ds: builtins.concatStringsSep " " (map (d: "${d.drvPath}^*") ds)')
        nix build --keep-going --print-build-logs --no-link $targets
    - name: Trigger NUR update
      if: ${{ matrix.nurRepo != '<YOUR_REPO_NAME>' && matrix.triggerNurUpdate }}
      run: curl -XPOST "https://nur-update.nix-community.org/update?repo=${{ matrix.nurRepo }}"

name: "Build"
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron:  '04 9 * * *'
  workflow_dispatch:
jobs:
  build:
    continue-on-error: true
    strategy:
      matrix:
        nixpkgs:
          - name: locked
            override: ""
          - name: stable
            override: "--override-input nixpkgs github:NixOS/nixpkgs/nixos-26.05"
          - name: unstable
            override: "--override-input nixpkgs github:NixOS/nixpkgs/nixos-unstable"
    runs-on: ubuntu-latest
    name: build (${{ matrix.nixpkgs.name }})
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Install nix
      uses: nixbuild/nix-quick-install-action@v35
      with:
        nix_conf: |
          experimental-features = nix-command flakes
    - name: Show nixpkgs version
      run: |
        nixpkgs=$(nix flake metadata --json ${{ matrix.nixpkgs.override }} . \
          | jq -r '.locks.nodes.nixpkgs.locked | "\(.type):\(.owner)/\(.repo)/\(.rev)"')
        echo "$nixpkgs"
        nix eval --raw "$nixpkgs#lib.version"
        echo
    - name: Build nix packages
      run: |
        nix run nixpkgs#nix-fast-build -- \
          --flake '.#packages.x86_64-linux' \
          --no-nom \
          --skip-cached \
          ${{ matrix.nixpkgs.override }}
  notify:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Trigger NUR update
      run: curl -XPOST "https://nur-update.nix-community.org/update?repo=moredread"

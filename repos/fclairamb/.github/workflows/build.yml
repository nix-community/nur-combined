name: "Build and populate cache"
on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    # rebuild every day at 4:37
    - cron:  '37 4 * * *'
  workflow_dispatch:
jobs:
  tests:
    name: build (${{ matrix.channel }})
    strategy:
      matrix:
        channel:
          - nixpkgs-unstable
          - nixos-unstable
          - nixos-26.05
    runs-on: ubuntu-26.04
    env:
      # NUR repo name, as used in https://github.com/nix-community/NUR/blob/main/repos.json
      NUR_REPO: fclairamb
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Install nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: "nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/${{ matrix.channel }}.tar.gz"
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    - name: Show nixpkgs version
      run: nix-instantiate --eval -E '(import <nixpkgs> {}).lib.version'
    - name: Setup cachix
      uses: cachix/cachix-action@v17
      # Enabled by setting the CACHIX_NAME repository variable (plus the
      # CACHIX_SIGNING_KEY or CACHIX_AUTH_TOKEN secret).
      if: ${{ vars.CACHIX_NAME != '' }}
      with:
        name: ${{ vars.CACHIX_NAME }}
        signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: Check evaluation
      run: |
        nix-env -f . -qa \* --meta --xml \
          --allowed-uris https://static.rust-lang.org \
          --option restrict-eval true \
          --option allow-import-from-derivation true \
          --drv-path --show-trace \
          -I nixpkgs=$(nix-instantiate --find-file nixpkgs) \
          -I $PWD
    - name: Build nix packages
      run: nix shell -f '<nixpkgs>' nix-build-uncached -c nix-build-uncached ci.nix -A cacheOutputs
    - name: Trigger NUR update
      if: ${{ github.event_name != 'pull_request' }}
      run: curl -XPOST "https://nur-update.nix-community.org/update?repo=$NUR_REPO"

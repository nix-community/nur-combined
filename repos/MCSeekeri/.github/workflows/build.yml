name: "Build and populate cache"
on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "45 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        nixPath:
          - nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-unstable.tar.gz
          - nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-26.05.tar.gz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Backup Node toolchain
        run: sudo mv /opt/hostedtoolcache/node /tmp/hostedtoolcache-node 2>&1 | grep -v "Permission denied" || true
      - name: Enlarge swap for Rust LTO
        shell: bash
        run: |
          sudo swapoff -a 2>&1 | grep -v "Permission denied" || true
          sudo rm -f /swapfile /mnt/swapfile 2>&1 | grep -v "Permission denied" || true
          if ! sudo fallocate -l 4G /mnt/swapfile 2>&1 | grep -v "Permission denied"; then sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=4096 status=progress 2>&1 | grep -v "Permission denied" || true; fi
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile 2>&1 | tail -n 5 || true
          sudo swapon /mnt/swapfile 2>&1 | grep -v "Permission denied" || true
          sudo swapon /swapfile 2>&1 | grep -v "Permission denied" || true
          free -h 2>&1 | grep -v "Permission denied" || true; swapon --show 2>&1 | grep -v "Permission denied" || cat /proc/swaps 2>&1 | grep -v "Permission denied" || true; df -h 2>&1 | grep -v "Permission denied" | head -n 20 || true
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: "rampage"
          witness-carnage: true
          root-safe-haven: "1024"
          mnt-safe-haven: "2048"
      - name: Restore Node toolchain
        run: |
          sudo mkdir -p /opt/hostedtoolcache
          sudo mv /tmp/hostedtoolcache-node /opt/hostedtoolcache/node 2>&1 | grep -v "Permission denied" || true
          node --version 2>&1 | grep -v "Permission denied" | head -n 5 || true
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: "${{ matrix.nixPath }}"
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = https://nix.mcseekeri.com?priority=51
            extra-trusted-public-keys = nix.mcseekeri.com-1:3gd0/2u7IOF7YooxEiBbWTvRCYGC53S2UoqFdnCUYHc=
            build-dir = /nix/build
            max-jobs = 1
            max-substitution-jobs = 4
            cores = 4
      - name: Setup niks3
        uses: Mic92/niks3-action@v1
        with:
          server-url: https://niks3.mcseekeri.com
          drain-timeout: 7200
      - name: Show nixpkgs version
        run: nix-instantiate --eval -E '(import <nixpkgs> {}).lib.version'
      - name: Check evaluation
        run: |
          nix-env -f . -qa \* --meta --xml \
            --allowed-uris https://static.rust-lang.org \
            --option restrict-eval true \
            --option allow-import-from-derivation true \
            --drv-path --show-trace \
            -I nixpkgs=$(nix-instantiate --find-file nixpkgs) \
            -I $PWD
      - name: Build nix packages
        shell: bash
        run: |
          heartbeat() { while sleep 5m; do echo "::notice::Nix build still running at $(date -Iseconds)"; done; }
          sysinfo() {
            while sleep 3m; do
              echo "::group::📊 System Info $(date -Iseconds)"
              cat /proc/loadavg 2>&1 | grep -v "Permission denied" || true; uptime 2>&1 | grep -v "Permission denied" || true
              lscpu 2>&1 | grep -v "Permission denied" | head -n 15 || true
              if command -v mpstat >/dev/null 2>&1; then mpstat -P ALL 1 1 2>&1 | grep -v "Permission denied" | tail -n 15 || true; fi
              echo "--- PSI Pressure (if available) ---"
              cat /proc/pressure/cpu 2>&1 | grep -v "Permission denied" | head -n 10 || echo "no cpu pressure"; cat /proc/pressure/memory 2>&1 | grep -v "Permission denied" | head -n 10 || echo "no memory pressure"; cat /proc/pressure/io 2>&1 | grep -v "Permission denied" | head -n 10 || echo "no io pressure"
              free -h 2>&1 | grep -v "Permission denied" || true; cat /proc/meminfo 2>&1 | grep -v "Permission denied" | head -n 30 || true
              vmstat -w 1 2 2>&1 | grep -v "Permission denied" | tail -n 10 || true
              df -h 2>&1 | grep -v "Permission denied" || true; df -i 2>&1 | grep -v "Permission denied" | head -n 10 || true; lsblk -f 2>&1 | grep -v "Permission denied" | head -n 15 || true
              swapon --show 2>&1 | grep -v "Permission denied" || cat /proc/swaps 2>&1 | grep -v "Permission denied" || true
              sudo btrfs filesystem usage /nix 2>&1 | grep -v "Permission denied" | head -n 50 || sudo btrfs filesystem show /nix 2>&1 | grep -v "Permission denied" | head -n 50 || sudo btrfs filesystem df /nix 2>&1 | grep -v "Permission denied" | head -n 50 || true
              df -h /nix 2>&1 | grep -v "Permission denied" || true
              ps aux --sort=-%cpu 2>&1 | grep -v "Permission denied" | head -n 30 || true; echo "--- Top MEM ---"; ps aux --sort=-%mem 2>&1 | grep -v "Permission denied" | head -n 15 || true
              if command -v pidstat >/dev/null 2>&1; then echo "--- pidstat ---"; pidstat -rud 1 1 2>&1 | grep -v "Permission denied" | tail -n 20 || true; fi
              ss -s 2>&1 | grep -v "Permission denied" | head -n 20 || ss -tuln 2>&1 | grep -v "Permission denied" | head -n 20 || true; cat /proc/net/dev 2>&1 | grep -v "Permission denied" | head -n 20 || true
              cat /proc/sys/fs/file-nr 2>&1 | grep -v "Permission denied" | head -n 20 || true; ls -l /proc/self/fd 2>&1 | grep -v "Permission denied" | head -n 20 || true
              sudo dmesg 2>&1 | grep -v "Permission denied" | grep -v "Operation not permitted" | tail -n 30 | grep -i -E "oom|killed|error|fail" | head -n 30 || sudo dmesg 2>&1 | grep -v "Permission denied" | grep -v "Operation not permitted" | tail -n 30 || true
              journalctl -p 3 -n 20 --no-pager 2>&1 | grep -v "Permission denied" | head -n 30 || journalctl --no-pager -n 30 2>&1 | grep -v "Permission denied" | head -n 30 || true
              if command -v iostat >/dev/null 2>&1; then iostat -x 1 2 2>&1 | grep -v "Permission denied" | tail -n 30 || true; else echo "iostat not found"; vmstat -D 2>&1 | grep -v "Permission denied" | head -n 20 || true; fi
              if command -v sar >/dev/null 2>&1; then sar -u 1 1 2>&1 | grep -v "Permission denied" | tail -n 20 || true; fi
              echo "::endgroup::"
            done
          }
          heartbeat & heartbeat_pid=$!
          sysinfo & sysinfo_pid=$!
          trap 'kill "$heartbeat_pid" "$sysinfo_pid" 2>/dev/null || true; wait "$heartbeat_pid" 2>/dev/null || true; wait "$sysinfo_pid" 2>/dev/null || true' EXIT
          nix shell -f '<nixpkgs>' nix-build-uncached -c nix-build-uncached \
            --show-trace --option log-lines 0 ci.nix -A cacheOutputs
      - name: Trigger NUR update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: curl -XPOST "https://nur-update.nix-community.org/update?repo=MCSeekeri"

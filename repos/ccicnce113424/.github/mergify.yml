queue_rules:
  - name: default
    merge_method: rebase
    queue_conditions:
      - check-success=All Builds
      - check-success=All Checks
    merge_conditions:
      - check-success=All Builds
      - check-success=All Checks
    batch_size:
      min: 1
      max: 8
    checks_timeout: null

pull_request_rules:
  - name: Queue when labeled
    conditions:
      - and:
          - label=dependencies
          - base=main
    actions:
      queue:
        name: default

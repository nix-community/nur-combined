name: Build and Cache
on:
  push:
    paths:
      - "packages/**"
      - "flake.nix"
      - "flake.lock"
  workflow_dispatch:

jobs:
  matrix:
    name: Build Matrix
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}
    steps:
      - uses: actions/checkout@v5
      - id: set-matrix
        run: echo "packages=$(jq -c . packages.json)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.package }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        package: ${{ fromJson(needs.matrix.outputs.packages) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            build:
              - 'flake.nix'
              - 'flake.lock'
              - 'packages/${{ matrix.package }}/**'
      - uses: cachix/install-nix-action@v31
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.build == 'true'
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v16
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.build == 'true'
        with:
          name: nix-repository--aster-void
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: '(-source$|\.tar\.gz$|\.xz$|\.zip$)'
      - name: Build ${{ matrix.package }}
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.build == 'true'
        run: nix build .#${{ matrix.package }} --print-build-logs
      - name: Push to Cachix
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.build == 'true'
        run: |
          set -euo pipefail
          STORE_PATH=$(nix path-info .#${{ matrix.package }})
          PKG_SIZE=$(nix path-info -s "$STORE_PATH" | awk '{print $2}')
          echo "Package: ${{ matrix.package }}"
          echo "Package NAR size: $((PKG_SIZE / 1024 / 1024))MB ($PKG_SIZE bytes)"
          cachix push nix-repository--aster-void "$STORE_PATH"

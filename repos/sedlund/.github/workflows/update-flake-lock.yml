name: "Flake.lock: update"

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3.22.3
        with:
          github-token: ${{ github.token }}

      # update-flake-lock handles one flake directory; stage the dev lockfile
      # first so the action includes both lockfiles in the same pull request.
      - name: Update dev flake.lock
        run: nix flake update --flake ./dev

      - name: Update root flake.lock and create pull request
        id: update
        uses: DeterminateSystems/update-flake-lock@v28
        with:
          branch: update_flake_lock_action
          commit-msg: "chore(flake): update lock files"
          pr-title: "flake.lock: update"
          pr-body: |
            Automated changes for root and dev lock files.

      - name: Enable auto-merge
        if: >-
          steps.update.outputs.pull-request-number != '' &&
          steps.update.outputs.pull-request-operation != 'closed'
        run: gh pr merge "$PR_NUMBER" --auto --squash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.update.outputs.pull-request-number }}

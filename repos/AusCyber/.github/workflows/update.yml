name: "Update source"
on:
  schedule:
    - cron:  '0 3,15 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  updates:
    runs-on: ubuntu-latest
    steps:
    - name: Generate GitHub App Token
      id: app-token
      uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
      with:
        app-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
    - name: Checkout repository
      uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v4.2.2
      with:
        ref: staging
        token: ${{ steps.app-token.outputs.token }}
        persist-credentials: false
    - name: Install nix
      uses: cachix/install-nix-action@456688f15bc354bef6d396e4a35f4f89d40bf2b7 # v31.8.2
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
    - name: Setup cachix
      uses: cachix/cachix-action@v15
      # Don't replace <YOUR_CACHIX_NAME> here!
      with:
        name: 'auscyber'
        signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

    - name: Update sources
      run: nix run github:berberman/nvfetcher
    - name: update docs
      run: nix run .#docs

    - name: Setup Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    # Lands directly on staging -- staging is allowed to be transiently red,
    # that's the point of it. build.yml's `push: staging` trigger picks this
    # up, and only promotes to main once it actually builds. A GitHub App
    # token (not GITHUB_TOKEN) is used so this push can trigger build.yml at
    # all -- GitHub blocks GITHUB_TOKEN-authored pushes from triggering other
    # workflows.
    - name: Commit & push to staging
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        git add -A
        if ! git diff --cached --quiet; then
          git commit -m "update source"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:staging
        else
          echo "No source changes."
        fi

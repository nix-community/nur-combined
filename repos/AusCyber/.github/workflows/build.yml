name: "Build and populate cache"
on:
  pull_request:
    branches:
      - staging
  push:
    branches:
      - staging
  schedule:
    # rebuild everyday at 2:51
    # TIP: Choose a random time here so not all repositories are build at once:
    # https://www.random.org/clock-times/?num=1&earliest=01%3A00&latest=08%3A00&interval=5&format=html&rnd=new
    - cron:  '51 2 * * *'
  workflow_dispatch:

# A newer push to staging (or a newer push to the same PR) makes any build
# already in flight for that ref moot -- cancel it rather than let it run to
# completion, and don't let a stale build promote to main out from under a
# newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      matrix:
        # Set this to notify the global nur package registry that changes are
        # available.
        #
        # The repo name as used in
        # https://github.com/nix-community/NUR/blob/master/repos.json
        nurRepo:
          - AusCyber
        # Set this to cache your build results in cachix for faster builds
        # in CI and for everyone who uses your cache.
        #
        # Format: Your cachix cache host name without the ".cachix.org" suffix.
        # Example: mycache (for mycache.cachix.org)
        #
        # For this to work, you also need to set the CACHIX_SIGNING_KEY or
        # CACHIX_AUTH_TOKEN secret in your repository secrets settings in
        # Github found at
        # https://github.com/<your_githubname>/nur-packages/settings/secrets
        system:
          - macos-latest
          - ubuntu-latest
        cachixName:
          - auscyber
        nixPath:
          - nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixpkgs-unstable.tar.gz
          - nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-unstable.tar.gz
    runs-on:  ${{ matrix.system }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    - name: Install nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: "${{ matrix.nixPath }}"
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    - name: Setup Attic cache
      uses: ryanccn/attic-action@v0
      with:
        endpoint: ${{ secrets.ATTIC_ENDPOINT }}
        cache: ${{ secrets.ATTIC_CACHE }}
        token: ${{ secrets.ATTIC_TOKEN }}

    - name: Check evaluation
      run: |
        nix-env -f . -qa \* --meta --xml \
          --allowed-uris https://static.rust-lang.org \
          --option restrict-eval true \
          --option allow-import-from-derivation true \
          --option download-buffer-size 624288000 \
          --drv-path --show-trace \
          -I nixpkgs=$(nix-instantiate --find-file nixpkgs) \
          -I $PWD
    - name: Build nix packages
      run: nix shell -f '<nixpkgs>' nix-build-uncached -c nix-build-uncached ci.nix -A cacheOutputs

  ci-success:
    name: CI success
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check build matrix result
        run: |
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "Build matrix result: ${{ needs.tests.result }}"
            exit 1
          fi

  # `staging` is the rolling branch every update lands on and is allowed to be
  # red; `main` only ever moves by fast-forwarding to a staging commit that
  # has actually built (and populated the cache) right here first. Mirrors
  # nixpkgs master (rolling, can go red) vs nixos-unstable (only ever a
  # known-good commit).
  promote-to-main:
    name: Promote staging to main
    needs: ci-success
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout staging
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fast-forward main
        run: git push origin HEAD:main
      - name: Trigger NUR update
        run: curl -XPOST "https://nur-update.nix-community.org/update?repo=AusCyber"

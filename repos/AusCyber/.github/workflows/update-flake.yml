name: "Update flake"
on:
  schedule:
    - cron:  '0 19 * * 6'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  updates:
    runs-on: ubuntu-latest
    steps:
    - name: Generate GitHub App Token
      id: app-token
      uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
      with:
        app-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
    - name: Checkout repository
      uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v4.2.2
      with:
        ref: staging
        token: ${{ steps.app-token.outputs.token }}
        persist-credentials: false
    - name: Install nix
      uses: cachix/install-nix-action@456688f15bc354bef6d396e4a35f4f89d40bf2b7 # v31.8.2
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    - name: Update flake inputs
      run: nix flake update
    - name: update docs
      run: nix run .#docs

    - name: Setup Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    # Same staging-first flow as update.yml: build.yml validates the push
    # before anything reaches main.
    - name: Commit & push to staging
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        git add -A
        if ! git diff --cached --quiet; then
          git commit -m "chore(deps): update flake inputs"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:staging
        else
          echo "No flake changes."
        fi

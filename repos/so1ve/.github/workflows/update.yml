name: Update Packages

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.changes.outputs.base }}
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - uses: cachix/install-nix-action@v31

      - name: Update packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix run .#update

      - name: Detect updates
        id: changes
        run: |
          echo "base=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

          if git diff --quiet HEAD --; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "All packages are up to date." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
            git diff HEAD --stat >>"$GITHUB_STEP_SUMMARY"
            git diff HEAD --binary --full-index >"$RUNNER_TEMP/package-updates.patch"
          fi

      - name: Save package updates
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: package-updates
          path: ${{ runner.temp }}/package-updates.patch
          if-no-files-found: error
          retention-days: 1

  validate:
    if: needs.prepare.outputs.changed == 'true'
    needs: prepare
    name: Validate ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.base }}
      - uses: actions/download-artifact@v8
        with:
          name: package-updates
          path: ${{ runner.temp }}/package-updates
      - name: Apply package updates
        run: git apply "$RUNNER_TEMP/package-updates/package-updates.patch"
      - uses: cachix/install-nix-action@v31
      - uses: ./.github/actions/build-packages
        with:
          system: ${{ matrix.system }}

  publish:
    if: ${{ always() && needs.prepare.outputs.changed == 'true' && needs.validate.result == 'success' }}
    needs:
      - prepare
      - validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.base }}
      - uses: actions/download-artifact@v8
        with:
          name: package-updates
          path: ${{ runner.temp }}/package-updates
      - name: Apply package updates
        run: git apply "$RUNNER_TEMP/package-updates/package-updates.patch"

      - name: Commit package updates
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --update
          git commit --message "packages: update"
          git push origin "HEAD:$DEFAULT_BRANCH"

name: Update Packages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  NIX_CONFIG: |
    accept-flake-config = true

concurrency:
  group: update
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.updates.outputs.base }}
      changed: ${{ steps.updates.outputs.changed }}
      failed: ${{ steps.updates.outputs.failed }}
      packages: ${{ steps.updates.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-update-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-update-
          gc-max-store-size-linux: 2G

      - name: Update packages
        id: updates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          changed=()
          failed=()
          mkdir -p "$RUNNER_TEMP/per-package"

          for source in pkgs/*/source.ts; do
            directory="$(dirname "$source")"
            package="$(basename "$directory")"
            echo "::group::Update $package"

            if nix run .#update -- "$package"; then
              git add -- "$directory"
              if git diff --cached --quiet HEAD -- "$directory"; then
                echo "$package is already up to date"
              else
                git diff --cached HEAD --binary --full-index -- "$directory" \
                  >"$RUNNER_TEMP/per-package/$package.patch"
                changed+=("$package")
              fi
            else
              echo "::warning::Failed to update $package, continuing with other packages"
              failed+=("$package")
            fi

            echo "::endgroup::"
          done

          packages="$(
            printf '%s\n' "${changed[@]}" \
              | jq --raw-input --slurp --compact-output \
                'split("\n") | map(select(length > 0))'
          )"
          echo "base=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "packages=$packages" >>"$GITHUB_OUTPUT"

          if ((${#changed[@]} > 0)); then
            echo "changed=true" >>"$GITHUB_OUTPUT"
            git diff --cached HEAD --stat >>"$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "All packages are up to date." >>"$GITHUB_STEP_SUMMARY"
          fi

          if ((${#failed[@]} > 0)); then
            echo "failed=true" >>"$GITHUB_OUTPUT"
            echo "Failed to update: ${failed[*]}" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "failed=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Save package updates
        if: steps.updates.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: package-updates
          path: ${{ runner.temp }}/per-package
          if-no-files-found: error
          retention-days: 1

  validate:
    if: needs.prepare.outputs.changed == 'true'
    needs: prepare
    name: Validate ${{ matrix.package }} (${{ matrix.target.system }})
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.packages) }}
        target:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.base }}
      - uses: actions/download-artifact@v8
        with:
          name: package-updates
          path: ${{ runner.temp }}/package-updates
      - name: Apply package update
        run: git apply "$RUNNER_TEMP/package-updates/${{ matrix.package }}.patch"
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: so1ve
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build package
        env:
          PACKAGE: ${{ matrix.package }}
          SYSTEM: ${{ matrix.target.system }}
        run: |
          package_names="$(
            nix eval --raw ".#packages.$SYSTEM" \
              --apply 'packages: builtins.concatStringsSep "\n" (builtins.attrNames packages)'
          )"

          if grep --fixed-strings --line-regexp --quiet "$PACKAGE" <<<"$package_names"; then
            nix build ".#packages.$SYSTEM.$PACKAGE" --print-build-logs
          else
            echo "$PACKAGE is not available on $SYSTEM; skipping"
          fi

      - name: Record validation result
        if: always()
        env:
          PACKAGE: ${{ matrix.package }}
          SYSTEM: ${{ matrix.target.system }}
        run: |
          mkdir -p "$RUNNER_TEMP/validation/$PACKAGE"
          echo "${{ job.status }}" >"$RUNNER_TEMP/validation/$PACKAGE/$SYSTEM"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validated-${{ matrix.package }}-${{ matrix.target.system }}
          path: ${{ runner.temp }}/validation
          if-no-files-found: error
          retention-days: 1

  collect:
    if: ${{ always() && needs.prepare.outputs.changed == 'true' }}
    needs:
      - prepare
      - validate
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.collect.outputs.changed }}
      packages: ${{ steps.collect.outputs.packages }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: validated-*
          path: ${{ runner.temp }}/validated
          merge-multiple: true

      - name: Collect publishable packages
        id: collect
        env:
          PACKAGES: ${{ needs.prepare.outputs.packages }}
        run: |
          publishable=()
          failed=()

          while IFS= read -r package; do
            result_directory="$RUNNER_TEMP/validated/$package"
            if [[ -f "$result_directory/x86_64-linux" \
              && -f "$result_directory/aarch64-linux" \
              && "$(<"$result_directory/x86_64-linux")" == success \
              && "$(<"$result_directory/aarch64-linux")" == success ]]; then
              publishable+=("$package")
            else
              failed+=("$package")
            fi
          done < <(jq --raw-output '.[]' <<<"$PACKAGES")

          packages="$(
            printf '%s\n' "${publishable[@]}" \
              | jq --raw-input --slurp --compact-output \
                'split("\n") | map(select(length > 0))'
          )"
          echo "packages=$packages" >>"$GITHUB_OUTPUT"

          if ((${#publishable[@]} > 0)); then
            echo "changed=true" >>"$GITHUB_OUTPUT"
          else
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "No packages passed validation." >>"$GITHUB_STEP_SUMMARY"
          fi

          if ((${#failed[@]} > 0)); then
            echo "::warning::Validation failed for: ${failed[*]}; skipping their updates"
            echo "Validation failed, skipped: ${failed[*]}" >>"$GITHUB_STEP_SUMMARY"
          fi

  publish:
    if: ${{ always() && needs.collect.outputs.changed == 'true' }}
    needs:
      - prepare
      - collect
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.base }}
      - uses: actions/download-artifact@v8
        with:
          name: package-updates
          path: ${{ runner.temp }}/package-updates

      - name: Apply validated package updates
        env:
          PACKAGES: ${{ needs.collect.outputs.packages }}
        run: |
          while IFS= read -r package; do
            git apply "$RUNNER_TEMP/package-updates/$package.patch"
            git add -- "pkgs/$package"
            echo "Applied update for $package"
          done < <(jq --raw-output '.[]' <<<"$PACKAGES")

      - name: Commit package updates
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PACKAGES: ${{ needs.collect.outputs.packages }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          package_names="$(jq --raw-output 'join(", ")' <<<"$PACKAGES")"
          git commit --message "packages: update $package_names"
          git push origin "HEAD:$DEFAULT_BRANCH"

  report:
    if: ${{ always() && needs.prepare.outputs.failed == 'true' }}
    needs:
      - prepare
      - publish
    runs-on: ubuntu-24.04
    steps:
      - name: Report updater failures
        run: |
          echo "::error::One or more package updaters failed; see the prepare job summary."
          exit 1

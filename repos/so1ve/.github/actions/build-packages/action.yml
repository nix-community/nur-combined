name: Build flake packages
description: Build selected or all flake packages for one system

inputs:
  system:
    description: Flake system to build
    required: true
  targets:
    description: Optional JSON array of flake installables to build
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Build packages
      shell: bash
      env:
        NIXPKGS_ALLOW_UNFREE: "1"
        SYSTEM: ${{ inputs.system }}
        TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail

        targets=()
        if [[ -n "$TARGETS" ]]; then
          mapfile -t targets < <(jq --raw-output '.[]' <<<"$TARGETS")
        else
          mapfile -t targets < <(
            nix eval --impure --json ".#packages.$SYSTEM" \
              --apply 'packages: builtins.attrNames (builtins.removeAttrs packages [ "baidunetdisk" ])' \
              | jq --raw-output --arg system "$SYSTEM" '.[] | ".#packages." + $system + "." + tojson + "^*"'

            nix eval --json ".#legacyPackages.$SYSTEM.cached" \
              --apply 'packages: builtins.attrNames packages' \
              | jq --raw-output --arg system "$SYSTEM" '.[] | ".#legacyPackages." + $system + ".cached." + tojson + "^*"'
          )
        fi

        if ((${#targets[@]} == 0)); then
          echo "No packages to build for $SYSTEM"
          exit 0
        fi

        printf 'Building %d target(s) for %s:\n' "${#targets[@]}" "$SYSTEM"
        printf '  %s\n' "${targets[@]}"

        if [[ -n "${FIRN_PATHS_FILE:-}" ]]; then
          nix build --impure --no-link --keep-going --print-build-logs --print-out-paths "${targets[@]}" >>"$FIRN_PATHS_FILE"
        else
          nix build --impure --no-link --keep-going --print-build-logs "${targets[@]}"
        fi

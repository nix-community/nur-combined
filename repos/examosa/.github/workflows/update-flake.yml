name: "Update flake inputs"

on:
  schedule:
    # Sundays at 4:05 AM
    - cron: "5 4 * * 0"

  workflow_dispatch:

jobs:
  update:
    name: Update
    timeout-minutes: 10

    runs-on: ubuntu-latest

    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: "${{ secrets.APP_CLIENT_ID }}"
          private-key: "${{ secrets.APP_PRIVATE_KEY }}"

      - name: Get app user ID
        id: app-user-id
        uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae # v3.0.0
        with:
          route: "GET /users/{user}"
          user: "${{ steps.app-token.outputs.app-slug }}[bot]"
        env:
          GITHUB_TOKEN: "${{ steps.app-token.outputs.token }}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: "${{ steps.app-token.outputs.token }}"

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          github-token: "${{ steps.app-token.outputs.token }}"

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          token: "${{ steps.app-token.outputs.token }}"
          git-author-name: "${{ steps.app-token.outputs.app-slug }}[bot]"
          git-author-email: "${{ fromJson(steps.app-user-id.outputs.data).id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          commit-msg: "build(deps): update flake.lock"
          pr-title: "Update `flake.lock`"
          pr-assignees: "${{ github.repository_owner }}"
          pr-body: |
            Automated changes by the [update-flake-lock](https://github.com/DeterminateSystems/update-flake-lock) GitHub Action.

            ```
            {{ env.GIT_COMMIT_MESSAGE }}
            ```

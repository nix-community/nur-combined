name: "Build and populate cache"

on:
  pull_request:

  push:
    branches:
      - main

  schedule:
    # Mondays and Fridays at 2:50 AM
    - cron: "50 2 * * 1/5"

  workflow_dispatch:

concurrency:
  group: "ci-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build
    timeout-minutes: 120

    strategy:
      fail-fast: false

      matrix:
        nixPath:
          - nixpkgs=channel:nixpkgs-unstable
          - nixpkgs=channel:nixos-unstable
          - nixpkgs=channel:nixos-26.05

        os:
          - ubuntu-latest

        include:
          - nixPath: nixpkgs=channel:nixpkgs-unstable
            os: macos-latest

    runs-on: "${{ matrix.os }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          nix_path: "${{ matrix.nixPath }}"
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ github.token }}

      - name: Show nixpkgs version
        run: nix eval --raw --file '<nixpkgs>' lib.version

      - name: Setup cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: "${{ github.repository_owner }}"
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Check evaluation
        run: >
          nix-env --file .
          --query --available \*
          --meta --xml
          --allowed-uris https://static.rust-lang.org
          --option restrict-eval true
          --option allow-import-from-derivation true
          --drv-path --show-trace
          -I "nixpkgs=$(nix-instantiate --find-file nixpkgs)"
          -I "${PWD}"

      - name: Build nix packages
        run: >
          nix run --file '<nixpkgs>' nix-fast-build --
          --no-nom --skip-cached --file ci.nix --attr cacheOutputs

      - name: Trigger NUR update
        run: >
          curl --request POST --silent
          --url-query 'repo=${{ github.repository_owner }}'
          https://nur-update.nix-community.org/update

name: "Auto update packages"
on:
    workflow_dispatch:
    schedule:
        - cron: "10 3 * * *"
jobs:
    build:
        name: update
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Generate GitHub App Token
              id: app-token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
              with:
                  client-id: ${{ secrets.APP_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}
                  permission-contents: write

            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  token: ${{ steps.app-token.outputs.token }}

            - name: Configure GitHub App identity
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
              run: |
                  app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
                  git config user.name "${APP_SLUG}[bot]"
                  git config user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

            - name: Prepare Nix Environment
              uses: ./.github/prepare-nix
              with:
                  GH_PAT: ${{ steps.app-token.outputs.token }}
                  ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
                  ATTIC_SERVER: ${{ vars.ATTIC_SERVER }}
                  ATTIC_CACHE: ${{ vars.ATTIC_CACHE }}
                  ONLY_NIX: true

            - name: Flake update
              run: |
                  nix flake update --commit-lock-file
                  pushd flake-modules/dev
                  nix flake update --commit-lock-file
                  popd
                  fetchrix_src=$(nix eval --impure --raw --expr '(builtins.getFlake (toString ./flake-modules/dev)).inputs.fetchrix.outPath')
                  cp "$fetchrix_src/nix/lib.nix" lib/fetchrix-lib.nix

            - name: Fetch new versions
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
              run: nix develop -c update-packages

            - name: Run custom package updaters
              run: |
                  export NIXPKGS_ALLOW_UNFREE=1
                  nix shell nixpkgs#curl nixpkgs#jq nixpkgs#moreutils --inputs-from . \
                    -c bash pkgs/by-name/qq/qqmusic/update.sh
                  nix shell nixpkgs#python3 nixpkgs#coreutils nixpkgs#git --inputs-from . \
                    -c bash pkgs/by-name/bw/bw-ssh-agent-filter/update.sh

            - name: Commit changes
              run: |
                  git add _sources pkgs/by-name lib/fetchrix-lib.nix
                  git diff --staged --quiet || git commit -m "chore: update package sources and dependencies"
                  git push
                  curl -XPOST https://nur-update.nix-community.org/update?repo=moraxyc

name: Sensitive
on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["*"]

jobs:
  check-sensitive:
    name: Key Material Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: detect
        run: |
          #!/bin/bash
          pattern='AGE-SECRET-KEY-|-----BEGIN ([A-Z0-9]+ )*PRIVATE KEY( BLOCK)?-----'

          if git grep -l -I -E "$pattern" -- . \
            ':(exclude).github/workflows/sensitive.yaml' \
            ':(exclude)tests/realm-spire-http.nix'; then
            echo "发现疑似私钥，请检查以上文件"
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
          fi
        shell: bash

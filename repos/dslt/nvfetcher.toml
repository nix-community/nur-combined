# --------------------------------------------------------------------------
# Commit-tracked sources (no usable releases/tags upstream)
# --------------------------------------------------------------------------

[hhsh]
src.git = "https://github.com/yihong0618/nbnhhsh-cli"
fetch.github = "yihong0618/nbnhhsh-cli"
git.date_tz = "UTC"

[linuxqq-clipsync]
src.git = "https://github.com/SHORiN-KiWATA/linuxqq-clipsync"
fetch.github = "SHORiN-KiWATA/linuxqq-clipsync"
git.date_tz = "UTC"
# Cargo.lock is extracted and re-hashed, so the copy inside the repository is
# not needed any more.
cargo_lock = ["Cargo.lock"]

[qq-wlss]
src.git = "https://github.com/SHORiN-KiWATA/linuxqq-wayland-screenshare-fix"
fetch.github = "SHORiN-KiWATA/linuxqq-wayland-screenshare-fix"
git.date_tz = "UTC"

# --------------------------------------------------------------------------
# Non-GitHub upstream
# --------------------------------------------------------------------------

[xwaylandvideobridge]
# KDE keeps releasing this from the stable tree; the directory listing is the
# canonical index. Fetching from download.kde.org directly (instead of
# mirror://kde/) is what makes the source hash trackable.
src.webpage = "https://download.kde.org/stable/xwaylandvideobridge/src/"
src.regex = 'xwaylandvideobridge-([0-9.]+)\.tar\.xz'
fetch.url = "https://download.kde.org/stable/xwaylandvideobridge/src/xwaylandvideobridge-$ver.tar.xz"

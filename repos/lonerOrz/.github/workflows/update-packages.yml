name: update custom packages

on:
  schedule:
    - cron: "0 17 * * *" # UTC
  workflow_dispatch:
    inputs:
      package:
        description: "Optional: Specific package to update (e.g., mpv-handler)"
        required: false

jobs:
  update-packages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install nix-update environment
        run: |
          nix-channel --add https://nixos.org/channels/nixpkgs-unstable nixpkgs
          nix-channel --update
          nix-env -iA nixpkgs.nix-update nixpkgs.nix-prefetch-git nixpkgs.prefetch-npm-deps nixpkgs.jq nixpkgs.nodejs

      - name: new branch
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'

          git checkout -b auto/update-custom-packages-${{ github.run_id }}

      - name: Run update script
        id: update
        run: |
          if [[ -n "${{ github.event.inputs.package }}" ]]; then
            SUMMARY=$(python3 .github/script/update-nix.py --package ${{ github.event.inputs.package }} 2>/dev/null | tail -1)
          else
            SUMMARY=$(python3 .github/script/update-nix.py 2>/dev/null | tail -1)
          fi
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

      - name: Update summary
        if: always()
        env:
          SUMMARY: ${{ steps.update.outputs.summary }}
        run: |
          {
            echo "## 自动更新结果"
            echo
            echo "**$(echo "$SUMMARY" | jq -r '"\(.updated) 更新 / \(.skipped) 跳过 / \(.failed) 失败"')**"
            echo
            echo "### 更新失败的应用"
            echo
            echo "$SUMMARY" | jq -r '.packages[] | select(.status=="failed") | "- **\(.pkg)**：\(.detail)"'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push changes to new branch
        id: commit
        run: |
          git add pkgs/
          git status
          if git diff --staged --quiet -- pkgs/; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            bash .github/script/commit.sh
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push -u origin HEAD
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request via gh
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SUMMARY: ${{ steps.update.outputs.summary }}
        run: |
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          HEAD_REF="auto/update-custom-packages-${{ github.run_id }}"

          gh pr create \
            --title "Chore: auto update custom packages - $DATE" \
            --body "This PR was created automatically by GitHub Actions." \
            --base master \
            --head "$HEAD_REF"

          gh pr edit "$HEAD_REF" \
            --add-label auto_update_custom_package \
            --add-label github_actions

          FAIL_BODY=$(echo "$SUMMARY" | jq -r '
            "## 更新失败的应用\n\n**" + (.updated | tostring) + " 更新 / " + (.skipped | tostring) + " 跳过 / " + (.failed | tostring) + " 失败**\n\n以下应用本次更新失败，请检查上游或更新脚本：\n\n" + (
              [.packages[] | select(.status=="failed") | "- **" + .pkg + "**：" + (.detail // "")] | join("\n")
            )')
          if echo "$SUMMARY" | jq -e '.failed > 0' >/dev/null; then
            gh pr comment "$HEAD_REF" --body "$FAIL_BODY"
          fi
